<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="en" class="covered">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a242c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Keel Over the Edge</title>
    <!-- The card a link shows where it is posted: the same for every
         address, a link to watch a sailor or not, so it says nothing of
         any sailor. No og:url: one address for all would send a site's
         card to the game's front page, without the link's code. -->
    <meta name="description" content="Sail, or watch a sailor, on a flat world with an edge." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keel Over the Edge" />
    <meta property="og:title" content="Keel Over the Edge" />
    <meta property="og:description" content="Sail, or watch a sailor, on a flat world with an edge." />
    <meta property="og:image" content="https://play.keelovertheedge.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The game’s icon" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Keel Over the Edge" />
    <meta name="twitter:description" content="Sail, or watch a sailor, on a flat world with an edge." />
    <meta name="twitter:image" content="https://play.keelovertheedge.com/icon-512.png" />
    <!-- The cover, the first thing painted, before any script: the sea's
         slate, the game's icon and its name, and a line for what it waits
         for, until the world under it is ready. -->
    <style>
      @font-face {
        font-family: "IM Fell English SC";
        font-display: swap;
        src: url("/src/fonts/IMFellEnglishSC-Regular.woff2") format("woff2");
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a242c;
      }

      .cover {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 16px;
        background: linear-gradient(#22303a, #1a242c 45%, #0c1216);
        color: #f2efe7;
        opacity: 1;
        transition: opacity 0.3s ease-in;
      }

      .cover.lifting {
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--lift, 0.8s) ease-out;
      }

      .cover[hidden] {
        display: none;
      }

      .cover-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }

      .cover-icon {
        width: 128px;
        height: 128px;
        border-radius: 28px;
      }

      .cover-name {
        margin: 0;
        font:
          30px / 1.1 "IM Fell English SC",
          Georgia,
          serif;
        color: #e8b450;
      }

      .cover-line {
        min-height: 1.35em;
        margin: 0;
        font:
          16px / 1.35 system-ui,
          sans-serif;
        color: rgb(242 239 231 / 70%);
      }

      /* A start panel stands on the cover's ground alone. */
      body:has(.start) .cover-mark {
        visibility: hidden;
      }
    </style>
    <script type="module" src="/src/boot/main.ts"></script>
  </head>
  <body class="game">
    <div class="cover" id="cover">
      <div class="cover-mark">
        <img
          class="cover-icon"
          src="/icon-192.png"
          srcset="/icon-192.png 192w, /icon-512.png 512w"
          sizes="128px"
          width="128"
          height="128"
          alt=""
        />
        <p class="cover-name">Keel Over the Edge</p>
        <p class="cover-line" role="status"></p>
        <noscript><p class="cover-line">Keel Over the Edge needs JavaScript.</p></noscript>
      </div>
    </div>
  </body>
</html>
