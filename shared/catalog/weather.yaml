# SPDX-License-Identifier: AGPL-3.0-only
# The weather's numbers.
weather:
  # The waves long enough to move a boat. The sea is a sum of waves with
  # fixed lengths and directions; the wind and its fetch give each its height
  # by the JONSWAP spectrum (Hasselmann and others 1973).
  sea:
    shortest: 8 # m: what tiles 4 m across can carry
    # m: a 7 s wave, longer than the swell the sea will carry and than the
    # longest wind sea the fetch below raises in a storm.
    longest: 76
    gamma: 3.3 # JONSWAP's mean peak enhancement
    sigmaBelow: 0.07 # JONSWAP
    sigmaAbove: 0.09 # JONSWAP
    # cos²ˢ(θ/2) about the wind (Mitsuyasu and others 1975). Goda and Suzuki
    # give 10 for wind waves, which is narrower.
    spreading: 5
    fetchCap: 6 # nautical miles of open water
    cull: 0.10
    # In shallow water the waves' significant height is capped at this share
    # of the depth, as in the inner surf zone, where it is 0.4–0.5 since the
    # largest waves are about twice Hs (Bosboom and Stive, Coastal Dynamics,
    # 5.2.5; a regular wave breaks at 0.78 of the depth, McCowan 1894).
    breaking: 0.5

  # The wind over the disk.
  disk:
    # The wind's speed rises from the centre to the rim: a spell's wind is
    # its wind at mid-disk, 2.1 nautical miles out, times
    # speedCentre + (speedRim − speedCentre) × a smooth step from the centre
    # to the mist band.
    speedCentre: 0.65
    speedRim: 1.35
    rim: 4.2 # nautical miles: the mist band
    # The refuge at the centre: within refugeInner its limits hold in full,
    # beyond refugeOuter not at all, and between them they blend. The mean
    # wind above its knee is passed through knee + soft × tanh((v − knee) /
    # soft), soft the limit less the knee, so that it nears the limit and
    # never passes it; then the wind with its gusts the same way.
    refugeInner: 1 # nautical miles: the refuge's own radius
    refugeOuter: 1.4 # nautical miles
    refugeMeanKnee: 10 # knots
    refugeMean: 14 # knots: Beaufort 4
    refugeWindKnee: 14 # knots
    refugeWind: 18 # knots: rising to 5 in the gusts
    # Gusts are stronger in the outer waters: the gust factor's excess over
    # 1 grows by this share from rimGustsFrom to the rim.
    rimGusts: 0.3
    rimGustsFrom: 3 # nautical miles
    # The wind's direction differs from one side of the disk to the other
    # along an axis that turns once in this many hours, drawn per spell.
    acrossTurn: [4, 8]
    # The lip of the falls, where the disk ends: world.disk.radius in
    # nautical miles, which the catalog's check holds it to.
    edge: 4.5
    # The falls draw the air toward the lip: from nothing at fallDraftFrom
    # to fallDraft at the lip, linearly, blowing toward the lip. It is the
    # falls' and not the weather's, so it blows in a steady spell too, and
    # the wind that raises the sea leaves it out: over the band's few hundred
    # metres of fetch it would raise nothing.
    fallDraftFrom: 4.2 # nautical miles: the mist band
    fallDraft: 4 # knots at the lip

  # Gusts and lulls: gradient noise in three octaves, each with cells and a
  # life half its predecessor's, carried downwind as one body. Sailors find
  # gusts 100–200 m across the wind in a breeze, longer along it, lasting two
  # to four minutes on the water (Bethwaite 2008, chapter 4): these cells
  # give patches about 150 m along and 100 m across, which keep 0.9 of their
  # shape over 30 s and 0.7 over a minute, so a gust seen 150 m upwind
  # arrives.
  gusts:
    gustAlong: 300 # m: the largest cells along the wind
    gustAcross: 200 # m: and across it
    gustLife: 240 # s: and in time
    gustSpeed: 0.9 # the field travels at this share of a spell's wind at mid-disk
    gustVeer: 8 # degrees: the strongest gust veers by this, the deepest lull backs by half
    change: 10 # minutes: one spell gives way to the next over this

  # The water's own motion: a slow circulation round the disk, its way
  # drawn per world, and the drain toward the falls, running faster toward
  # the lip. Each is linear between its points, nothing before the first and
  # its last value beyond the last; both fall off in water shallower than
  # shallow, in proportion to its depth, and are nothing over land. The
  # refuge's water, with every start place in it, is still.
  current:
    circulationAt: [1, 1.4, 3.5] # nautical miles
    circulation: [0, 0.2, 0.5] # knots at those points
    drainAt: [3.5, 4.2, 4.5] # nautical miles: the last is the lip
    drain: [0, 0.6, 2] # knots at those points
    shallow: 3 # m

  # The beginners' ring round a gust heading for the boat, drawn by the
  # client from the gust field: each patch of a gust factor at least
  # threshold of the way from 1 to the spell's, whose track passes within
  # reach of the boat within horizon, gets one, and at most rings of them.
  ring:
    threshold: 0.5
    spacing: 8 # m: the grid the field is sampled on upwind of the boat
    depth: 240 # m upwind
    width: 160 # m across the wind
    reach: 30 # m
    horizon: 60 # s
    rings: 3
    rate: 4 # samplings a second

  # The wind that raises the waves, for the sea lags the wind: an
  # exponential average of the mean wind, its gusts left out, at each sea
  # area's centre. Over the open water's fetch a real sea takes two to three
  # hours to build (Coastal Engineering Manual, 2008, II-2); at the world's
  # pace, twelve times the real one, that is ten to fifteen minutes, and an
  # average with a time constant of four minutes reaches 95% in twelve.
  waveWind:
    waveTimeConstant: 240 # s
    waveSample: 30 # s between samples
    waveSamples: 40 # the rest weigh under 0.7% together

  # Regimes: the kinds of spell. Their wind is drawn, spell by spell, from
  # these ranges; a spell's shifts swing two thirds and one third of shift,
  # with periods in the range at least a minute and a half apart. share is
  # the regime's share of the world's time, which the week keeps; spell how
  # long a spell of it lasts, hours; pressure its level, hPa; next the
  # regimes a spell of it gives way to, with the chance of each; systems the
  # systems born in it an hour over the disk, and at its start. A spell of
  # a frontal regime arrives and leaves as a front does. The table is fitted
  # to the shares: its long-run shares are 23, 42, 23 and 12 in a hundred.
  # The gust factors are those of the waters dinghies race in; the open
  # sea's are smaller (WMO/TD-No. 1555, 2010, Table 1.1).
  regimes:
    - id: settled
      share: 0.25
      frontal: false
      spell: [3, 8]
      pressure: [1020, 1030]
      next:
        - { to: trade, chance: 1 }
      systems:
        - { kind: fog, rate: 1.5, atStart: 0 }
        - { kind: light-air, rate: 2, atStart: 0 }
        - { kind: shower, rate: 0.5, atStart: 0 }
      wind:
        speed: [3, 9] # knots at mid-disk
        gustFactor: 1.2
        shift: 5 # degrees each way
        period: [6, 10] # minutes
        across: 5 # degrees
        drift: 20 # degrees
    - id: trade
      share: 0.40
      frontal: false
      spell: [4, 10]
      pressure: [1012, 1020]
      next:
        - { to: settled, chance: 0.7 }
        - { to: unsettled, chance: 0.3 }
      systems:
        - { kind: shower, rate: 2, atStart: 0 }
        - { kind: light-air, rate: 1, atStart: 0 }
        - { kind: squall, rate: 0.3, atStart: 0 }
      wind:
        speed: [10, 16]
        gustFactor: 1.3
        shift: 8
        period: [5, 8]
        across: 5
        drift: 20
    - id: unsettled
      share: 0.25
      frontal: true
      spell: [2, 6]
      pressure: [1000, 1012]
      next:
        - { to: trade, chance: 0.31 }
        - { to: stormy, chance: 0.69 }
      systems:
        - { kind: squall, rate: 1.5, atStart: 0 }
        - { kind: shower, rate: 3, atStart: 0 }
      wind:
        speed: [12, 20]
        gustFactor: 1.45
        shift: 12
        period: [4, 7]
        across: 5
        drift: 20
    - id: stormy
      share: 0.10
      frontal: true
      spell: [2, 4]
      pressure: [990, 1005]
      next:
        - { to: unsettled, chance: 1 }
      systems:
        - { kind: storm, rate: 0, atStart: 1 }
        - { kind: squall, rate: 2, atStart: 0 }
        - { kind: shower, rate: 2, atStart: 0 }
      wind:
        speed: [16, 24]
        gustFactor: 1.5
        shift: 12
        period: [4, 7]
        across: 5
        drift: 20

  # A front: a straight line across the disk, lying in a trough. Ahead of it
  # the old spell blows, behind it the new, blended within blend of the
  # line. The trough deepens toward the line as e^(−s / troughAhead) and
  # fills behind it within troughBehind, a Gaussian's width; its wind is the
  # trough's gradient turned frontTurning clockwise, frontWind at its
  # steepest, so the wind backs and freshens ahead of the line and veers as
  # it passes, as sailors meet a cold front (Royal Yachting Association,
  # Weather Handbook; Great Lakes Sailing, Weather Fronts). Behind it the
  # gusts are stronger over gustsBehind.
  front:
    troughAhead: 1.1 # nautical miles
    troughBehind: 0.35 # nautical miles
    frontWind: 7 # knots
    frontTurning: 70 # degrees
    blend: 0.12 # nautical miles either side of the line
    frontGusts: 0.15 # the gust factor's excess rises by this behind the line
    gustsBehind: 1 # nautical miles

  # The pressure: each spell's level, drawn in its regime's range, sloping
  # gently across the disk with low pressure on the left of the base wind,
  # so that Buys Ballot's law holds of the spell's own wind (American
  # Meteorological Society, Glossary of Meteorology, Buys Ballot's law);
  # rising behind a front; and each system's shape.
  pressure:
    slope: 0.02 # hPa a knot of the base wind a nautical mile
    rise: 0.15 # hPa a minute behind a front's line
    riseMost: 6 # hPa

  # How far the systems reach. A front's, a squall's and a shower's wind
  # falls toward Port Royal to inwardLeast of itself within inwardFrom of
  # the centre, and is whole beyond inwardTo; a storm's falls to nothing. A
  # system's pressure and wind end cut of its widths from its centre, where
  # its wind is under a five-hundredth of its peak.
  reach:
    inwardFrom: 0.8 # nautical miles
    inwardTo: 3 # nautical miles
    inwardLeast: 0.35
    cut: 4 # widths

  # The kinds of weather system. Each is a pressure shape moving with it: a
  # dome steeper on its leading edge (the gust front), a low (a core whose
  # width is the ring of strongest wind, and a broad shallow low about it,
  # so the barometer falls well ahead), or none, a patch that scales the
  # wind. Its wind blows toward lower pressure, turned clockwise by turning:
  # a storm's is the gradient wind less a cross-isobar angle of 20°, within
  # the 10–25° over water friction gives (American Meteorological Society,
  # Glossary of Meteorology, cross-isobar angle); a squall's outflow too
  # small and quick for the earth's turning to matter blows almost straight
  # out of its dome. size is its radius; width its pressure's Gaussian width
  # as a share of it; wind what it adds at its peak, at full strength, or
  # for a patch factor the wind's share at its core; speed a share of the
  # base wind, or knots for a kind that keeps to the outer waters.
  #
  # Where it is born: track wind is born beyond the windward rim and
  # crosses with the wind on a chord; outer beyond the windward rim, then
  # round the outer waters, one in inwardShare turning in; drift inside the
  # disk, drifting with the wind, by day islands of them over land; a kind
  # with night is born only at night or within dawn minutes of sunrise and
  # lifts lift minutes after it; calmBelow and goneAbove are the spell's
  # wind it needs, knots, 0 for none. rain, cloud and lightning are for
  # drawing them.
  systems:
    - id: squall
      shape: dome
      turning: 10 # degrees
      width: 0.7
      ahead: 1.6
      broad: [0, 1]
      stretch: 1
      inward: weak
      gusts: 0.15
      size: [0.3, 0.6] # nautical miles
      speed: [0.6, 0.9]
      speedOf: wind
      life: [20, 50] # minutes
      wind: [12, 18] # knots
      factor: [1, 1]
      depth: [2, 4] # hPa
      track: wind
      islands: 0
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 0
      goneAbove: 0
      rain: heavy
      cloud: cumulonimbus
      lightning: 0.7
    - id: shower
      shape: dome
      turning: 10
      width: 0.7
      ahead: 1.6
      broad: [0, 1]
      stretch: 1
      inward: weak
      gusts: 0.1
      size: [0.15, 0.35]
      speed: [0.9, 1]
      speedOf: wind
      life: [10, 25]
      wind: [4, 8]
      factor: [1, 1]
      depth: [1, 1]
      track: drift
      islands: 0.5
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 0
      goneAbove: 0
      rain: moderate
      cloud: cumulus
      lightning: 0
    - id: storm
      shape: low
      turning: 70
      width: 0.6
      ahead: 1
      broad: [0.333, 3]
      stretch: 1
      inward: gone
      gusts: 0.04
      size: [1.5, 2.5]
      speed: [3, 6]
      speedOf: knots
      life: [60, 180]
      wind: [18, 26]
      factor: [1, 1]
      depth: [10, 20]
      track: outer
      islands: 0
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 0
      goneAbove: 0
      rain: heavy
      cloud: cumulonimbus
      lightning: 0.75
    - id: fog
      shape: none
      turning: 0
      width: 0.5
      ahead: 1
      broad: [0, 1]
      stretch: 2
      inward: none
      gusts: 0
      size: [0.4, 1.5]
      speed: [0.8, 0.8]
      speedOf: wind
      life: [20, 90]
      wind: [0, 0]
      factor: [0.9, 0.9]
      depth: [0, 0]
      track: drift
      islands: 0
      night: true
      dawn: 30 # minutes
      lift: [15, 30] # minutes after sunrise
      calmBelow: 8 # knots
      goneAbove: 12 # knots
      rain: none
      cloud: fog
      lightning: 0
    - id: light-air
      shape: none
      turning: 0
      width: 0.5
      ahead: 1
      broad: [0, 1]
      stretch: 1
      inward: none
      gusts: 0
      size: [0.2, 0.5]
      speed: [1, 1]
      speedOf: wind
      life: [10, 30]
      wind: [0, 0]
      factor: [0.3, 0.5]
      depth: [0, 0]
      track: drift
      islands: 0
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 10
      goneAbove: 0
      rain: none
      cloud: none
      lightning: 0

  # The week: each world's weather, made with it from its seed for its
  # epoch and end, and stored. Its spells are a chain from the regimes'
  # transition table, each spell's length drawn in its regime's range,
  # covering the world and margin hours beyond its end. A front crosses the
  # disk at every change into or out of a frontal regime, its line crossing
  # the centre at the change, moving toward where the new spell's wind
  # blows within spread, at frontSpeed; one front is on the disk at a time.
  # As a front passes the wind veers by veer; at other changes it moves
  # either way by up to swing. A week is drawn again until it opens with
  # opening hours of weather of no frontal regime and no front on the disk,
  # closes with closing hours of one spell of closingRegime, has a spell of
  # no frontal regime fair hours long or more, and, for a world of
  # sharesFrom days or more, keeps each regime's share within shares; after
  # draws, the best drawn is kept.
  # Each system wobbles off its track by up to wobble, and its strength by
  # strengthWobble, each with periods in wobblePeriod; at most systemsMost
  # are on the disk at once. Storms keep to the outer waters. seed draws a
  # developer's held spells.
  week:
    opening: 2 # hours
    closing: 2 # hours
    closingRegime: trade
    fair: 6 # hours
    shares: 0.05
    sharesFrom: 3 # days
    margin: 24 # hours
    draws: 1000
    veer: [40, 90] # degrees
    swing: 30 # degrees
    frontSpeed: [4, 8] # knots
    frontTrough: [3, 6] # hPa
    spread: 15 # degrees
    wobble: 0.4 # nautical miles
    wobblePeriod: [20, 60] # minutes
    strengthWobble: 0.15
    systemsMost: 16
    outer: [3, 4.5] # nautical miles
    inwardShare: 0.2
    seed: 1852

  # The systems' keyframes: the simulation reads each system's place,
  # motion, strength and size from the week every so often, and the server
  # and the phone both interpolate between them.
  keyframe:
    every: 10 # s

  # The water's signs: the phone samples the mean wind round the camera on
  # a grid so often, and the tiles roughen and darken where it is stronger
  # than the wave wind and go glassy where it is lighter.
  water:
    points: 24 # a side
    spacing: 12.5 # m
    rate: 4 # a second
