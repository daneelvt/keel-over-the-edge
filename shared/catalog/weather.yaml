  # The week: each world's weather, made with it from its seed for its
  # epoch and end, and stored. Its spells are a chain from the regimes'
  # transition table, each spell's length drawn in its regime's range,
  # covering the world and margin hours beyond its end. A front crosses the
  # disk at every change into or out of a frontal regime, its line crossing
  # the centre at the change, moving toward where the new spell's wind
  # blows within spread, at frontSpeed; one front is on the disk at a time.
  # A change from a regime of no front into a frontal one comes as a warm
  # front, its rain ahead of its line and the wind veering by warmVeer as
  # it passes; every other front is a cold front, its rain behind its line,
  # the gusts surging, the wind veering by veer. At other changes the wind
  # moves either way by up to swing. A week is drawn again until it opens with
  # opening hours of weather of no frontal regime and no front on the disk,
  # closes with closing hours of one spell of closingRegime, has a spell of
  # no frontal regime fair hours long or more, and, for a world of
  # sharesFrom days or more, keeps each regime's share within shares; after
  # draws, the best drawn is kept.
  # A regime's systems are born at rate an hour, and atStart as a spell
  # begins, their peak wind drawn from the peak shares of their kind's
  # range, when at any time, by day or at night only.
  # Each system wobbles off its track by up to wobble, and its strength by
  # strengthWobble, each with periods in wobblePeriod; at most systemsMost
  # are on the disk at once, and at most storms.most of storms.kind. The
  # kinds of quiet are not born in the world's first quiet.hours, nor in
  # its closing spell, and in a spell of a regime of no front no storm
  # turns inward: the rush to discover, the closing race and the fair spell
  # stay fair. Ahead of every cold front into lineAhead.into a line of
  # lineAhead.kind is born, ahead of its line, moving with it. Wherever the
  # disk would be empty after the opening, nothing within the lip, a system
  # of fill is born ten minutes before. The kinds
  # that keep to the outer waters are born within outer of the centre.
  # seed draws a developer's held spells.
  week:
    opening: 2 # hours
    closing: 2 # hours
    closingRegime: trade
    fair: 6 # hours
    shares: 0.05
    sharesFrom: 3 # days
    margin: 24 # hours
    draws: 1000
    veer: [40, 90] # degrees
    warmVeer: [20, 40] # degrees
    swing: 30 # degrees
    frontSpeed: [4, 8] # knots
    frontTrough: [3, 6] # hPa
    spread: 15 # degrees
    # A wobble of 0.5 NM over 6–12 hours bends a system's track slowly off
    # its line, as a real one wanders.
    wobble: 0.5 # nautical miles
    wobblePeriod: [360, 720] # minutes
    strengthWobble: 0.15
    systemsMost: 24
    storms: { kind: storm, most: 2 }
    quiet: { hours: 2, kinds: [storm, squall-line] }
    lineAhead: { kind: squall-line, into: stormy, ahead: [0.5, 1] } # nautical miles
    fill: depression
    outer: [3, 4.5] # nautical miles
    seed: 1852

  # The forecast, issued at each every minutes of world time from the
  # world's epoch for the next horizon minutes in steps of step minutes,
  # the same on the server, every phone and the sandbox. It is the truth:
  # the records of every system alive at the issue or born within its
  # horizon and one issue more, wobble and all, so the chart places every
  # shower where it will be, to the minute; the spells as they will blow,
  # their shifts named, not placed, as the gusts are left out; and each
  # front's line where it will be. Keel is not meant to be hard: a sailor
  # planning a route to a storm must know where the storm will be.
  #
  # Its gale warnings: from the synoptic wind of each issue (the spells,
  # the fronts, the lows and the patches, not the squalls, showers and
  # lines) at
  # each step, on a grid of gale.grid nautical miles over the water within
  # gale.within: a gale where the mean wind reaches gale.mean knots or the
  # typical strongest gust gale.gust (Met Office: gale "force 8 (34-40
  # knots) or gusts reaching 43-51 knots"), the typical strongest gust the
  # mean times 1 + E (gale.quantile − 0.0821), E the gust factor's excess
  # and gale.quantile the gust field's 90th percentile.
  #
  # A place's outlook: the next horizon minutes from the issue, sampled at
  # outlook.samples minutes, in the shipping forecast's order; a change
  # where the wind turns outlook.turn degrees or more or its force by
  # outlook.forces or more, imminent within outlook.imminent minutes of the
  # issue, soon within outlook.soon, later beyond: the real six and twelve
  # hours at the sky's pace.
  forecast:
    every: 10 # minutes
    horizon: 90 # minutes
    step: 10 # minutes
    gale: { mean: 34, gust: 43, quantile: 0.532, grid: 0.25, within: 4.2 }
    outlook: { samples: [0, 30, 60, 90], turn: 45, forces: 2, imminent: 30, soon: 60 }

  # The systems' keyframes: the simulation reads each system's place,
  # motion, strength and size from the week every so often, and the server
  # and the phone both interpolate between them.
  keyframe:
    every: 10 # s

  # The water's signs: the phone samples the mean wind round the camera on
  # a grid so often, and the tiles roughen and darken where it is stronger
  # than the wave wind and go glassy where it is lighter.
  water:
    points: 24 # a side
    spacing: 12.5 # m
    rate: 4 # a second

  # Clouds and rain, which the server and the phone compute alike.
  #
  # Sheet cloud in three layers, each at one height: cirrus, a middle sheet
  # and low cloud. Real high cloud starts at 6 km and low cloud lies under
  # 2 km (WMO International Cloud Atlas); these heights are chosen, as the
  # heaped clouds' tops are, for how far each must be seen on the dome:
  # cirrus from 5.6 km, a front's warning about an hour ahead of its line.
  # Each layer's cover is held at the corners of a world-fixed lattice and
  # is bilinear between them, so a phone's texture of the lattice draws the
  # very field the server has.
  #
  # Fair-weather cumulus, in settled and trade spells and behind fronts: a
  # lattice of cells in a frame that drifts with each spell's wind, each
  # cell's cloud living in slots of its life, growing and shrinking, shown
  # where its hash is under the spell's cover. Real fair-weather cumulus
  # are about 1 km across, spaced about twice the boundary layer's depth
  # apart, "order of 1 km" (Stull, Practical Meteorology, chapter 6); their
  # base at sea is about 400–700 m (Bowditch 3617; Nuijens and others 2014).
  #
  # Islands' caps: by day a cumulus over an island and a street of them
  # downwind, as Nauru raises "a street of cumulus clouds" over its warm
  # plume (Matthews and others 2007).
  #
  # A front's sheets: cirrus far ahead of its line, a middle sheet nearer
  # in, low cloud and rain in a band behind it, and clearing behind that. It
  # is a licence: a warm front's warning ahead ("first, cirrus appear.
  # These give way successively to cirrostratus, altostratus, altocumulus,
  # and nimbostratus", Bowditch 3410) and a cold front's clearance behind
  # ("the visibility usually improves, and the clouds tend to diminish"),
  # two real fronts in one; the real shield runs hundreds of kilometres
  # ahead, these few miles are that sequence on this stage.
  #
  # Rain's words are WMO-No. 8's (2008): light under 2.5 mm an hour,
  # moderate to 10, heavy to 50, violent above. Its extinction is
  # 0.16 R^0.74 per km (Shipley and others 1974), and visibility on the
  # game's stage is 0.4 of the real, as the game's visibility words are.
  clouds:
    cirrus: 6000 # m
    middle: 1500 # m
    low: 400 # m
    lattice: 250 # m
    cumulusCell: 1300 # m
    cumulusJitter: 0.4
    cumulusBase: 400 # m
    cumulusTops: [650, 900] # m
    cumulusSize: [150, 350] # m
    cumulusLife: 20 # minutes
    capSun: [5, 20] # degrees
    capTops: [900, 1400] # m
    capWidth: 0.4
    capStreet: 3
    frontCirrus: [3, 0.6, 0.3, 1.6] # nautical miles
    frontMiddle: [1.5, 0.2, 0.3, 0.9] # nautical miles
    frontLow: [0.15, 0.38] # nautical miles
    frontRain: [10, 0.18, 0.17] # mm an hour; nautical miles
    frontWarm: [5, 0.6, 0.45] # mm an hour; nautical miles
    rainWords: [2.5, 10, 50] # mm an hour
    rainExtinction: [0.16, 0.74]
    rainScale: 0.4

  # Visibility, which the server and the phone compute alike: the optical
  # depth along a line is the integral of the air's extinction along it,
  # the clear air's (world.lights.clearAir), each fog bank's, the rain's
  # and the mist band's added, and a thing is seen while it is at most
  # contrast, ln 50: Koschmieder's 2% (WMO-No. 8, chapter 9, gives 5% for
  # the meteorological optical range; the game's visual ranges are all
  # 3.912 / σ). The visibility at a point is contrast over the extinction
  # there, 2 m up. Its words are the Met Office's marine ones on the
  # game's stage, 0.4 of the real: very poor under 1,000 m, poor to 2
  # nautical miles, moderate to 5, good above.
  visibility:
    contrast: 3.912
    words: [400, 1852, 3704] # m

  # Lightning, the same flash for every player: world time is cut into
  # slots, and a system above its kind's strength flashes in a slot with a
  # chance by its rate, at a time, a place, a kind and strokes drawn from
  # its seed and the slot. "Most lightning (~75-80%) occurs within the
  # cloud" (NWS Melbourne): a quarter reach the sea. "A third of the
  # flashes are single-stroke events, while the overall mean … equals
  # 3.67" (Poelman and others 2021): the rest have from two to most
  # strokes evenly, a mean of 3.67; "the geometric mean interstroke
  # interval being about 60 ms" (CIGRÉ TB 549, Rakov and others 2013).
  lightning:
    slot: 10 # s
    sea: 0.25
    single: 0.33
    most: 8
    apart: 60 # ms

  # Thunder, which follows its flash at the speed of sound: 343 m/s at
  # 20 °C, about 3 seconds a kilometre (Bureau of Meteorology). Real
  # thunder carries 15–25 km (Bureau of Meteorology), "When the distance
  # exceeds 20 km, thunder is usually not heard" (WMO Cloud Atlas): on the
  # game's stage, 0.4 of the real, about 3 nautical miles. Its roll
  # "rarely exceeds 30−40 s" (WMO); near, "a sharp crack or click"; far, "a
  # rumble" (NWS).
  thunder:
    heard: 3 # nautical miles
    speed: 343 # m/s
    longest: 30 # s
    crack: 1000 # m
