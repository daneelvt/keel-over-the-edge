# SPDX-License-Identifier: AGPL-3.0-only
# The weather's numbers.
weather:
  # The waves long enough to move a boat. The sea is a sum of waves with
  # fixed lengths and directions; the wind and its fetch give each its height
  # by the JONSWAP spectrum (Hasselmann and others 1973).
  sea:
    shortest: 8 # m: what tiles 4 m across can carry
    # m: a 7 s wave, longer than the swell the sea will carry and than the
    # longest wind sea the fetch below raises in a storm.
    longest: 76
    gamma: 3.3 # JONSWAP's mean peak enhancement
    sigmaBelow: 0.07 # JONSWAP
    sigmaAbove: 0.09 # JONSWAP
    # cos²ˢ(θ/2) about the wind (Mitsuyasu and others 1975). Goda and Suzuki
    # give 10 for wind waves, which is narrower.
    spreading: 5
    fetchCap: 6 # nautical miles of open water
    cull: 0.10
    # In shallow water the waves' significant height is capped at this share
    # of the depth, as in the inner surf zone, where it is 0.4–0.5 since the
    # largest waves are about twice Hs (Bosboom and Stive, Coastal Dynamics,
    # 5.2.5; a regular wave breaks at 0.78 of the depth, McCowan 1894).
    breaking: 0.5
    # Swell: a storm's long waves, which run ahead of it. Its spectrum is a
    # partition of its own, apart from the wind sea's: a Gaussian in
    # frequency swellSigma of its peak wide (Ochi and Hubble 1976 give swell
    # and wind sea each a peak of its own), spread as cos²ˢ(θ/2) with s =
    # swellSpreading about the way it travels (Goda and Suzuki 1975 give
    # 10–75 for swell), culled against its own highest wave. A swell lower
    # than swellLeast is none. The swell at a place left its storm when the
    # storm was as far away as the swell has travelled since, found in
    # swellSteps of Newton's steps.
    swellLeast: 0.05 # m
    swellSpreading: 40
    swellSigma: 0.07
    swellSteps: 3
    # A current along a wave's path raises it against the wave and lowers it
    # with it, as wave action is kept (Longuet-Higgins and Stewart 1961), by
    # at most currentMost: a wave the current blocks is raised that much.
    currentMost: 1.6
    # Behind land swell is shadowed, never wholly (diffraction fills it):
    # at least shadowLeast of it reaches.
    shadowLeast: 0.2
    # In the land's lee the waves are those of the short water upwind of
    # it: land of any height stops them. Each cell of the shelter's tables
    # holds for each direction its own fetch, the open water upwind of it to
    # the first land, up to leeReach; there the wind sea grows again from
    # the shore, as the root of that fetch (the Coastal Engineering Manual's
    # fetch-limited growth), and the swell is shadowed, filling in over the
    # reach.
    leeReach: 800 # m

  # The wind over the disk.
  disk:
    # The wind's speed rises from the centre to the rim: a spell's wind is
    # its wind at mid-disk, 2.1 nautical miles out, times
    # speedCentre + (speedRim − speedCentre) × a smooth step from the centre
    # to the mist band.
    speedCentre: 0.65
    speedRim: 1.35
    rim: 4.2 # nautical miles: the mist band
    # The refuge at the centre: within refugeInner its limits hold in full,
    # beyond refugeOuter not at all, and between them they blend. The mean
    # wind above its knee is passed through knee + soft × tanh((v − knee) /
    # soft), soft the limit less the knee, so that it nears the limit and
    # never passes it; then the wind with its gusts the same way.
    refugeInner: 1 # nautical miles: the refuge's own radius
    refugeOuter: 1.4 # nautical miles
    refugeMeanKnee: 10 # knots
    refugeMean: 14 # knots: Beaufort 4
    refugeWindKnee: 14 # knots
    refugeWind: 18 # knots: rising to 5 in the gusts
    # Gusts are stronger in the outer waters: the gust factor's excess over
    # 1 grows by this share from rimGustsFrom to the rim.
    rimGusts: 0.3
    rimGustsFrom: 3 # nautical miles
    # The wind's direction differs from one side of the disk to the other
    # along an axis that turns once in this many hours, drawn per spell.
    acrossTurn: [4, 8]
    # The lip of the falls, where the disk ends: world.disk.radius in
    # nautical miles, which the catalog's check holds it to.
    edge: 4.5
    # The falls draw the air toward the lip: from nothing at fallDraftFrom
    # to fallDraft at the lip, linearly, blowing toward the lip. It is the
    # falls' and not the weather's, so it blows in a steady spell too, and
    # the wind that raises the sea leaves it out: over the band's few hundred
    # metres of fetch it would raise nothing.
    fallDraftFrom: 4.2 # nautical miles: the mist band
    fallDraft: 4 # knots at the lip

  # Gusts and lulls: gradient noise in three octaves, each with cells and a
  # life half its predecessor's, carried downwind as one body. Sailors find
  # gusts 100–200 m across the wind in a breeze, longer along it, lasting two
  # to four minutes on the water (Bethwaite 2008, chapter 4): these cells
  # give patches about 150 m along and 100 m across, which keep 0.9 of their
  # shape over 30 s and 0.7 over a minute, so a gust seen 150 m upwind
  # arrives.
  gusts:
    gustAlong: 300 # m: the largest cells along the wind
    gustAcross: 200 # m: and across it
    gustLife: 240 # s: and in time
    gustSpeed: 0.9 # the field travels at this share of a spell's wind at mid-disk
    gustVeer: 8 # degrees: the strongest gust veers by this, the deepest lull backs by half
    change: 10 # minutes: one spell gives way to the next over this

  # The water's own motion: a slow circulation round the disk, its way
  # drawn per world, and the drain toward the falls, running faster toward
  # the lip. Each is linear between its points, nothing before the first and
  # its last value beyond the last; both fall off in water shallower than
  # shallow, in proportion to its depth, and are nothing over land. The
  # refuge's water, with every start place in it, is still.
  current:
    circulationAt: [1, 1.4, 3.5] # nautical miles
    circulation: [0, 0.2, 0.5] # knots at those points
    drainAt: [3.5, 4.2, 4.5] # nautical miles: the last is the lip
    drain: [0, 0.6, 2] # knots at those points
    shallow: 3 # m

  # The beginners' ring round a gust heading for the boat, drawn by the
  # client from the gust field: each patch of a gust factor at least
  # threshold of the way from 1 to the spell's, whose track passes within
  # reach of the boat within horizon, gets one, and at most rings of them.
  ring:
    threshold: 0.5
    spacing: 8 # m: the grid the field is sampled on upwind of the boat
    depth: 240 # m upwind
    width: 160 # m across the wind
    reach: 30 # m
    horizon: 60 # s
    rings: 3
    rate: 4 # samplings a second

  # The wind that raises the waves, for the sea lags the wind: an
  # exponential average of the mean wind, its gusts left out, at each sea
  # area's centre. Over the open water's fetch a real sea takes two to three
  # hours to build (Coastal Engineering Manual, 2008, II-2); at the world's
  # pace, twelve times the real one, that is ten to fifteen minutes, and an
  # average with a time constant of four minutes reaches 95% in twelve.
  waveWind:
    waveTimeConstant: 240 # s
    waveSample: 30 # s between samples
    waveSamples: 40 # the rest weigh under 0.7% together

  # Regimes: the kinds of spell. Their wind is drawn, spell by spell, from
  # these ranges; a spell's shifts swing two thirds and one third of shift,
  # with periods in the range at least a minute and a half apart. share is
  # the regime's share of the world's time, which the week keeps; spell how
  # long a spell of it lasts, hours; pressure its level, hPa; next the
  # regimes a spell of it gives way to, with the chance of each; systems the
  # systems born in it an hour over the disk, and at its start; cumulus how
  # much of the sky its fair-weather cumulus covers: trade cumulus cover
  # about 0.3 of the sky (Nuijens and others 2014, at Barbados). A spell of
  # a frontal regime arrives and leaves as a front does. The table is fitted
  # to the shares: its long-run shares are 23, 42, 23 and 12 in a hundred.
  # The gust factors are those of the waters dinghies race in; the open
  # sea's are smaller (WMO/TD-No. 1555, 2010, Table 1.1).
  regimes:
    - id: settled
      share: 0.25
      frontal: false
      spell: [3, 8]
      pressure: [1020, 1030]
      next:
        - { to: trade, chance: 1 }
      systems:
        - { kind: fog, rate: 1.5, atStart: 0, peak: [0, 1], when: always }
        - { kind: light-air, rate: 4, atStart: 0, peak: [0, 1], when: always }
        - { kind: shower, rate: 3, atStart: 0, peak: [0, 1], when: day }
        - { kind: shower, rate: 1, atStart: 0, peak: [0, 1], when: night }
        - { kind: depression, rate: 0.6, atStart: 0, peak: [0, 1], when: always }
        - { kind: trough, rate: 1, atStart: 0, peak: [0, 1], when: day }
      wind:
        speed: [3, 9] # knots at mid-disk
        gustFactor: 1.2
        shift: 5 # degrees each way
        period: [6, 10] # minutes
        across: 5 # degrees
        drift: 20 # degrees
      cumulus: 0.25
    - id: trade
      share: 0.40
      frontal: false
      spell: [4, 10]
      pressure: [1012, 1020]
      next:
        - { to: settled, chance: 0.7 }
        - { to: unsettled, chance: 0.3 }
      systems:
        - { kind: shower, rate: 6, atStart: 0, peak: [0, 1], when: always }
        - { kind: light-air, rate: 2, atStart: 0, peak: [0, 1], when: always }
        - { kind: squall, rate: 0.8, atStart: 0, peak: [0, 1], when: always }
        - { kind: storm, rate: 0.35, atStart: 0, peak: [0, 0.5], when: always }
        - { kind: depression, rate: 0.5, atStart: 0, peak: [0, 1], when: always }
        - { kind: trough, rate: 2.2, atStart: 0, peak: [0, 1], when: always }
      wind:
        speed: [10, 16]
        gustFactor: 1.3
        shift: 8
        period: [5, 8]
        across: 5
        drift: 20
      cumulus: 0.35
    - id: unsettled
      share: 0.25
      frontal: true
      spell: [2, 6]
      pressure: [1000, 1012]
      next:
        - { to: trade, chance: 0.31 }
        - { to: stormy, chance: 0.69 }
      systems:
        - { kind: squall, rate: 5, atStart: 0, peak: [0, 1], when: always }
        - { kind: shower, rate: 18, atStart: 0, peak: [0, 1], when: always }
        - { kind: storm, rate: 0.6, atStart: 0, peak: [0, 1], when: always }
        - { kind: depression, rate: 0.5, atStart: 0, peak: [0, 1], when: always }
        - { kind: squall-line, rate: 1.5, atStart: 0, peak: [0, 1], when: always }
        - { kind: trough, rate: 2.5, atStart: 0, peak: [0, 1], when: always }
      wind:
        speed: [12, 20]
        gustFactor: 1.45
        shift: 12
        period: [4, 7]
        across: 5
        drift: 20
      cumulus: 0.45
    - id: stormy
      share: 0.10
      frontal: true
      spell: [2, 4]
      pressure: [990, 1005]
      next:
        - { to: unsettled, chance: 1 }
      systems:
        - { kind: storm, rate: 0.5, atStart: 1, peak: [0, 1], when: always }
        - { kind: squall, rate: 5, atStart: 0, peak: [0, 1], when: always }
        - { kind: shower, rate: 10, atStart: 0, peak: [0, 1], when: always }
        - { kind: squall-line, rate: 2.5, atStart: 0, peak: [0, 1], when: always }
        - { kind: depression, rate: 0.5, atStart: 0, peak: [0, 1], when: always }
        - { kind: trough, rate: 2, atStart: 0, peak: [0, 1], when: always }
      wind:
        speed: [16, 24]
        gustFactor: 1.5
        shift: 12
        period: [4, 7]
        across: 5
        drift: 20
      cumulus: 0.3

  # A front: a straight line across the disk, lying in a trough. Ahead of it
  # the old spell blows, behind it the new, blended within blend of the
  # line. The trough deepens toward the line as e^(−s / troughAhead) and
  # fills behind it within troughBehind, a Gaussian's width; its wind is the
  # trough's gradient turned frontTurning clockwise, frontWind at its
  # steepest, so the wind backs and freshens ahead of the line and veers as
  # it passes, as sailors meet a cold front (Royal Yachting Association,
  # Weather Handbook; Great Lakes Sailing, Weather Fronts). Behind it the
  # gusts are stronger over gustsBehind.
  front:
    troughAhead: 1.1 # nautical miles
    troughBehind: 0.35 # nautical miles
    frontWind: 7 # knots
    frontTurning: 70 # degrees
    blend: 0.12 # nautical miles either side of the line
    frontGusts: 0.15 # the gust factor's excess rises by this behind the line
    gustsBehind: 1 # nautical miles

  # The pressure: each spell's level, drawn in its regime's range, sloping
  # gently across the disk with low pressure on the left of the base wind,
  # so that Buys Ballot's law holds of the spell's own wind (American
  # Meteorological Society, Glossary of Meteorology, Buys Ballot's law);
  # rising behind a front; and each system's shape.
  #
  # At a change of spell with no front the level moves from the old
  # spell's to the new evenly over ease minutes from the change's start, so
  # the barometer reads a change of spell as a real one, over hours, and
  # not as a storm's fall (Met Office, Marine forecasts glossary: "very
  # rapidly", over 6 hPa in three hours): two regimes' levels 18 hPa apart
  # move 4.5 hPa in a quarter of an hour. It eases from the change's start,
  # never ahead of it, so it tells nothing of the next spell before its
  # wind is announced.
  pressure:
    slope: 0.02 # hPa a knot of the base wind a nautical mile
    rise: 0.15 # hPa a minute behind a front's line
    riseMost: 6 # hPa
    ease: 60 # minutes

  # How far the systems reach. A front's, a squall's and a shower's wind
  # falls toward Port Royal to inwardLeast of itself within inwardFrom of
  # the centre, and is whole beyond inwardTo; a storm's falls to nothing. A
  # system's pressure and wind end cut of its widths from its centre, where
  # its wind is under a five-hundredth of its peak.
  reach:
    inwardFrom: 0.8 # nautical miles
    inwardTo: 3 # nautical miles
    inwardLeast: 0.35
    cut: 4 # widths

  # The kinds of weather system. Each is a pressure shape moving with it: a
  # dome steeper on its leading edge (the gust front), a line (a dome
  # stretched across its motion along its length, its gust front along its
  # leading edge, in one slot however long it is), a low (a core whose
  # width is the ring of strongest wind, and a broad shallow low about it,
  # so the barometer falls well ahead), or none, a patch that scales the
  # wind. Its wind blows toward lower pressure, turned clockwise by turning:
  # a storm's is the gradient wind less a cross-isobar angle of 20°, within
  # the 10–25° over water friction gives (American Meteorological Society,
  # Glossary of Meteorology, cross-isobar angle); a squall's outflow too
  # small and quick for the earth's turning to matter blows almost straight
  # out of its dome. size is its radius, a line's half its depth, and
  # length a line's length; width its pressure's Gaussian width as a share
  # of its size; wind what it adds at its peak, at full strength, or
  # for a patch factor the wind's share at its core; speed a share of the
  # base wind, or knots for a kind that keeps to the outer waters. name and
  # key are its words on the chart and in its key, symbol how the chart
  # draws it, as a weather chart does (WMO-No. 485): a squall line a line of
  # dash, dot, dot, a trough a dashed line.
  #
  # Where it is born: track wind is born beyond the windward rim and
  # crosses with the wind on a chord; outer beyond the windward rim, then
  # round the outer waters, turnsIn of them turning in; drift inside the
  # disk, drifting with the wind, by day islands of them over land; a kind
  # with night is born only at night or within dawn minutes of sunrise and
  # lifts lift minutes after it; calmBelow and goneAbove are the spell's
  # wind it needs, knots, 0 for none.
  #
  # Its cloud: a form, which names how it is drawn, its base and its top
  # and reach at its whole, its deck of low cloud and how dark its base
  # is. Its cloud strength is its strength times lead, at most 1, so with a
  # lead of 2 its cloud is whole when its wind is half grown and lingers
  # while its wind decays, as a thunderstorm's cumulus stage, towering with
  # no rain or outflow, comes before its mature stage, when the downdraft
  # and the gust front begin (NOAA JetStream, the life cycle of a
  # thunderstorm). Its top and reach scale with the cloud strength, so its
  # tower is the warning. The bases are real ones: Bowditch (3617) gives a
  # base at sea of 126 m a degree of the dew point's spread, 354 m at
  # 2.8 °C. The tops are a licence for the dome: a real cumulonimbus
  # reaches 12–18 km (NOAA), which would show over the whole disk from
  # anywhere; these are chosen for how far each must be seen (a top of H
  # shows from 100 + √(2 × 2,500 m × H) m away), so a squall's tower shows
  # about ten minutes before its gust front and a storm's twenty.
  #
  # Its rain, at full strength: a rate at its core, mm an hour, as a
  # Gaussian width of its size; or, with bands, in spiral bands turning
  # once in turn minutes within width of its size, as a tropical cyclone's
  # "torrential rains … separated by areas of light rain or no rain"
  # (Bowditch 3505). Rain follows its strength, not its cloud strength, so
  # rain and gust front come together. A squall's core is violent (WMO-No.
  # 8: violent above 50 mm an hour), a shower's moderate, a storm's bands
  # heavy.
  systems:
    - id: squall
      name: Squall
      key: "A squall: a dark cell of violent rain and lightning, its gust front ahead of it."
      symbol: cell
      shape: dome
      turning: 10 # degrees
      width: 0.7
      ahead: 1.6
      broad: [0, 1]
      stretch: 1
      inward: weak
      gusts: 0.15
      size: [0.3, 0.6] # nautical miles
      length: [0, 0]
      speed: [0.6, 0.9]
      speedOf: wind
      life: [20, 50] # minutes
      wind: [12, 18] # knots
      factor: [1, 1]
      depth: [2, 4] # hPa
      track: wind
      turnsIn: 0
      islands: 0
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 0
      goneAbove: 0
      rain: { rate: 75, width: 0.42, bands: 0, turn: 0 }
      cloud:
        form: cumulonimbus
        base: 350 # m
        top: 2500 # m: the anvil's
        reach: [0.4, 1] # its anvil spreads ahead
        deck: [0.5, 600] # the base under the tower
        lead: 2
        dark: 0.7
      # Lightning from its mature stage: none below above, rising to rate
      # flashes a minute at full strength, struck within its rain core.
      # Ordinary storms flash 1–10 times a minute (Williams and others
      # 1999), oceanic ones about half as often as those over land
      # (Boccippio and others 1999) and squall lines at sea "nevertheless
      # produce few reports of lightning" (Zipser 1994): 2 a minute is the
      # low end, about one strike every half minute.
      lightning: { above: 0.7, rate: 2, within: [0, 0.42] }
    - id: shower
      name: Shower
      key: "A shower: a heap of cumulus and a few minutes of rain, a puff ahead of it."
      symbol: heap
      shape: dome
      turning: 10
      width: 0.7
      ahead: 1.6
      broad: [0, 1]
      stretch: 1
      inward: weak
      gusts: 0.1
      size: [0.15, 0.35]
      length: [0, 0]
      speed: [0.9, 1]
      speedOf: wind
      life: [10, 25]
      wind: [4, 8]
      factor: [1, 1]
      depth: [1, 1]
      track: drift
      turnsIn: 0
      islands: 0.5
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 0
      goneAbove: 0
      rain: { rate: 6, width: 0.5, bands: 0, turn: 0 }
      cloud:
        form: cumulus
        base: 400
        top: 1200
        reach: [0.4, 0.4]
        deck: [0, 0]
        lead: 2
        dark: 0.4
    - id: storm
      name: Storm
      key: "A storm: a low with a gale round its ring of strongest wind, its rain in spiral bands."
      symbol: spiral
      shape: low
      turning: 70
      width: 0.6
      ahead: 1
      broad: [0.333, 3]
      stretch: 1
      inward: gone
      gusts: 0.04
      size: [1.5, 2.5]
      length: [0, 0]
      speed: [3, 6]
      speedOf: knots
      life: [60, 180]
      wind: [18, 26]
      factor: [1, 1]
      depth: [10, 20]
      track: outer
      turnsIn: 0.2
      islands: 0
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 0
      goneAbove: 0
      rain: { rate: 20, width: 1.3, bands: 2, turn: 60 }
      # A broad dark deck over the whole of it with towers within, and the
      # sheets of its outflow about it: cirrus "when the storm is about
      # 300 to 600 miles away", then cirrostratus, then "a dark wall of
      # heavy cumulonimbus, called the bar of the storm" (Bowditch 3508,
      # 3509), on this stage.
      cloud:
        form: storm
        base: 350
        top: 3000 # the towers'
        reach: [0.7, 0.7]
        deck: [1, 1200]
        lead: 2
        dark: 0.8
        sheets:
          cirrus: [2, 0.9]
          middle: [1.5, 0.6]
          low: [1.15, 0.4]
      # A tropical cyclone's ground flashes are mostly in its outer bands
      # (Molinari and others 1999): struck from 0.7 to 1.3 of its size.
      lightning: { above: 0.75, rate: 1.5, within: [0.7, 1.3] }
      # A storm of this size raises waves of 2–4 s, which travel no faster
      # than it does (the Coastal Engineering Manual's growth laws). Its
      # swell is given a longer period, as a real storm's 10–15 s swell
      # would be on this smaller stage: a licence, which lets it run ahead
      # of the storm at about twice its speed and warn of it (Bowditch,
      # Tropical Cyclones: "an early indication of the approach … is the
      # presence of a long swell"). Its height at the storm's edge goes with
      # its peak wind, and beyond it falls as the square root of the
      # distance (Ardhuin, Chapron and Collard 2009, on a plane).
      swell:
        period: [5.5, 6] # s, drawn per storm
        band: [5, 6.5] # s
        height: [0.6, 1] # m
    - id: fog
      name: Fog
      key: "A fog bank: the visibility down to a boat's length or two."
      symbol: bank
      shape: none
      turning: 0
      width: 0.5
      ahead: 1
      broad: [0, 1]
      stretch: 2
      inward: none
      gusts: 0
      size: [0.4, 1.5]
      length: [0, 0]
      speed: [0.8, 0.8]
      speedOf: wind
      life: [20, 90]
      wind: [0, 0]
      factor: [0.9, 0.9]
      depth: [0, 0]
      track: drift
      turnsIn: 0
      islands: 0
      night: true
      dawn: 30 # minutes
      lift: [15, 30] # minutes after sunrise
      calmBelow: 8 # knots
      goneAbove: 12 # knots
      rain: { rate: 0, width: 0, bands: 0, turn: 0 }
      cloud: { form: fog, base: 0, top: 0, reach: [0, 0], deck: [0, 0], lead: 1, dark: 0 }
      # Its fog: an extinction of 3.912 over its core's visibility, drawn
      # per bank, times its strength and the stretched Gaussian its wind's
      # patch has, falling as e^(−h / height) above the sea. Fog is "very
      # poor" visibility, 30–150 m on this stage; Kunkel's (1984)
      # extinction, 144.7 C^0.88 a km, puts 100 m at about 0.2 g/m³ of
      # liquid water, and the Met Office calls fog under 100 m dense. A
      # licence: a well-mixed fog "is densest near the top of the fog
      # layer" (Stull, Practical Meteorology, 6.8), under its inversion;
      # thinning with height, as the mist band does, its optical depth
      # along any line has a closed form.
      fog: { core: [50, 150], height: 40 }
    - id: light-air
      name: Light air
      key: "Light air: a patch where the wind dies away."
      symbol: calm
      shape: none
      turning: 0
      width: 0.5
      ahead: 1
      broad: [0, 1]
      stretch: 1
      inward: none
      gusts: 0
      size: [0.2, 0.5]
      length: [0, 0]
      speed: [1, 1]
      speedOf: wind
      life: [10, 30]
      wind: [0, 0]
      factor: [0.3, 0.5]
      depth: [0, 0]
      track: drift
      turnsIn: 0
      islands: 0
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 10
      goneAbove: 0
      rain: { rate: 0, width: 0, bands: 0, turn: 0 }
      cloud: { form: none, base: 0, top: 0, reach: [0, 0], deck: [0, 0], lead: 1, dark: 0 }

    # A low: a storm's shape at half its strength, born in every spell, so
    # the settled weather has a shape to see and sail to without a gale.
    # Its swell is half a storm's, and it has no lightning.
    - id: depression
      name: Low
      key: "A low: a storm's shape at half its strength, a ring of fresh wind about a calm centre."
      symbol: low
      shape: low
      turning: 70
      width: 0.6
      ahead: 1
      broad: [0.333, 3]
      stretch: 1
      inward: gone
      gusts: 0.03
      size: [1.2, 2]
      length: [0, 0]
      speed: [3, 6]
      speedOf: knots
      life: [60, 150]
      wind: [10, 16]
      factor: [1, 1]
      depth: [5, 10]
      track: outer
      turnsIn: 0.33
      islands: 0
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 0
      goneAbove: 0
      rain: { rate: 6, width: 1.2, bands: 2, turn: 60 }
      cloud:
        form: storm
        base: 400
        top: 2200
        reach: [0.6, 0.6]
        deck: [0.9, 1000]
        lead: 2
        dark: 0.6
        sheets:
          cirrus: [1.6, 0.8]
          middle: [1.3, 0.5]
          low: [1.05, 0.35]
      swell:
        period: [5, 5.5]
        band: [4.5, 6]
        height: [0.3, 0.5]
    # A squall line: a line of squalls a few miles long, the most striking
    # thing on a radar picture, born in unsettled and stormy spells and
    # ahead of a cold front into a stormy one (week.lineAhead). Its towers
    # stand along its length and its gust front along its leading edge;
    # size is half its depth along its motion.
    - id: squall-line
      name: Squall line
      key: "A squall line: squalls in a row miles long, violent rain and a gust front all along it."
      symbol: dash-dot
      shape: line
      turning: 10
      width: 0.7
      ahead: 1.6
      broad: [0, 1]
      stretch: 1
      inward: weak
      gusts: 0.15
      size: [0.1, 0.15]
      length: [1.5, 3]
      speed: [0.7, 0.9]
      speedOf: wind
      life: [25, 40]
      wind: [12, 18]
      factor: [1, 1]
      depth: [2, 4]
      track: wind
      turnsIn: 0
      islands: 0
      night: false
      dawn: 0
      lift: [0, 0]
      calmBelow: 0
      goneAbove: 0
