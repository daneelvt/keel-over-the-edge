# SPDX-License-Identifier: AGPL-3.0-only
# Sailors: the looks the boats are sailed in, in the picker's order. A
# player chooses a look and its version, and the look's options: a skin,
# a hair colour (the looks of greying sailors from the greys) and a main
# colour, from the sets below. Each version has its art: the deck level
# drawn on the boat in view and near the camera, the far level, the close
# level for the camera nearest and the picker, the clips, the colour
# portrait (its base in AVIF, with WebP for browsers without, and its
# mask) and the inked portrait.
sailors:
  - id: rover
    name: Rover
    habit: settles the cocked hat
    hair: colours
    versions:
      - id: female
        name: female
        art:
          model: sailors/rover/female.deck.glb
          far: sailors/rover/female.far.glb
          close: sailors/rover/female.glb
          clips: sailors/rover/female.clips.glb
          portrait: sailors/rover/female.portrait.avif
          portraitFallback: sailors/rover/female.portrait.webp
          portraitMask: sailors/rover/female.portrait-mask.webp
          ink: sailors/rover/female.ink.webp
      - id: male
        name: male
        art:
          model: sailors/rover/male.deck.glb
          far: sailors/rover/male.far.glb
          close: sailors/rover/male.glb
          clips: sailors/rover/male.clips.glb
          portrait: sailors/rover/male.portrait.avif
