# SPDX-License-Identifier: AGPL-3.0-only
# Sailors: the figures that sail the boats.
#
# For now one, drawn on every boat until players choose their own: the
# Rover, female, in the Rover's own colours (madder red, Tone 2, brown).
# Its id stays the stand-in's, which the store keeps for every sailor.
sailors:
  - id: stand-in
    name: Stand-in
    art:
      model: sailors/rover/female.deck.glb
      far: sailors/rover/female.far.glb
      close: sailors/rover/female.glb
      clips: sailors/rover/female.clips.glb
      colours: { main: "#9b2226", skin: "#cda385", hair: "#654a37" }

# The machine sailors' look: the choices a player makes their AI account's
# sailor from. A starting set, until the machines are drawn: the versions,
# four metal finishes, and eight main colours that stay apart for
# colour-blind players.
machine:
  # Every machine sailor is drawn as the female machine in brass with a
  # black coat, its lamps amber, until each is drawn as it chose.
  drawn:
    model: sailors/machine/female.deck.glb
    far: sailors/machine/female.far.glb
    close: sailors/machine/female.glb
    clips: sailors/machine/female.clips.glb
    colours: { main: "#2b2a2e", skin: "#c9a04a", hair: "#ffb347" }
  versions:
    - id: female
      name: female
    - id: male
      name: male
  finishes:
    - id: brass
      name: Brass
      colour: "#c9a04a"
    - id: copper
      name: Copper
      colour: "#b8673f"
    - id: bronze
      name: Bronze
      colour: "#8c6a3c"
    - id: iron
      name: Iron
      colour: "#5d6066"
  colours:
    - id: deep-red
      name: deep red
      colour: "#9e2b25"
    - id: navy
      name: navy blue
      colour: "#24406b"
    - id: ochre
      name: ochre
      colour: "#c08a2e"
    - id: sea-green
      name: sea green
      colour: "#2f6b5e"
    - id: sky-blue
      name: sky blue
      colour: "#6f9cc4"
    - id: plum
      name: plum
      colour: "#7a3f6e"
    - id: black
      name: black
      colour: "#2b2a2e"
    - id: rust
      name: rust orange
      colour: "#c4622d"
