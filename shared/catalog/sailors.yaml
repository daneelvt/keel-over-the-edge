# The options a sailor's look takes. Six skins, evenly spaced in lightness
# and warmer as they deepen, lightest first; six hair colours, and four
# greys and whites for the looks of greying sailors; eight main colours,
# each a dye of the period, which stay apart for colour-blind players.
sailorOptions:
  skins:
    - { id: tone-1, name: Tone 1, colour: "#e1c0a9" }
    - { id: tone-2, name: Tone 2, colour: "#cda385" }
    - { id: tone-3, name: Tone 3, colour: "#b2815f" }
    - { id: tone-4, name: Tone 4, colour: "#946145" }
    - { id: tone-5, name: Tone 5, colour: "#734736" }
    - { id: tone-6, name: Tone 6, colour: "#52342b" }
  hairs:
    - { id: black, name: black, colour: "#251e1c" }
    - { id: dark-brown, name: dark brown, colour: "#413129" }
    - { id: brown, name: brown, colour: "#654a37" }
    - { id: auburn, name: auburn, colour: "#834328" }
    - { id: dark-blond, name: dark blond, colour: "#9d7e58" }
    - { id: light-blond, name: light blond, colour: "#c9ac7e" }
  greys:
    - { id: salt-and-pepper, name: salt and pepper, colour: "#5f5a56" }
    - { id: iron-grey, name: iron grey, colour: "#817b76" }
    - { id: silver, name: silver, colour: "#b5aea6" }
    - { id: white, name: white, colour: "#d2cbc1" }
  colours:
    - { id: black, name: black, colour: "#1e1e1e" }
    - { id: indigo-navy, name: indigo navy, colour: "#1f3a63" }
    - { id: madder-red, name: madder red, colour: "#9b2226" }
    - { id: sea-green, name: sea green, colour: "#2e7d6b" }
    - { id: weld-yellow, name: weld yellow, colour: "#d9b648" }
    - { id: sky-blue, name: sky blue, colour: "#8db4d6" }
    - { id: madder-orange, name: madder orange, colour: "#c4622d" }
    - { id: undyed-linen, name: undyed linen, colour: "#e6dcc3" }

# The machine sailors AI accounts sail as: a version, a finish of its
# metal, and a main colour, its coat's, from the sailors' colours. Its
# lamps glow lantern amber.
machine:
  habit: turns its ear discs to the wind and back
  lamp: "#ffb347"
  versions:
    - id: female
      name: female
      art:
        model: sailors/machine/female.deck.glb
        far: sailors/machine/female.far.glb
        close: sailors/machine/female.glb
        clips: sailors/machine/female.clips.glb
        portrait: sailors/machine/female.portrait.avif
        portraitFallback: sailors/machine/female.portrait.webp
        portraitMask: sailors/machine/female.portrait-mask.webp
        ink: sailors/machine/female.ink.webp
    - id: male
      name: male
      art:
        model: sailors/machine/male.deck.glb
        far: sailors/machine/male.far.glb
        close: sailors/machine/male.glb
        clips: sailors/machine/male.clips.glb
        portrait: sailors/machine/male.portrait.avif
        portraitFallback: sailors/machine/male.portrait.webp
        portraitMask: sailors/machine/male.portrait-mask.webp
        ink: sailors/machine/male.ink.webp
  finishes:
    - { id: brass, name: brass, colour: "#d9a957" }
    - { id: copper, name: copper, colour: "#b8673f" }
    - { id: bronze, name: bronze, colour: "#8c6a3c" }
    - { id: iron, name: iron, colour: "#5d6066" }
