# SPDX-License-Identifier: AGPL-3.0-only
# The world's numbers: how a world is made from its seed, and how a boat
# meets its ground.
#
# Starting values, to be judged seed by seed in the preview
# (go run ./tools/worldgen-preview). A change that changes any seed's world
# must raise worldgen.Version, which the generator's snapshot tests enforce.
world:
  disk:
    radius: 8334 # m: the edge of the world
    mist: 4.2 # nautical miles: the mist band begins

  # The edge. A boat whose centre of gravity is at or beyond the disk's
  # radius has gone over the falls: it falls for fall seconds, seen by
  # everyone near, then starts again at the start. An approach to the edge
  # begins when a boat enters the mist band and is survived when it is
  # clear of the band again, or when its voyage ends afloat.
  edge:
    fall: 5 # s
    clear: 20 # m back out of the mist band
    # The mist: a density that rises linearly across the band from the
    # clear air's to the lip's, whose visual range is range, and falls off
    # with height as e^(−z / height). Beyond the lip it is the lip's at
    # every height, and below the sea.
    mist:
      range: 300 # m: very poor visibility
      height: 40 # m
    # How the lip and the falls are drawn.
    look:
      # The sea's last tiles sag and tip outward over the brink.
      lip: { tip: 0.3, sag: 0.2 } # rad, m
      # The curtain of water pouring over: rows by the time since the brink,
      # from before it to after it, s; falling at gravity, m/s², and curving
      # out by out × t² m; its waves damped as e^(−damping t); whitening to
      # foam over foam s, to the mist's colour over mist s and faded out
      # over fade s; drawn within reach m of the camera.
      curtain:
        from: -3.5
        to: 10
        gravity: 3.9
        out: 0.12
        damping: 0.25
        foam: 5
        mist: [5, 10]
        fade: [6, 10]
        reach: 700
      # Slabs of the sea breaking off the curtain: each lattice cell along
      # the lip lets one go at a time drawn per cell and cycle, s after the
      # brink, once a cycle of cycle s; falling at gravity, m/s², tipping by
      # tip[0] + tip[1] t rad and spinning at up to spin rad/s; fading to the
      # mist from mist[0] to mist[1] m down and gone gone m down.
      slabs:
        release: [0.2, 1]
        cycle: [3, 7]
        gravity: 3
        tip: [0.3, 1.9]
        spin: 0.9
        mist: [12, 110]
        gone: [70, 120]
      # The drain's foam lines, about apart m across the drain, from where
      # it runs faster than from knots.
      lines: { apart: 12, from: 0.3 }

  # Where on the disk a place is: the centre round the main port, the
  # middle waters, and the rim beyond.
  zones:
    centre: 1.6 # nautical miles
    middle: 3.2 # nautical miles

  # The main port's island, at the centre of every world, about the same
  # size every time: about 0.3 nautical miles across, wooded, with cliffs on
  # part of its coast. No other land but its own rocks lies in its calm
  # water.
  mainPort:
    name: Port Royal
    biome: wooded
    across: [500, 600] # m
    height: [30, 70] # m
    cliffs: 0.4 # share of its outer coast, the harbour's shore not counted: at least a third
    offset: 100 # m: its centre lies within this of the disk's
    calm: 1 # nautical miles
    rocks: [2, 5] # stacks off its coast
    # Its harbour, carved into the island in every world: a basin, "nearly
    # surrounded with slopes … circular shape and narrow entrance" (Smyth,
    # 1867), across m across, its radius wandering by the harmonics given
    # (the second to the sixth, of its radius), its centre offset m off the
    # island's toward the bearing that keeps land m of land round it; a
    # narrows narrows m wide at its inner end, widening to widen times that
    # at its mouth; the basin depth m deep, the least at its quays, the most
    # in its middle, the narrows' middle third channel m at least; a circle
    # of turning m of clear water inside it, three of a tall ship's lengths
    # (PIANC's guidance without tugs); a mole of mole m along the narrows'
    # inner side. tries basins are drawn and the best kept. The town stands
    # on town degrees of its shore, opposite the narrows.
    harbour:
      across: [250, 290] # m
      harmonics: [0.2, 0.17, 0.11, 0.09, 0.045]
      offset: [70, 120] # m
      land: 60 # m
      narrows: [60, 80] # m
      widen: 1.6
      depth: [5, 8] # m
      channel: 6 # m
      turning: 135 # m
      mole: [30, 50] # m
      tries: 24
      town: 150 # degrees

  # Islands. A dozen or so landmarks, worth a voyage, are placed first;
  # then the rest, whose areas follow Korčák's law, the number larger than
  # a falling as a^−b, with b about 0.65 on Mandelbrot's average (Korčák
  # 1938; Mandelbrot 1975); then groups of rocks and islets. Each new island
  # takes the best of several candidate places, the one furthest from the
  # land already placed (Mitchell's best-candidate sampling, a Poisson-disk
  # pattern; Bridson 2007), with at least a gap between coasts.
  layout:
    landmarks: 14
    landmarkAcross: [250, 560] # m
    landmarkApart: 1200 # m between their centres
    landmarkRing: [1.3, 4.1] # nautical miles from the centre
    islands: 90
    islandAcross: [30, 250] # m
    korcak: 0.65
    islandRing: [1.1, 4.4] # nautical miles
    gap: 150 # m between coasts
    candidates: 16
    groups: [3, 8]
    groupSize: [3, 12]
    groupSpread: 220 # m: a group's rocks lie within this of its centre
    rockAcross: [8, 30] # m

  # Size classes by an island's width, the diameter of a circle of its
  # area: each holds the islands narrower than below m and no narrower than
  # the class before's, by the word the names give it; worth is what
  # charting one is worth before its zone and its scenery (world.chart).
  sizes:
    - { class: rock, worth: 1, below: 30 }
    - { class: islet, worth: 2, below: 100 }
    - { class: small, worth: 3, below: 250 }
    - { class: medium, worth: 5, below: 450 }
    - { class: large, worth: 8, below: 20000 }

  land: [0.3, 80] # m: the lowest and the highest land
  # Loose ground stands at its angle of repose, 30–40°; steeper is cliff
  # (Musgrave, Kolb and Mace 1989).
  talus: 35 # degrees

  # The sea bed out from a coast: Dean's equilibrium profile, h = A x^(2/3)
  # at x metres from the shore (Bruun 1954; Dean 1977, 1991), A by the
  # island's biome, to the closure depth; then the shelf; then the deep.
  # An island's bed reaches base + perRadius × its radius from its coast, at
  # most most, and fades into the deep over the last part.
  seabed:
    closure: 8 # m
    shelf: 15 # it falls 1 m in this many
    deep: 40 # m: below this the bed is stored as this
    reachBase: 60 # m
    reachPerRadius: 3
    reachMost: 900 # m
    # The bed's reach varies along the coast by this share, so that the
    # shallows are not rings.
    reachVaries: 0.4

  # A fringing reef: its crest just awash, a flat behind it, the fore reef
  # falling outside (reef zonation; Living Oceans Foundation).
  reef:
    crest: [0.3, 0.5] # m deep
    flat: [1, 3] # m deep
    offshore: [40, 100] # m from the coast
    fore: 20 # m: the fore reef falls to this depth
    foreWidth: 60 # m
    passes: 0.15 # share of the crest open as passes

  # Offshore hazards, away from every island's shelf: reefs, a crest awash
  # with a fore reef falling outside it as a fringing reef's does, and
  # sandbanks, a smooth bank of sand with a few metres over it. Each lies
  # within the ring, at least clear m from any land and apart m from the
  # next, outer of each kind beyond beyond nautical miles; each has a rock
  # its light stands on, as real hazard lights stand on the hazard (Hogsty
  # Reef, Elbow Reef, Memory Rock).
  hazards:
    reefs: 4
    reefLength: [50, 250] # m
    reefCrest: [0.3, 0.5] # m deep
    banks: 3
    bankLength: [100, 400] # m
    bankDepth: [1, 3] # m over the bank
    outer: 2
    beyond: 3.6 # nautical miles
    ring: [1.7, 4.3] # nautical miles from the centre
    clear: 300 # m from any land
    apart: 1000 # m
    rockHexes: [2, 4]
    rockHeight: [2, 3] # m above the sea
    rockSurface: rock # the surface it is

  # Erosion on each island's own grid: thermal weathering moves ground
  # steeper than the talus down (Musgrave, Kolb and Mace 1989), and
  # droplets of rain carve gullies and drop what they carry where the
  # ground flattens (Beneš and Forsbach 2002).
  erosion:
    thermal: 24 # passes
    droplets: 3000 # the most an island
    dropletSteps: 40
    erode: 0.04 # m a step a droplet takes per metre of fall
    deposit: 0.3 # the share of its load it drops where it stops falling

  # The first biomes, each an island's terrain. Weights by zone; heights in
  # m; shapes: lobes, each lobe's length over its width, how far the domain
  # is warped as a share of the island's radius, and bays bitten into the
  # coast; the height profile:
  # rise is the exponent of the inland distance, then the shares of rolling
  # hills, ridges and a cone; crater the chance of one; cliffs the share of
  # the coast; beach the width of low ground at its other shores, m; dean
  # Dean's A; reef, bars and stacks the sea bed's features; split the height
  # share above which the high surface lies; stream the catchment, m², from
  # which a stream runs (sand drains through, and a sandy cay has none); and
  # mangroves whether they grow on its low shores by still water.
  biomes:
    - id: sandy
      zones: { centre: 3, middle: 2, rim: 0.5 }
      height: [1, 5]
      lobes: [1, 3]
      elongation: [1.8, 3.5]
      warp: 0.6
      bays: [0, 2]
      rise: 0.5
      hills: 0.5
      ridges: 0
      cone: 0
      crater: 0
      cliffs: [0, 0]
      cliffHeight: [0, 0]
      beach: 30
      dean: 0.1
      reef: false
      bars: true
      stacks: [0, 0]
      split: 0.5
      stream: 1000000
      mangroves: false
      surfaces: { beach: sand, low: dune-grass, high: dune-grass, steep: sand, bed: sand }
    - id: tropical
      zones: { centre: 3, middle: 2, rim: 0.3 }
      height: [15, 55]
      lobes: [2, 4]
      elongation: [1.1, 1.8]
      warp: 0.45
      bays: [1, 3]
      rise: 1.3
      hills: 0.25
      ridges: 0.5
      cone: 0
      crater: 0
      cliffs: [0, 0.1]
      cliffHeight: [5, 12]
      beach: 15
      dean: 0.15
      reef: true
      bars: false
      stacks: [0, 0]
      split: 0.3
      stream: 3000
      mangroves: true
      surfaces: { beach: sand, low: strand, high: tropical-forest, steep: rock, bed: sand }
    - id: wooded
      zones: { centre: 2, middle: 3, rim: 2 }
      height: [15, 50]
      lobes: [2, 4]
      elongation: [1.2, 2]
      warp: 0.5
      bays: [1, 4]
      rise: 1
      hills: 0.5
      ridges: 0.15
      cone: 0
      crater: 0
      cliffs: [0.1, 0.3]
      cliffHeight: [5, 15]
      beach: 10
      dean: 0.2
      reef: false
      bars: false
      stacks: [0, 2]
      split: 0.25
      stream: 10000
      mangroves: false
      surfaces: { beach: sand, low: grass, high: forest, steep: rock, bed: sand }
    - id: rocky
      zones: { centre: 0.3, middle: 2, rim: 3 }
      height: [10, 70]
      lobes: [3, 5]
      elongation: [1.2, 2]
      warp: 0.55
      bays: [2, 5]
      rise: 0.4
      hills: 0.25
      ridges: 0.35
      cone: 0
      crater: 0
      cliffs: [0.6, 0.9]
      cliffHeight: [5, 30]
      beach: 0
      dean: 0.6
      reef: false
      bars: false
      stacks: [2, 8]
      split: 0.7
      stream: 10000
      mangroves: false
      surfaces: { beach: rock, low: heath, high: rock, steep: rock, bed: rock }
    - id: volcanic
      zones: { centre: 0.2, middle: 1.5, rim: 2.5 }
      height: [30, 80]
      lobes: [1, 2]
      elongation: [1, 1.4]
      warp: 0.35
      bays: [1, 3]
      rise: 1
      hills: 0.1
      ridges: 0.15
      cone: 0.75
      crater: 1
      cliffs: [0.2, 0.5]
      cliffHeight: [5, 20]
      beach: 8
      dean: 0.6
      reef: false
      bars: false
      stacks: [1, 4]
      split: 0.5
      stream: 10000
      mangroves: false
      surfaces: { beach: ash, low: scrub, high: ash, steep: rock, bed: rock }

  # What the ground is covered with. friction is Coulomb's coefficient of a
  # hull dragging on it, where it lies under water.
  # look is how it is drawn: a column's top and sides, the bed of it seen
  # through shallow water, and the foam added where the waves break over it
  # (a reef's crest); starting values, to be judged on a phone.
  # canopy is how high its plants stand over the ground as the wind feels
  # them, m: a windbreak shelters some ten times its height, its trees
  # counted (USDA NRCS, Conservation Practice Standard 380). cover is what
  # grows on it, each plant with the share of the ground its crowns cover
  # (the FAO's canopy cover: a forest is land with more than a tenth under
  # trees over 5 m) and, where it is particular, the ground's height, m,
  # its distance from the shore, m, its steepest slope, degrees, and whether
  # it grows only in hollows. Each biome's are its real island's: the
  # Caribbean's strand of coconut palms (there from 1549) and sea grape
  # before its inland forest of West Indian mahogany, and red mangroves on
  # sheltered shores; the Bahamas' cays, sea oats on the dunes and sea grape
  # and cocoplum behind; the Mediterranean's open woodland of holm oak and
  # stone pine over lentisk; Newfoundland's barrens, tuckamore in the
  # hollows; and Pico's lenha of Azores heath and juniper.
  surfaces:
    - { id: sand, friction: 0.4, canopy: 0, look: { top: "#e4d3a2", side: "#c9b17c", bed: "#d8c99a", crest: 0 } }
    - id: dune-grass
      friction: 0.5
      canopy: 1
      look: { top: "#b8b46a", side: "#a8915f", bed: "#c8b98a", crest: 0 }
      cover:
        - { plant: sea-oats, share: 0.22, shore: [0, 60] }
        - { plant: sea-grape, share: 0.05, shore: [12, 1000] }
        - { plant: cocoplum, share: 0.05, shore: [15, 1000] }
        - { plant: coconut-palm, share: 0.015 }
    - id: grass
      friction: 0.5
      canopy: 2
      look: { top: "#7fa04f", side: "#8a7253", bed: "#9a9c70", crest: 0 }
      cover:
        - { plant: lentisk, share: 0.06, slope: 34 }
        - { plant: stone-pine, share: 0.04, slope: 30 }
        - { plant: holm-oak, share: 0.03, slope: 30 }
    - id: forest
      friction: 0.5
      canopy: 12
      look: { top: "#4d7536", side: "#6e5a42", bed: "#7c8460", crest: 0 }
      cover:
        - { plant: holm-oak, share: 0.15, slope: 32 }
        - { plant: stone-pine, share: 0.1, slope: 32 }
        - { plant: lentisk, share: 0.05, slope: 34 }
    - { id: rock, friction: 0.6, canopy: 0, look: { top: "#9a958a", side: "#7d766c", bed: "#77786c", crest: 0 } }
    - { id: ash, friction: 0.45, canopy: 0, look: { top: "#5a5550", side: "#47423e", bed: "#4f4d4a", crest: 0 } }
    - id: scrub
      friction: 0.5
      canopy: 3
      look: { top: "#98935a", side: "#857155", bed: "#a39e7e", crest: 0 }
      cover:
        - { plant: azores-heath, share: 0.18, slope: 34 }
        - { plant: azores-juniper, share: 0.12, slope: 34 }
    - { id: reef, friction: 0.5, canopy: 0, look: { top: "#d9c8a0", side: "#b7a07a", bed: "#c6b38c", crest: 0.5 } }
    # The ground of towns, each with the part of a town it is: cobbles for
    # streets, lanes and squares; dressed stone for quays and the mole;
    # planking on piles for piers and jetties, drawn as a deck, not a
    # column; beaten earth for yards, plots and paths.
    - { id: cobbles, friction: 0.6, canopy: 0, town: street, look: { top: "#a39a8b", side: "#857c6e", bed: "#8b8a80", crest: 0 } }
    - { id: dressed-stone, friction: 0.6, canopy: 0, town: quay, look: { top: "#b9b2a3", side: "#958d7e", bed: "#8b8a80", crest: 0 } }
    - { id: planking, friction: 0.5, canopy: 0, town: deck, look: { top: "#8a6a48", side: "#5e4632", bed: "#7c7a6a", crest: 0 } }
    - { id: beaten-earth, friction: 0.5, canopy: 0, town: yard, look: { top: "#a08a64", side: "#7e6a4c", bed: "#8f8466", crest: 0 } }
    # The ground of features: a stream's bed of stones and water; the mud
    # of a mangrove shore; a fumarole's yellow sulphur; a colony's guano,
    # its rock "white-capped from years of guano" (Cape St Mary's).
    - { id: stream, friction: 0.55, canopy: 0, feature: stream, look: { top: "#7f9aa0", side: "#6f685a", bed: "#7d7a6e", crest: 0 } }
    - id: mangrove-shore
      friction: 0.5
      canopy: 6
      feature: mangrove
      look: { top: "#5f6a46", side: "#53493a", bed: "#5e5a46", crest: 0 }
      cover:
        - { plant: red-mangrove, share: 0.6 }
    - { id: sulphur, friction: 0.5, canopy: 0, feature: sulphur, look: { top: "#d8c35a", side: "#a8963e", bed: "#a19250", crest: 0 } }
    - { id: guano, friction: 0.6, canopy: 0, feature: guano, look: { top: "#ebe8de", side: "#cdc8bb", bed: "#a9a597", crest: 0 } }
    # The new biomes' own: the tropical strand behind the beach; the rocky
    # island's grass and heath; the tropical island's inland forest.
    - id: strand
      friction: 0.5
      canopy: 8
      look: { top: "#9fae62", side: "#a8915f", bed: "#c8b98a", crest: 0 }
      cover:
        - { plant: coconut-palm, share: 0.1, shore: [0, 90] }
        - { plant: sea-grape, share: 0.12, shore: [4, 300] }
        - { plant: cocoplum, share: 0.04, shore: [10, 300] }
    - id: heath
      friction: 0.5
      canopy: 1
      look: { top: "#7f8a55", side: "#7d6c54", bed: "#8f8d72", crest: 0 }
      cover:
        - { plant: tuckamore, share: 0.15, hollow: true }
        - { plant: labrador-tea, share: 0.12, slope: 30 }
        - { plant: tussock, share: 0.1 }
    - id: tropical-forest
      friction: 0.5
      canopy: 15
      look: { top: "#3f6e33", side: "#6e5a42", bed: "#7c8460", crest: 0 }
      cover:
        - { plant: mahogany, share: 0.25, slope: 32 }
        - { plant: coconut-palm, share: 0.03, height: [0, 25] }

  # The fetch of each sea area for a wind from each of 16 directions: the
  # Shore Protection Manual's effective fetch, the mean of radials a few
  # degrees apart about the wind, each run upwind to the first land
  # (Rohweder and others 2012). It is never more than weather.sea.fetchCap,
  # and only land ends it, not the rim.
  fetch:
    radials: 9
    spread: 3 # degrees between radials
    step: 8 # m

  # The land's shelter for the wind: in its lee the wind is least within
  # near times the land's height and whole again at far times it (USDA
  # NRCS; Cleugh 1998); beside the land, within flank heights of the wind's
  # path, it is faster by up to speedUp, after 1.6–2.0 h/L over a hill
  # (Jackson and Hunt 1975); land on one side turns it toward the other.
  shelter:
    reach: 800 # m upwind
    step: 16 # m
    near: 3
    far: 10
    least: 0.3
    most: 1.3
    speedUp: 0.3
    flank: 2
    turn: 20 # degrees
    offsets: [24, 48, 96, 192] # m beside the wind's path

  # Where boats start: first moored in rows across Port Royal's basin,
  # moorings.spacing m apart, moorings.clear m from land, quays and piers,
  # outside the turning circle, facing the narrows, at least moorings.least
  # of them; then the roads, the stretch of water off its coast with the
  # most room, its rows along the coast.
  start:
    moorings: { spacing: 20, clear: 10, least: 60 }
    within: 400 # m: the start area begins within this of the coast
    depth: 2 # m of water at a place, at least
    clear: 10 # m from any land
    spacing: 20 # m between places
    row: 64 # places to a row
    places: 4096

  # A boat aground and slower than stillSpeed for stillTime is pushed off
  # by its sailor into pushDepth of water within pushReach, bow to the
  # wind. Against land a hull bounces as against another hull.
  grounding:
    stillSpeed: 0.2 # m/s
    stillTime: 5 # s
    pushDepth: 1 # m
    pushReach: 40 # m: a sandy shore has a metre of water some 30 m out
    restitution: 0.3
    friction: 0.2

  # Which chunks of the land a game connection is handed, each once: those
  # its boat could see something in. A chunk whose outline is within near of
  # the boat; or a cell of land H high within the dome's sight from the
  # highest the camera goes, √(2 dome camera) + √(2 dome H), plus margin; or
  # a cell of sea bed shallower than shallows within the far sea's reach
  # from there, max(farSeaLeast, farSeaHorizon × √(2 dome camera)), plus
  # margin. The server cannot know where the camera is, only how high it
  # goes. dome and the far sea's reach are the page's, which its tests hold
  # to these.
  handout:
    near: 300 # m: the ground under the hull and the near sea's tiles, with room
    camera: 80 # m
    dome: 2500 # m
    farSeaLeast: 400 # m
    farSeaHorizon: 1.1
    margin: 100 # m
    shallows: 10 # m
    look: 20 # m

  # How the land and the shallows are drawn: columns of hexagons in terraces,
  # their sides down below the sea at the shore; the bed shows through the
  # water by exp(−2 K h) (Beer–Lambert, there and back); and how long a
  # chunk's mesh and grids are kept as the boat sails away.
  look:
    terrace: 0.8 # m
    shore: 2 # m
    attenuation: 0.15 # K, per m
    keepMeshes: 2000 # m
    keepGrids: 1500 # m

  # Places: what a sailor finds besides islands, each put where the land and
  # the sea bed make it true, by its kind's site, the definitions of
  # Smyth's Sailor's Word-Book (1867): a harbour's "security from the
  # effects of the wind and sea"; an anchorage "neither too deep, shallow,
  # or exposed"; a cove an inlet narrower at its mouth than it is deep.
  # count is how many a world has, the least and the most; mark the colour
  # the world page marks it with; worth what charting one is worth; water
  # for a place seen by looking into it, awash for one seen by the water
  # breaking on it (world.chart.sight); news for one whose charting is an
  # item of the news of its own, not folded into its island's.
  places:
    kinds:
      - { id: port, name: Port, site: harbour, count: [5, 5], mark: "#b3261e", worth: 5, news: true }
      - { id: fishing-village, name: Fishing village, site: village, count: [6, 8], mark: "#8a5a2b", worth: 2 }
      - { id: lighthouse, name: Lighthouse, site: light, count: [20, 30], mark: "#e8b400", worth: 3, news: true }
      - { id: anchorage, name: Anchorage, site: anchorage, count: [6, 8], mark: "#2b5f8a", worth: 1, water: true }
      - { id: cove, name: Cove, site: cove, count: [0, 12], mark: "#3d8a6a", worth: 1, water: true }
      - { id: lagoon, name: Lagoon, site: lagoon, count: [0, 40], mark: "#2aa7a1", worth: 1, water: true }
      - { id: reef, name: Reef, site: reef, count: [4, 80], mark: "#c2563a", worth: 1, awash: true }
      - { id: sandbar, name: Sandbar, site: bar, count: [3, 80], mark: "#c9a227", worth: 1, awash: true }
      - { id: wreck, name: Wreck, site: wreck, count: [8, 8], mark: "#5a4632", worth: 3, news: true }
    # A port: on a landmark island, at the stretch of its coast with the
    # least fetch over the 16 directions where water depth m deep lies
    # within within m of the shore; reachable from the start; not in the
    # mist band; ports apart nautical miles from each other. A port's town
    # needs room: depth m of water within pier m of its quay along one of
    # the lattice's axes, where a pier may run, and room hexagons of land
    # no steeper than 1 in steep within roomWithin m.
    harbour: { depth: 4, within: 300, apart: 1.2, pier: 250, room: 300, steep: 4, roomWithin: 150 }
    # A fishing village: on an island of the sizes given without a port, on
    # its beach or in a cove, with shallows under shallows m within ground
    # m, its fishing ground; villages apart m from each other and the ports;
    # room hexagons of land no steeper than a port's within a village's
    # reach (towns.plan.reach).
    village: { sizes: [small, medium, large], shallows: 10, ground: 300, apart: 600, room: 80 }
    # An anchorage: water depth m deep on sand, none shallower than clear m
    # within swing m (room to swing), land within land m; its shelter snug
    # where the fetch is under fetch m in snug of the 16 directions, good in
    # good (an island off an anchorage covers at most about a third of the
    # horizon); sampled every step m; anchorages apart m from each other.
    anchorage: { depth: [3, 12], swing: 60, clear: 2, land: 400, fetch: 600, snug: 6, good: 4, step: 40, apart: 500 }
    # A cove: a bay of an island's coast whose mouth is narrower than it is
    # deep, across m wide, with mouth m of water at its mouth; bays are
    # found by closing the coast with a disc of closing m.
    cove: { across: [40, 200], mouth: 2, closing: 100 }
    # A lagoon: the water behind a fringing reef, at least width m wide.
    lagoon: { width: 40 }
    # A reef: a fringing reef whose crest runs crest m or more, or an
    # offshore reef. A sandbar: a bar or spit length m long or more, or an
    # offshore bank.
    reef: { crest: 300 }
    bar: { length: 60 }
    # A wreck: on a reef's crest, a rock or a bar, or sunk in depth m of
    # water within near m of one; at least mist of them in the mist band.
    wreck: { depth: [2, 8], near: 100, mist: 2 }
    # What a site shows that names may need: water deep m deep within 60 m
    # for a tall ship. A cove or lagoon under small m across is small; a
    # reef or bar under long m is small.
    deep: 6
    small: 100
    long: 250
    # A point, where a light stands: coast with water over water of the
    # ground within reach m.
    point: { reach: 40, water: 0.55 }
    # A wrecked ship: the rigs and ages drawn, each with how she is drawn:
    # her length, beam and masts, m; how much of her is left.
    rigs:
      - { id: sloop, length: 16, beam: 5, masts: 1, mast: 16 }
      - { id: schooner, length: 22, beam: 6, masts: 2, mast: 19 }
      - { id: ketch, length: 20, beam: 6, masts: 2, mast: 17 }
      - { id: brig, length: 28, beam: 8, masts: 2, mast: 24 }
      - { id: snow, length: 30, beam: 8.5, masts: 2, mast: 25 }
    ages:
      - { id: fresh, hull: 1, masts: 1 }
      - { id: old, hull: 0.7, masts: 0.4 }
      - { id: ribs, hull: 0.35, masts: 0 }

  # Lighthouses: Port Royal's, the tallest; one at every port; one on every
  # offshore hazard, and on the rocks and fringing reefs beyond hazards
  # nautical miles, one light for hazards within merge m of each other; and
  # a ring of edge lights on the approach to the edge, each on the outermost
  # land within within degrees of its bearing and at least inside m inside
  # the lip. Port Royal's stands on its island's highest ground within coast
  # m of the coast.
  lights:
    towers: { mainPort: 60, port: 30, edge: 30, hazard: 15 } # m
    mainPortCoast: 100 # m
    edge: { count: 8, within: 15, inside: 300 }
    hazards: { beyond: 3.6, merge: 400 }
    # Nominal ranges, nautical miles: the great lights about twice the
    # minor ones, as the Bahamas' are; a red or green light colour times a
    # white one's.
    range: { mainPort: 4.5, port: 2.5, edge: 2, hazard: 1.5, colour: 0.5 }
    # Allard's law: the illuminance at the eye of a light of intensity I at
    # d is I T^d / d², with the air's transmissivity per nautical mile T =
    # 0.05^(1/V) for the clear air's visibility V; a light is seen while it
    # is above the threshold of 2 × 10⁻⁷ lux (the International Technical
    # Conference of Lighthouse Authorities, Paris 1933).
    clearAir: 4.5 # nautical miles
    threshold: 2.0e-7 # lux
    # A light is sent to a connection once its eye is within its range, and
    # dropped drop m beyond it.
    drop: 200 # m
    # Each light has a character of its own, from this list: IALA's classes
    # within the limits of Recommendation E-110, and none the buoyage system
    # keeps for its marks (quick and very quick; white Fl(2) 5 s or 10 s,
    # the isolated danger's; white Oc, Iso and LFl 10 s and Mo(A), the safe
    # water mark's; Mo(U); red or green Fl(2+1)), nor a fixed light. steps
    # are its light and dark in turn, ms, beginning with light. Lights whose
    # ranges overlap differ in class, number in a group or colour, not by
    # period alone (IALA Guideline G1116); colour only on a hazard.
    mainPortCharacter: Fl(3) W 15s
    colours: { white: "#fff1d6", red: "#ff3a1e", green: "#2bff74" }
    characters:
      - { notation: Fl W 5s, class: Fl, group: "1", colour: white, steps: [500, 4500] }
      - { notation: Fl W 10s, class: Fl, group: "1", colour: white, steps: [1000, 9000] }
      - { notation: Fl W 15s, class: Fl, group: "1", colour: white, steps: [1000, 14000] }
      - { notation: LFl W 15s, class: LFl, group: "1", colour: white, steps: [2000, 13000] }
      - { notation: Fl(2) W 15s, class: Fl, group: "2", colour: white, steps: [500, 1000, 500, 13000] }
      - { notation: Fl(2) W 20s, class: Fl, group: "2", colour: white, steps: [500, 1000, 500, 18000] }
      - { notation: Fl(3) W 10s, class: Fl, group: "3", colour: white, steps: [500, 1500, 500, 1500, 500, 5500] }
      - { notation: Fl(3) W 15s, class: Fl, group: "3", colour: white, steps: [500, 1500, 500, 1500, 500, 10500] }
      - { notation: Fl(3) W 20s, class: Fl, group: "3", colour: white, steps: [500, 1500, 500, 1500, 500, 15500] }
      - { notation: Fl(4) W 15s, class: Fl, group: "4", colour: white, steps: [500, 1500, 500, 1500, 500, 1500, 500, 8500] }
      - { notation: Fl(4) W 20s, class: Fl, group: "4", colour: white, steps: [500, 1500, 500, 1500, 500, 1500, 500, 13500] }
      - { notation: Fl(5) W 20s, class: Fl, group: "5", colour: white, steps: [500, 1500, 500, 1500, 500, 1500, 500, 1500, 500, 11500] }
      - { notation: Fl(5) W 25s, class: Fl, group: "5", colour: white, steps: [500, 1500, 500, 1500, 500, 1500, 500, 1500, 500, 16500] }
      - { notation: Fl(2+1) W 15s, class: Fl, group: "2+1", colour: white, steps: [500, 1000, 500, 3000, 500, 9500] }
      - { notation: Oc(2) W 10s, class: Oc, group: "2", colour: white, steps: [7000, 1000, 1000, 1000] }
      - { notation: Oc(2) W 15s, class: Oc, group: "2", colour: white, steps: [12000, 1000, 1000, 1000] }
      - { notation: Oc(3) W 15s, class: Oc, group: "3", colour: white, steps: [10000, 1000, 1000, 1000, 1000, 1000] }
      - { notation: Oc(3) W 20s, class: Oc, group: "3", colour: white, steps: [15000, 1000, 1000, 1000, 1000, 1000] }
      - { notation: Oc(4) W 20s, class: Oc, group: "4", colour: white, steps: [13000, 1000, 1000, 1000, 1000, 1000, 1000, 1000] }
      - { notation: Mo(D) W 15s, class: Mo, group: D, colour: white, steps: [1500, 500, 500, 500, 500, 11500] }
      - { notation: Mo(K) W 15s, class: Mo, group: K, colour: white, steps: [1500, 500, 500, 500, 1500, 10500] }
      - { notation: Fl R 5s, class: Fl, group: "1", colour: red, steps: [500, 4500] }
      - { notation: Fl(2) R 10s, class: Fl, group: "2", colour: red, steps: [500, 1000, 500, 8000] }
      - { notation: Fl(3) R 15s, class: Fl, group: "3", colour: red, steps: [500, 1500, 500, 1500, 500, 10500] }
      - { notation: Fl G 5s, class: Fl, group: "1", colour: green, steps: [500, 4500] }
      - { notation: Fl(2) G 10s, class: Fl, group: "2", colour: green, steps: [500, 1000, 500, 8000] }
      - { notation: Oc R 6s, class: Oc, group: "1", colour: red, steps: [4500, 1500] }
      - { notation: Oc G 6s, class: Oc, group: "1", colour: green, steps: [4500, 1500] }
      - { notation: Iso R 6s, class: Iso, group: "1", colour: red, steps: [3000, 3000] }
      - { notation: Iso G 6s, class: Iso, group: "1", colour: green, steps: [3000, 3000] }
    # How lighthouses are drawn: stone towers with an iron gallery, a glass
    # lantern and a copper cupola, each with its daymark, so that towers are
    # told apart by day as at sea; the light a glow at the lantern, with two
    # faint beams turning with a flashing light's flash near it, rising and
    # falling over rise of the flash as a turning lens's does; beyond the
    # tower's horizon, its loom on the horizon at its true bearing.
    look:
      daymarks:
        - { id: white, body: "#ece6d8", band: "#ece6d8" }
        - { id: red-bands, body: "#ece6d8", band: "#a8322a" }
        - { id: black-bands, body: "#ece6d8", band: "#2a2826" }
      stone: "#bdb3a1"
      iron: "#2c2b2a"
      copper: "#5e8f78"
      glow: 3 # m across the lantern's glow
      least: 6 # CSS pixels: the glow is never drawn smaller
      rise: 0.15
      beams: 1500 # m: beams are seen within this of the light
      loom: 0.35 # the loom's strength beside the light's own

  # Towns: Port Royal's round its basin, a smaller one at every port's quay
  # and pier, and at every fishing village "the room" of Newfoundland's
  # premises, "stages, sheds and wharves" (Heritage NL), with its houses
  # scattered up the slope above. Streets first, then buildings along them
  # facing them, then the ground levelled into the land's terraces, as the
  # period's harbour towns grew (St George's, Bermuda: a square on the
  # harbour, a street along the quays, a main street behind, lanes beyond),
  # with Emilien and others' rules (2012) for where the larger and the
  # special buildings stand. Starting values, judged in the preview.
  towns:
    # Quays and piers: a quay's top quay m above the sea, foot m of water at
    # its foot at Port Royal and at a port; Port Royal's long piers, where tall
    # ships lie, and short ones, each length m out and width m wide along
    # one of the lattice's axes; a port's piers; a village's jetty.
    waterfront:
      quay: 1.6 # m
      foot: { main: 5, port: 4 } # m
      long: { count: 2, length: [40, 60], width: 8 }
      short: { count: 2, length: [15, 30], width: 4 }
      port: { count: [1, 2], width: 8 }
      jetty: { length: [10, 20], width: 4 }
    # The plan: the quay street quay m wide along the water; contour streets
    # behind it, apart m further from the shore than the last, wandering
    # by wander m, street m wide, at most contours of them at Port Royal
    # and at a port; lanes lane m wide up the slope between them, each the least-cost
    # path over the hexagons, whose cost rises steeply over 1 in steep, with
    # turn the cost of a turn and the streets already made at reuse of their
    # cost (Galin and others, 2010), lanes of them, apart m along the quay;
    # buildings set back setBack m from their way, turned up to turn
    # degrees off it, gaps m apart, one place in gardens left as a garden,
    # none on a slope over 1 in plot; reach m inland at most (Port Royal's,
    # a port's, a village's).
    plan:
      quay: 6 # m
      apart: [18, 25] # m
      wander: 3 # m
      street: 3.5 # m
      contours: { main: 5, port: 2 }
      lane: 3 # m
      steep: 6
      turn: 2
      reuse: 0.2
      lanes: 35 # m
      setBack: [2, 5] # m
      angle: 10 # degrees
      gaps: [0.5, 2] # m
      gardens: 8
      plot: 3
      reach: [120, 90, 80] # m
      square: { along: 20, back: 16 } # m along the quay and back from it
    # How many buildings a town has: Port Royal's, a port's, a village's.
    size: { main: [150, 250], port: [20, 120], village: [6, 20] }
    # The kinds of building, each with its footprint (frontage along its
    # way, depth back from it, m), its storeys, where it stands, how many
    # Port Royal, a port and a village have (fill: a weight among the
    # buildings that fill the streets, by count where it has one), and what
    # it shows: a chimney's share, a flag, a lantern by its door's share,
    # the height its top stands, m (0: its storeys' and its roof's). Every
    # kind gives every value, 0 for none. Real sizes: Port Royal's excavated
    # Building 3 was 11.6 m by 8.2 m, two storeys (Hamilton, 1981–1990).
    # Props are small things that stand about, drawn near only.
    buildings:
      - { id: dwelling, name: Dwelling, prop: false, frontage: [5, 8], depth: [6, 9], storeys: [1, 2], stands: street, fill: 6, main: [0, 0], port: [0, 0], village: [0, 0], chimney: 1, flag: false, lantern: 0.5, top: 0, colour: "#c9b08a" }
      - { id: town-house, name: Town house, prop: false, frontage: [6, 9], depth: [7, 10], storeys: [2, 3], stands: street, fill: 3, main: [0, 0], port: [0, 0], village: [0, 0], chimney: 1, flag: false, lantern: 0.6, top: 0, colour: "#d1b994" }
      - { id: merchants-house, name: Merchant's house, prop: false, frontage: [9, 12], depth: [9, 13], storeys: [2, 3], stands: quay, fill: 0, main: [4, 8], port: [1, 3], village: [0, 0], chimney: 1, flag: false, lantern: 1, top: 0, colour: "#b89a70" }
      - { id: warehouse, name: Warehouse, prop: false, frontage: [9, 12], depth: [8, 12], storeys: [2, 2], stands: quayEnd, fill: 0, main: [4, 6], port: [1, 3], village: [0, 0], chimney: 0, flag: false, lantern: 0.5, top: 0, colour: "#9b8466" }
      - { id: tavern, name: Tavern, prop: false, frontage: [7, 10], depth: [8, 11], storeys: [2, 2], stands: quay, fill: 0, main: [1, 2], port: [1, 1], village: [0, 0], chimney: 1, flag: false, lantern: 1, top: 0, colour: "#a8865c" }
      - { id: harbourmasters-house, name: Harbourmaster's house, prop: false, frontage: [7, 10], depth: [7, 9], storeys: [2, 2], stands: square, fill: 0, main: [1, 1], port: [1, 1], village: [0, 0], chimney: 1, flag: true, lantern: 1, top: 0, colour: "#b3261e" }
      - { id: church, name: Church, prop: false, frontage: [10, 12], depth: [18, 22], storeys: [1, 1], stands: above, fill: 0, main: [1, 1], port: [0, 0], village: [0, 0], chimney: 0, flag: true, lantern: 1, top: 22, colour: "#e8e0cc" }
      - { id: windmill, name: Windmill, prop: false, frontage: [7, 7], depth: [7, 7], storeys: [1, 1], stands: summit, fill: 0, main: [1, 1], port: [0, 0], village: [0, 0], chimney: 0, flag: true, lantern: 0, top: 14, colour: "#d9d2bf" }
      - { id: farmhouse, name: Farmhouse, prop: false, frontage: [8, 11], depth: [6, 8], storeys: [1, 2], stands: fields, fill: 0, main: [5, 5], port: [0, 2], village: [0, 0], chimney: 1, flag: false, lantern: 0, top: 0, colour: "#9a7e52" }
      - { id: fishermans-hut, name: Fisherman's hut, prop: false, frontage: [4, 6], depth: [4, 6], storeys: [1, 1], stands: slope, fill: 0, main: [5, 5], port: [0, 0], village: [5, 14], chimney: 1, flag: false, lantern: 0.3, top: 0, colour: "#7d6a52" }
      - { id: fish-stage, name: Stage, prop: false, frontage: [5, 7], depth: [8, 12], storeys: [1, 1], stands: water, fill: 0, main: [0, 0], port: [0, 0], village: [1, 3], chimney: 0, flag: false, lantern: 0, top: 0, colour: "#6b5440" }
      - { id: flake, name: Flake, prop: false, frontage: [6, 10], depth: [3, 4], storeys: [1, 1], stands: behind, fill: 0, main: [0, 0], port: [0, 0], village: [1, 3], chimney: 0, flag: false, lantern: 0, top: 0, colour: "#8c7a5c" }
      - { id: boat-shed, name: Boat shed, prop: false, frontage: [4, 5], depth: [7, 9], storeys: [1, 1], stands: shore, fill: 0, main: [0, 0], port: [0, 0], village: [0, 2], chimney: 0, flag: false, lantern: 0, top: 0, colour: "#6e5a44" }
      - { id: shipyard-slip, name: Slip, prop: false, frontage: [8, 10], depth: [28, 34], storeys: [1, 1], stands: slip, fill: 0, main: [1, 1], port: [0, 0], village: [0, 0], chimney: 0, flag: false, lantern: 0, top: 8, colour: "#5f4a36" }
      - { id: market-stall, name: Market stall, prop: true, frontage: [2.5, 3], depth: [2, 2], storeys: [1, 1], stands: square, fill: 0, main: [4, 8], port: [0, 3], village: [0, 0], chimney: 0, flag: false, lantern: 0, top: 0, colour: "#c8a060" }
      - { id: well, name: Well, prop: true, frontage: [2, 2], depth: [2, 2], storeys: [1, 1], stands: square, fill: 0, main: [1, 1], port: [0, 1], village: [0, 0], chimney: 0, flag: false, lantern: 0, top: 0, colour: "#9a958a" }
      - { id: crane, name: Crane, prop: true, frontage: [3, 3], depth: [3, 3], storeys: [1, 1], stands: quay, fill: 0, main: [1, 2], port: [0, 1], village: [0, 0], chimney: 0, flag: false, lantern: 0, top: 9, colour: "#6a5038" }
      - { id: bollard, name: Bollard, prop: true, frontage: [0.4, 0.4], depth: [0.4, 0.4], storeys: [1, 1], stands: edge, fill: 0, main: [20, 40], port: [4, 10], village: [0, 0], chimney: 0, flag: false, lantern: 0, top: 0, colour: "#3c3a36" }
      - { id: lantern-post, name: Lantern post, prop: true, frontage: [0.4, 0.4], depth: [0.4, 0.4], storeys: [1, 1], stands: post, fill: 0, main: [16, 30], port: [3, 8], village: [0, 2], chimney: 0, flag: false, lantern: 1, top: 0, colour: "#2c2b2a" }
      - { id: crates, name: Crates and barrels, prop: true, frontage: [2, 3], depth: [1.5, 2], storeys: [1, 1], stands: quay, fill: 0, main: [6, 12], port: [2, 6], village: [1, 3], chimney: 0, flag: false, lantern: 0, top: 0, colour: "#8a6a48" }
      - { id: boat-ashore, name: A boat drawn up, prop: true, frontage: [1.6, 1.8], depth: [4.5, 5], storeys: [1, 1], stands: beach, fill: 0, main: [3, 6], port: [0, 0], village: [2, 6], chimney: 0, flag: false, lantern: 0, top: 0, colour: "#5c4a38" }
      # Ruins: a deserted hamlet's roofless houses, a ruined chapel, its gable
      # standing, and a ruined beacon, Smyth's "signal-mark placed on the top
      # of hills … near the shore for the safe guidance of shipping": a stone
      # watch-house and its fire-basket; and the hamlet's well, dry. No town
      # has them.
      - { id: roofless-house, name: Roofless house, prop: false, frontage: [5, 7], depth: [5, 7], storeys: [1, 1], stands: hamlet, fill: 0, main: [0, 0], port: [0, 0], village: [0, 0], chimney: 0, flag: false, lantern: 0, top: 3, colour: "#b8ab90" }
      - { id: chapel-ruin, name: Ruined chapel, prop: false, frontage: [7, 9], depth: [12, 16], storeys: [1, 1], stands: chapel, fill: 0, main: [0, 0], port: [0, 0], village: [0, 0], chimney: 0, flag: false, lantern: 0, top: 9, colour: "#d8d0bc" }
      - { id: beacon-ruin, name: Ruined beacon, prop: false, frontage: [4, 5], depth: [4, 5], storeys: [1, 1], stands: beacon, fill: 0, main: [0, 0], port: [0, 0], village: [0, 0], chimney: 0, flag: false, lantern: 0, top: 7, colour: "#a8a090" }
      - { id: dry-well, name: Dry well, prop: true, frontage: [2, 2], depth: [2, 2], storeys: [1, 1], stands: hamlet, fill: 0, main: [0, 0], port: [0, 0], village: [0, 0], chimney: 0, flag: false, lantern: 0, top: 0, colour: "#9a958a" }
    # Each biome's kit: its models, one for each kind of building, in
    # their storeys, coloured per house from its palette (walls, roofs,
    # shutters and doors, as #rrggbb), and the tree planted by its houses,
    # if any (the Mediterranean's cypress, the Caribbean's palm). Port
    # Royal's is always its biome's.
    kits:
      - { biome: wooded, garden: italian-cypress, art: { model: town/wooded.glb }, walls: ["#e6dcc4", "#d9c7a0", "#e8d2b4", "#cfc0a4", "#ddd6c8"], roofs: ["#a4553a", "#8f4a34", "#b0603f", "#7e4632"], shutters: ["#4a6a52", "#6a3a2e", "#3e5670", "#8a7a3e"] }
      - { biome: tropical, garden: coconut-palm, art: { model: town/tropical.glb }, walls: ["#f0e2c0", "#e6c79a", "#d8e0d0", "#f2d6c4", "#e0d8b8"], roofs: ["#7a6a58", "#8a7660", "#6c5c4c", "#968470"], shutters: ["#3f7a6e", "#2e5e8a", "#c0703e", "#5e8a3e"] }
      - { biome: rocky, art: { model: town/rocky.glb }, walls: ["#e8e4dc", "#b84a3a", "#d8c890", "#6a7a8a", "#c8c0b0"], roofs: ["#3e3c3a", "#4c4844", "#5a4e44", "#34383c"], shutters: ["#e8e4dc", "#2c2b2a", "#3e5670", "#6a3a2e"] }
      - { biome: sandy, art: { model: town/sandy.glb }, walls: ["#f4ecd8", "#f0d8d0", "#dce6e0", "#f2e2b8", "#e6dcf0"], roofs: ["#f6f4ee", "#eeece4", "#f2f0ea", "#e8e6de"], shutters: ["#3e6e5e", "#3e5670", "#7a4a3a", "#8a8a5a"] }
      - { biome: volcanic, art: { model: town/volcanic.glb }, walls: ["#ecebe4", "#e4e0d4", "#d8d4c8", "#efece2", "#dad6cc"], roofs: ["#9a4e36", "#8a4632", "#a45a3e", "#7a4030"], shutters: ["#2e5e3e", "#7a2e2a", "#2e4a6e", "#3a3a3a"] }
    # Flags on the harbourmaster's house at every port, Port Royal's church
    # and its windmill: each a pennant length m long that streams with the
    # true wind at at m, hanging limp under limp knots and extended from
    # extended knots (Beaufort force 3: "light flags extended"), flapping at
    # a Strouhal number fL/U of strouhal (Taneda 1968). Port Royal's colours
    # are its own; each port has a pair of the list's, never a nation's.
    flags:
      length: 2.4 # m
      at: 10 # m
      limp: 3 # knots
      extended: 7 # knots
      strouhal: 0.2
      mainPort: ["#1f3f7a", "#e8e0cc"]
      colours: [["#b3261e", "#e8e0cc"], ["#2e6e4e", "#e8c040"], ["#e8e0cc", "#1f3f7a"], ["#3e3a6a", "#d07a2e"], ["#8a2e5e", "#e8e0cc"], ["#2e5e8a", "#e8c040"], ["#c0703e", "#2c2b2a"]]
    # Chimney smoke: from day of the chimneys by day and night by night,
    # puffs rising at rise m/s from the pot, carried at the wind's speed at
    # at m, rising straight in a calm, drifting from force 1, bending over as
    # Briggs's two-thirds law has a plume, rise ∝ x^(2/3) / u, and fading
    # over life s; drawn within reach m of the camera.
    smoke:
      day: 0.15
      night: 0.05
      rise: 0.8 # m/s
      buoyancy: 0.6 # m: Briggs's 1.6 F^(1/3), for a cottage's fire, as the puff's rise at 1 m in a 1 m/s wind
      life: 9 # s
      puffs: 6
      size: [0.8, 4] # m across, at the pot and at its end
      reach: 600 # m
    # In port: the water within reach m of a port's quay and piers, or of a
    # village's jetty; Port Royal's, its basin and narrows.
    inPort: { port: 150, village: 100, step: 40 }
    # Lanterns ashore are lit as boats' are, by the sun at the town: on the
    # posts, by the doors, and in the windows, a share of each house's.
    lit: { windows: 0.6, near: 300, props: 120 }

  # The rules a world must pass; one that fails is made again from the next
  # seed, at most attempts times.
  validator:
    attempts: 20
    centreOffset: 150 # m: the main port's centre from the disk's, at most
    landShare: [0.7, 2.5] # percent of the disk
    counts: 0.3 # each size class within this share of its expected count
    openWater: 1500 # m: inside the mist band, but in the main port's calm water, no water is further from land
    shoreline: 1.4 # a landmark's shoreline development index, at least
    reachDepth: 2 # m: every landmark reachable from the start in this much water
    # At every point of water on a grid of lightGrid m inside the mist band,
    # at least lightsInRange lights in range: two for a fix by bearings.
    lightsInRange: 2
    lightGrid: 250 # m
    # Every world has a feature of each of these sites; at least classA
    # islands of class A, middle of them in the middle waters and rim at the
    # rim; and each class A island's best feature seen from water a boat
    # reaches within seen m.
    features: { sites: [cave, arch, waterfall, crater, ruin, colony], classA: 6, middle: 2, rim: 2, seen: 300 }

  # How islands are named, from the generator's names: by size class, biome
  # and the features the terrain shows, then preferring the island's zone,
  # then by chance, the tones weighted by zone.
  names:
    # The features a name may need, by the word the names give each, and
    # what shows it: a coast with at least cliffs of cliff; a summit at least
    # peak m high; two summits each at least twin of the highest, twinApart
    # m apart; at least stacks stacks off the coast; a reef; a lagoon behind
    # it at least lagoon m wide; 0 or false for a test a feature has not.
    # An island also shows the word of each of its features' kinds
    # (world.features.kinds). A feature nothing shows is never shown, and no
    # name that needs it is given: a wreck, laid after the islands are
    # named.
    features:
      - { word: cliffs, cliffs: 0.3, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
      - { word: peak, cliffs: 0, peak: 40, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
      - { word: twin, cliffs: 0, peak: 0, twin: 0.6, twinApart: 150, stacks: 0, reef: false, lagoon: 0 }
      - { word: stack, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 1, reef: false, lagoon: 0 }
      - { word: reef, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: true, lagoon: 0 }
      - { word: lagoon, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 40 }
      - { word: arch, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
      - { word: birds, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
      - { word: cave, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
      - { word: ruins, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
      - { word: smoke, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
      - { word: spring, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
      - { word: waterfall, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
      - { word: wreck, cliffs: 0, peak: 0, twin: 0, twinApart: 0, stacks: 0, reef: false, lagoon: 0 }
    # Weights of each tone by zone, and how many of it a world may have
    # (0 for no limit). A name of a phantom tone that belongs only to the
    # rim is given only in the mist band.
    tones:
      - { word: plain, centre: 4, middle: 4, rim: 3, most: 0, phantom: false }
      - { word: cheerful, centre: 3, middle: 2, rim: 1, most: 0, phantom: false }
      - { word: wry, centre: 2, middle: 2, rim: 1.5, most: 0, phantom: false }
      - { word: eerie, centre: 0.2, middle: 1, rim: 3, most: 0, phantom: true }
      - { word: warning, centre: 0.2, middle: 1, rim: 2.5, most: 0, phantom: false }
      - { word: grim, centre: 0.05, middle: 0.2, rim: 0.5, most: 1, phantom: false }
    # Neighbours may share a name, as real charts do: two islands of a
    # biome within neighbours m take one of the pairs of prefixes, the
    # larger the first of Great and Little, by chance neighbourShare; an
    # islet within calf m of a larger island may take the generic whose
    # form names an island, as the Calf of Man does, by chance calfShare.
    neighbours: 700 # m
    neighbourShare: 0.15
    prefixes: [[Great, Little], [North, South], [East, West], [Inner, Outer]]
    calf: 300 # m
    calfShare: 0.3
    # A reef with a wreck on it may take her name, as the Florida reefs took
    # their ships' (Carysfort Reef, Looe Key), by chance wreckReef.
    wreckReef: 0.3

  # The islands' features, each made where the land and the sea make it:
  # caves, arches and blowholes cut into cliffed headlands in the order the
  # sea cuts them (a notch, a cave, an arch where the headland is narrow, a
  # stack when its roof falls); springs, streams and waterfalls from each
  # island's drainage; a volcanic island's cone and crater, smoking while it
  # is young; ruins; and seabird colonies on stacks, cliffs and cays. Each
  # kind with its site, the word it shows names, the biomes whose islands
  # have it, the chance one with a site for it does (a ruin's and a
  # colony's, its weight among the world's), its weight by zone, the
  # colour the world page marks it with, what charting one is worth and the
  # chart's symbol for it. Starting values, judged in the preview.
  features:
    kinds:
      - { id: sea-cave, name: Sea cave, site: cave, word: cave, biomes: [rocky, volcanic, wooded], chance: 0.35, zones: { centre: 0.7, middle: 1.6, rim: 1.3 }, mark: "#5b4a8a", worth: 2, symbol: cave }
      - { id: sea-arch, name: Sea arch, site: arch, word: arch, biomes: [rocky, volcanic, wooded], chance: 0.4, zones: { centre: 0.6, middle: 1.8, rim: 1.5 }, mark: "#8a3d6b", worth: 2, symbol: arch }
      - { id: blowhole, name: Blowhole, site: blowhole, word: cave, biomes: [rocky, volcanic, wooded], chance: 0.6, zones: { centre: 1, middle: 1, rim: 1 }, mark: "#3d6b8a", worth: 2, symbol: blowhole }
      - { id: waterfall, name: Waterfall, site: waterfall, word: waterfall, biomes: [tropical, wooded, rocky, volcanic], chance: 0.7, zones: { centre: 0.8, middle: 1.6, rim: 1.2 }, mark: "#2f7fb3", worth: 2, symbol: fall }
      - { id: spring, name: Spring, site: spring, word: spring, biomes: [tropical, wooded, rocky, volcanic], chance: 1, zones: { centre: 1, middle: 1, rim: 1 }, mark: "#5fa3c9", worth: 2, symbol: spring }
      - { id: crater, name: Crater, site: crater, biomes: [volcanic], chance: 1, zones: { centre: 1, middle: 1, rim: 1 }, mark: "#6b4a3a", worth: 2, symbol: crater }
      - { id: fumarole, name: Fumarole, site: fumarole, word: smoke, biomes: [volcanic], chance: 1, zones: { centre: 1, middle: 1, rim: 1 }, mark: "#c9b43a", worth: 2, symbol: smoke }
      - { id: ruined-chapel, name: Ruined chapel, site: ruin, ruin: chapel, word: ruins, biomes: [wooded, tropical, rocky, sandy, volcanic], chance: 1, zones: { centre: 0.5, middle: 1, rim: 1.5 }, mark: "#7a6a5a", worth: 2, symbol: ruin }
      - { id: ruined-beacon, name: Ruined beacon, site: ruin, ruin: beacon, word: ruins, biomes: [wooded, tropical, rocky, volcanic], chance: 1, zones: { centre: 0.5, middle: 1, rim: 1.5 }, mark: "#8a6a3a", worth: 2, symbol: ruin }
      - { id: deserted-hamlet, name: Deserted hamlet, site: ruin, ruin: hamlet, word: ruins, biomes: [wooded, tropical, rocky, sandy, volcanic], chance: 1, zones: { centre: 0.5, middle: 1, rim: 1.5 }, mark: "#9a7a5a", worth: 2, symbol: ruin }
      # Gannets on stacks and cliff ledges (Bird Rock, Cape St Mary's: some
      # 30,000 birds); brown boobies on cays and cliffs; frigatebirds over
      # mangroves and trees (Half Moon Caye). Each colony's birds: where they
      # nest, their wingspan, m, colours, wingbeats, Hz, the share of the
      # time they glide, and their call.
      - id: gannetry
        name: Gannetry
        site: colony
        word: birds
        biomes: [rocky, volcanic, wooded]
        chance: 1
        zones: { centre: 0.3, middle: 1, rim: 2 }
        mark: "#e8e6dc"
        worth: 2
        symbol: birds
        birds: { nests: [stack, cliff], span: 1.75, body: "#f2f0e8", wing: "#f2f0e8", tip: "#1e1c1a", flap: 3, glide: 0.5, call: harsh }
      - id: booby-colony
        name: Booby colony
        site: colony
        word: birds
        biomes: [sandy, tropical]
        chance: 1
        zones: { centre: 1, middle: 1, rim: 0.6 }
        mark: "#b89a70"
        worth: 2
        symbol: birds
        birds: { nests: [cay, cliff], span: 1.4, body: "#efece4", wing: "#5a4634", tip: "#4a3a2a", flap: 3.5, glide: 0.4, call: whistle }
      - id: frigatebird-roost
        name: Frigatebird roost
        site: colony
        word: birds
        biomes: [tropical]
        chance: 0.6
        zones: { centre: 1, middle: 1, rim: 0.6 }
        mark: "#3a3436"
        worth: 2
        symbol: birds
        birds: { nests: [trees], span: 2.3, body: "#1c1a1a", wing: "#1c1a1a", tip: "#1c1a1a", flap: 2, glide: 0.85, call: rattle }
    # On a headland whose coast stands cliff m or higher: a cave depth
    # hexagons in from the cliff's foot, its roof's underside underside m
    # above the sea with roof m of rock over it at least, facing open m of
    # open water (Fingal's Cave on Staffa: 69–82 m long, 12 m wide, its roof
    # 20–22 m over the sea); where the headland's neck is neck hexagons
    # across or fewer, an arch through it, its underside underside of the
    # neck's height; on a cave whose roof is blowhole.roof m thin or
    # thinner, a vent at its back that spouts with the waves. Under a roof
    # the ground is rock awash, floor m deep: the sea foams through and no
    # boat sails it, at the sea's level shallower than any hull draws (the
    # Jolly boat's 0.094 m).
    headland:
      cliff: 8 # m
      floor: [0, 0] # m
      cave: { depth: [2, 6], underside: [3, 8], roof: 2, open: 1000 }
      arch: { neck: 3, underside: [0.5, 0.7] }
      blowhole: { roof: 4 } # m
    # Each island drained by Priority-Flood (Barnes, Lehman and Mulla 2014):
    # a stream where its catchment passes its biome's stream, from its
    # spring, where it first passed spring m²; it falls where it reaches a
    # coast fall m high or higher; on an island given a waterfall whose
    # stream reaches a beach, the coast is raised into a cliff valley m
    # either side of it, its last stretch kept level, as a hanging valley is
    # left where a cliff retreats faster than its stream cuts down (Leyland
    # and Darby 2008), never further inland than reach m.
    streams:
      spring: 1000 # m²
      fall: 5 # m
      valley: [20, 40] # m
      reach: 120 # m
    # A cinder cone's height is 0.18 of its basal width and its crater 0.40
    # when fresh (Porter 1972; Wood 1980); with age the first falls toward
    # 0.10 and the second rises toward 0.83 (Bloomfield 1975); depth is the
    # crater's below its rim, of the cone's height. Each volcanic island's
    # age is drawn by the weights; a young one has fumaroles, steaming, with
    # sulphur m about each vent, each vent's plume rising up to plume of its
    # crater's width: the bigger the crater, the bigger its steam.
    cone:
      fresh: { height: 0.18, crater: 0.4, depth: 0.3 }
      old: { height: 0.1, crater: 0.83, depth: 0.1 }
      ages: { young: 1, middle: 1.5, old: 1 }
      fumaroles: [1, 4]
      sulphur: 8 # m
      plume: 0.25
    # Ruins: count a world, on islands of the sizes given with no town,
    # apart m from each other; a deserted hamlet's houses; a beacon within
    # beacon m of the coast.
    ruins:
      count: [2, 5]
      sizes: [medium, large]
      hamlet: [3, 10]
      beacon: 150 # m
      apart: 1500 # m
    # Colonies: count a world, each with birds on the wing by day, wheeling
    # within wheel m of it.
    colonies:
      count: [2, 8]
      birds: [20, 60]
      wheel: [30, 90] # m
    # How they are drawn and heard: a fall's width at the least and the most
    # catchment, m, and its spray, a share of its height; a blowhole's spout,
    # times the waves' height; a fumarole's steam's rise, m/s; heard within
    # reach m, falling 6 dB a doubling.
    look:
      fall: [1.5, 8]
      spray: 0.3
      spout: 4
      steam: 1.2 # m/s
      reach: 300 # m

  # The plants (world.surfaces' cover), each in its form at its real size:
  # its height grown and its crown's width, m (World Agroforestry; UF IFAS;
  # nurseries' data; the RHS; RBGE), its trunk's and leaves' colours, and
  # how stiff it is in the wind. Drawn near as its model within look.near
  # of the camera on the high, medium and low rungs, beyond as a crown to
  # look.far; shrubs and tufts near only. In the wind by Beaufort's land
  # scale (Royal Meteorological Society): at force 3 "leaves and small twigs
  # in constant motion", at 5 "small trees in leaf begin to sway", at 6
  # "large branches in motion", at 7 "whole trees in motion".
  flora:
    art: { model: flora/plants.glb }
    kinds:
      - { id: coconut-palm, name: Coconut palm, form: palm, height: [18, 28], crown: [8, 11], trunk: "#8a7a62", leaf: "#5c8a3a", stiffness: 0.15 }
      - { id: sea-grape, name: Sea grape, form: broadleaf, height: [3, 8], crown: [3, 6], trunk: "#6e5a48", leaf: "#5f8a3c", stiffness: 0.5 }
      - { id: red-mangrove, name: Red mangrove, form: mangrove, height: [4, 8], crown: [4, 7], trunk: "#6b5240", leaf: "#3f6a34", stiffness: 0.6 }
      - { id: mahogany, name: West Indian mahogany, form: broadleaf, height: [10, 20], crown: [8, 14], trunk: "#5e4a3a", leaf: "#3d6b2f", stiffness: 0.7 }
      - { id: sea-oats, name: Sea oats, form: tuft, height: [1, 2], crown: [0.6, 1.2], trunk: "#b8a874", leaf: "#c2b77a", stiffness: 0.2 }
      - { id: cocoplum, name: Cocoplum, form: shrub, height: [1, 4], crown: [1.5, 3], trunk: "#6e5a48", leaf: "#4f7e3a", stiffness: 0.6 }
      - { id: holm-oak, name: Holm oak, form: broadleaf, height: [12, 20], crown: [10, 14], trunk: "#4e4238", leaf: "#3a5a32", stiffness: 0.8 }
      - { id: stone-pine, name: Stone pine, form: umbrella, height: [12, 18], crown: [8, 12], trunk: "#7a5a44", leaf: "#4a6e3c", stiffness: 0.7 }
      - { id: italian-cypress, name: Italian cypress, form: columnar, height: [10, 18], crown: [1.5, 3], trunk: "#4e4238", leaf: "#2f4a2c", stiffness: 0.5 }
      - { id: lentisk, name: Lentisk, form: shrub, height: [1, 3], crown: [1.5, 3], trunk: "#5e4e40", leaf: "#4e6a3a", stiffness: 0.7 }
      - { id: tuckamore, name: Tuckamore, form: krummholz, height: [1, 3], crown: [2, 4], trunk: "#4a3e34", leaf: "#2f4a32", stiffness: 0.9 }
      - { id: labrador-tea, name: Labrador tea, form: shrub, height: [0.4, 1.2], crown: [0.8, 1.5], trunk: "#5a4a3a", leaf: "#5a6a3e", stiffness: 0.6 }
      - { id: tussock, name: Tussock grass, form: tuft, height: [0.4, 1], crown: [0.5, 1], trunk: "#8a8250", leaf: "#a39a5e", stiffness: 0.2 }
      - { id: azores-heath, name: Azores heath, form: shrub, height: [2, 6], crown: [2, 4], trunk: "#5a4a3c", leaf: "#4a6a3a", stiffness: 0.6 }
      - { id: azores-juniper, name: Azores juniper, form: conifer, height: [2, 6], crown: [1.5, 3], trunk: "#5a4638", leaf: "#3e5a3a", stiffness: 0.7 }
    look: { near: [150, 100, 60], far: 2000 } # m
    wind: { leaves: 3, small: 5, large: 6, whole: 7 } # Beaufort's forces

  # Each island's scenic quality by the seven key factors of the US Bureau
  # of Land Management's Scenic Quality Field Inventory (Form 8400-1), each
  # in its range: landform 1–5, vegetation 1–5, water 0–5, colour 1–5,
  # adjacent scenery 0–5, scarcity 1–5 and cultural modifications to 2; a
  # total of a or more is class A, b or more class B, the rest class C, the
  # form's own classes (A 19 or more, B 12–18). What each factor reads of
  # the island: landform, from 1, its relief (its highest, m, adding
  # nothing at relief[0] and two at relief[1]), cliffs on that share of its
  # coast or more, twin summits, stacks, a cave, an arch, a crater, a cone
  # smoking;
  # vegetation by how many major types of plant cover a fiftieth of its
  # land or more (each form of tree one, shrubs one, grasses one); water the
  # best of a waterfall, a lagoon, a stream, a blowhole, the sea's white
  # water through an arch or into a cave; colour, from 1, each
  # surface over least of its land, and a lagoon's, sulphur's and guano's;
  # adjacent scenery, each island within within m and more for each with
  # features; scarcity, its rarest feature's kind ("very rare within
  # region") on at most rare other islands within region m (5), or few
  # (3), else 1, springs aside; cultural, a ruin, a lighthouse, a town.
  # Starting values, judged by the owner's eye.
  score:
    classes: { a: 19, b: 12 }
    landform: { relief: [10, 50], cliffs: 0.3, twin: 0.5, stacks: 0.5, cave: 1, arch: 1.5, crater: 1, fumarole: 1 }
    vegetation: [1, 3, 3, 4, 5]
    water: { waterfall: 5, lagoon: 3, stream: 3, blowhole: 3, arch: 3, cave: 3 }
    colour: { least: 0.05, each: 0.5, lagoon: 1, sulphur: 1, guano: 0.5 }
    adjacent: { within: 1000, island: 0.5, featured: 1 }
    scarcity: { rare: 1, few: 3, region: 3000 }
    cultural: { ruin: 2, light: 1, town: 1 }

  # The shared chart. A boat's lookout looks once every sight.every ticks,
  # the boats in turn by number: an island is sighted when any cell of its
  # land, trees and buildings is over the dome's horizon from the eye; a
  # place or a feature that stands high along its view, worked out on
  # sight.rays bearings, round its own island's land (a feature within
  # sight.features m); a cove, an anchorage or a lagoon seen into within
  # sight.water m; a reef, a bar or a sunk wreck within sight.awash m, by
  # the water breaking on it; a lighthouse at night by its light, within its
  # range and as the mist lets it. Every reach is no more than the mist
  # band's visual range at the eye and at the thing. Sights are filed in
  # squares of sight.grid m.
  #
  # What a discovery is worth: an island's size class's worth (sizes) times
  # its zone's and its scenery's class's, worth.zones and worth.classes; a
  # place's or a feature's its kind's. One worth worth.great or more is a
  # great discovery, told to everyone at sea.
  #
  # Each charted island's model on the chart: a grid of cells model.cell
  # hexagons a side, each its highest ground and its surface, drawn as
  # columns model.heights times as high as the land.
  #
  # The chart's look, after the period's charts: its paper and inks; a
  # parallel of latitude every look.parallels nautical miles and a meridian
  # every look.meridians degrees; drawn at most look.fps frames a second; its
  # wind as streaks from a grid of look.wind points a side.
  chart:
    sight: { every: 15, rays: 48, water: 300, awash: 150, features: 300, grid: 500 }
    worth: { zones: { centre: 1, middle: 1.5, rim: 2 }, classes: { a: 2, b: 1.5, c: 1 }, great: 20 }
    model: { cell: 4, heights: 6 }
    look:
      paper: "#ece0c2"
      ink: "#3b2e22"
      sea: "#d8d6c0"
      shallows: "#c9d3c4"
      mist: "#9aa3a4"
      light: "#a8236e"
      boat: "#c8952c"
      parallels: 1
      meridians: 30
      fps: 30
      wind: 64
