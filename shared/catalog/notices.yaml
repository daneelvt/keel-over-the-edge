# Notices and the news.
#
# A notice pops up for something the player would want to know now: one at a
# time, at most queue more waiting behind it, several of one kind folded into
# one. Each kind is passive, for the player's leisure, or active, for now
# (Apple's levels); it stays stays seconds unless dismissed, and the player
# may switch it off if switchable. Its words fill in {name}, the place's
# name; {who}, the sailor's; {where}, its zone's words; {worth}, what it is
# worth; {day}, the world's end in the player's own time; {left}, the time
# left; and, folded, {count}. A gale warning's fill in {wind}, the gale's
# direction and force ("southwesterly gale 8"), {when}, its time
# ("expected soon"), and {where}, the compass point from the nearest
# charted place ("south-west of Gannet Holm"): the Met Office's grammar.
# A sailor followed setting sail fills in {who}, and is told only once they
# may be watched: a human who sails without allowing it raises nothing.
# A harbour race about to start fills in {name}, the race's, and {boat},
# its boats ("Jolly boats"); a race the player entered, {name}; both
# {left}, the time to its start, at each time before it given. The
# harbour board and the race's card say the same, so neither is lost.
# Whatever a notice tells is in the news, on the chart, in the countdown or
# on the list of sailors to watch too, so one missed is never lost (WCAG 2.2, 2.2.1). The world's end is worked out on the phone from the end the
# Welcome gives and the world clock: each of its notices is shown once a
# world, the near end's at each time before it.
notices:
  queue: 3
  kinds:
    - id: own-charting
      name: Places you chart
      on: charted-own
      level: active
      switchable: true
      stays: 8
      text: You charted {name}
      folded: You charted {count} places
    - id: great-discoveries
      name: Great discoveries
      on: charted-great
      level: passive
      switchable: true
      stays: 5
      text: "{who} charted {name}, a great discovery {where}"
      folded: "{count} great discoveries charted"
    - id: closing-world
      name: The world's end
      on: falls-coming
      level: active
      switchable: true
      stays: 8
      text: The falls take this world on {day}
      folded: The falls take this world on {day}
    - id: ending-world
      name: The world's end near
      on: falls-soon
      before: [60, 10]
      level: active
      switchable: true
      stays: 8
      text: The falls take this world in {left}
      folded: The falls take this world in {left}
    - id: gale-warnings
      name: Gale warnings
      on: gale-warned
      level: active
      switchable: true
      stays: 8
      text: "Gale warning: {wind} {when}, {where}"
      folded: "Gale warning: {wind} {when}, {where}"
    - id: begun-world
      name: A new world
      on: new-world
      level: passive
      switchable: true
      stays: 5
      text: "A new world: Port Royal is charted, the rest is yours to find"
      folded: "A new world: Port Royal is charted, the rest is yours to find"
    - id: followed-sailing
      name: Sailors you follow
      on: followed-sailed
      level: passive
      switchable: true
      stays: 8
      text: "{who} has set sail"
      folded: "{count} sailors you follow have set sail"
    - id: harbour-races
      name: Harbour races
      on: harbour-race
      before: [10]
      level: passive
      switchable: true
      stays: 10
      text: "{name} off Port Royal in {left} · {boat}"
      folded: "{name} off Port Royal in {left} · {boat}"
    - id: races-entered
      name: Your races
      on: race-soon
      before: [5, 1]
      level: active
      switchable: false
      stays: 8
      text: "{name} starts in {left}"
      folded: "{name} starts in {left}"

# The news, a daily edition in the manner of the old shipping lists. What
# could be news is written as a candidate story with its kind's score; each
# day's edition (the day of the world's schedule) shows the best few, a
# story's score easing with its age through the day, never two about one
# sailor nor more than ofKind of one kind, and a sailor named in the recent
# editions giving way to one who was not, so everyone has a turn. Beneath
# them, a box of the reader's own: the day's stories about their shipmates,
# the sailors they follow and themselves that did not make the front page.
# Falls are counted in the day's figures only, never a story with a name,
# and the weather is never news. Starting values, tuned in play.
news:
  columns:
    - { id: discoveries, title: Discoveries, of: charting }
    - { id: mariners, title: Notices to Mariners, of: world }
  edition:
    stories: 6
    shipmates: 3
    ofKind: 2
    recent: 3
    giveWay: 0.5
    ease: 24
    falls: 100
    aboard: 4
    together: 30
    run: 1
    milestones: { distance: 1000, worlds: 10, places: 100 }
  stories:
    - { id: great-find, of: great, score: 10 }
    - { id: falls-record, of: record, score: 8 }
    - { id: rare-meeting, of: life, score: 6 }
    - { id: crew-in-company, of: crew, score: 5 }
    - { id: new-hands-find, of: first, score: 5 }
    - { id: longest-run, of: run, score: 4 }
    - { id: milestone, of: milestone, score: 4 }
    - { id: lesser-find, of: charting, score: 1 }
    - { id: new-course, of: course, score: 5 }
    - { id: race-won, of: race, score: 6 }
    - { id: trial-gold, of: trial, score: 3 }
