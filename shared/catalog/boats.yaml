# SPDX-License-Identifier: AGPL-3.0-only
# Boat types.
#
# Each boat sails as the modern boat it is built after: its physics values come
# from published measurements of that boat where they exist, and are marked as
# estimates where they do not. Estimates are tuned only by tools/polar's
# calibration, as docs/development.md describes.
boats:
  # The ILCA 7 (formerly the Laser, full rig) with an 80 kg, 1.83 m sailor:
  # the sailor with whom the tank data, the VPP and the measured speeds were
  # all taken. Sources:
  #   Day and Nixon (2014), Measurement and prediction of the resistance of a
  #     Laser sailing dinghy, Trans. RINA 156(B1): hull form and resistance.
  #   Day (2017), Performance prediction for sailing dinghies, Ocean
  #     Engineering: masses, centre of gravity, windage, sailor, foils.
  #   Offshore Racing Congress (2023), ORC VPP Documentation: the sail.
  #   ILCA class rules and sail data: rig dimensions.
  - id: jolly-boat
    name: Jolly boat
    description: Single-handed dinghy
    capacity: 1
    lengthOverall: 4.2
    beam: 1.39 # ILCA class
    art:
      model: boats/jolly-boat.glb
      far: boats/jolly-boat.far.glb
    physics:
      hull:
        displacement: 160 # boat with sail 80 kg, sailor 80 kg (Day)
        waterlineLength: 3.791 # Day and Nixon, Table 1, at 160 kg
        hullDraught: 0.094 # Day and Nixon, Table 1
        centreOfGravity: 0.30 # from Day's measured centre of gravity, sailor seated
        # Half a knot, in m/s.
        dragAreaStep: 0.2572222222222222
        # Day and Nixon, Figure 2 (level trim, 160 kg), read off the plot to
        # ±0.0002 m², every half knot from 2 to 9 knots. Below 2 knots, toward
        # an estimate at rest; above 9, falling on past the hump at 6.5 knots
        # to an estimated 0.0185 m² at 12 knots.
        dragArea: [0.0135, 0.01325, 0.0130, 0.01275,
          0.0125, 0.0126, 0.0132, 0.0144, 0.0157, 0.0177, 0.0207, 0.0229,
          0.0241, 0.0246, 0.0243, 0.0232, 0.0220, 0.0212, 0.0206,
          0.02025, 0.0199, 0.01955, 0.0192, 0.01885, 0.0185]
        crossFlowDrag: 1.0 # estimate: a flat-bottomed body moving sideways
        addedMassSurge: 8 # estimate: about 5% of the mass
        addedMassSway: 90 # estimate: the hull's slender-body added mass and the board's
        munk: 55 # estimate: the hull's own added masses, 60 kg less 5 kg
        yawInertia: 250 # estimate: hull, rig, sailor, added inertia
        rollInertia: 235 # estimate: the mast dominates; sailor hiking; board
        rollDamping: 60 # estimate: the hull's own; foils and sail damp through their flow
        # Estimate: superellipse sections fitted to Day and Nixon's hull form,
        # centre of gravity from Day's measurement. Every 10° from 0° to 180°.
        rightingLever: [0, 0.074, 0.117, 0.115, 0.062, -0.014, -0.10, -0.19, -0.27,
          -0.346, -0.41, -0.465, -0.505, -0.47, -0.40, -0.30, -0.20, -0.10, 0]
      rig:
        sailArea: 7.06 # ILCA 7
        luff: 5.13
        foot: 2.74
        boomHeight: 1.0 # estimate
        mastPosition: 0.95 # estimate, from the cockpit's position (Day)
        # The two strips' centres of effort, averaging ORC's 36.4% of the luff.
        footStrip: 0.15
        headStrip: 0.578
        pressureAttached: 0.33 # ORC: 33% of the foot aft of the mast
        pressureSeparated: 0.50
        effectiveHeight: 6.13 # the head's height above the water (ORC 2023, 5.34)
        quadraticDrag: 0.01379 # ORC 2023, Table 5.1
        # Fitted by tools/polar -sail to ORC's low-lift mainsail.
        maxLift: 1.48
        stallAngle: 28
        stallWidth: 20
        sailDrag: 0.026
        luffAngle: 3
        flogDrag: 0.05
        normalForce: [0, 0.5, 0.9, 1.07, 1.21, 1.31, 1.37, 1.39, 1.38, 1.35,
          1.28, 1.19, 1.07, 0.93, 0.77, 0.59, 0.40, 0.20, 0]
        twistPowered: 5 # estimate
        twistDepowered: 15 # estimate
        # Estimate: the ILCA's mainsheet holds the boom down as well as in; eased,
        # the boom rises against the vang and the leech opens.
        twistEased: 20 # fitted with the sail, below
        twistTurn: 3 # estimate
        # Estimates, tuned by tools/polar -manoeuvres so that an accidental gybe
        # comes 10° to 25° by the lee.
        headBacked: 90
        headBackedWidth: 20
        boomIn: 4 # estimate
        boomOut: 95 # estimate: an unstayed ILCA boom goes past 90° (Day)
        boomInertia: 12 # estimate: boom and sail about 6 kg, and the air the sail carries
        boomMoment: 6.6 # estimate: 6 kg, 1.1 m aft of the mast
        boomDamping: 5 # estimate
        # Day's method: sailor 0.51 m² from ahead and 0.31 m² from abeam,
        # topsides 0.30 and 0.93 m² with a mean freeboard of 0.27 m, mast in
        # its sleeve 0.05 m² from ahead.
        windageFront: 0.86
        windageSide: 1.24
        windageHeight: 0.7
        sailFloat: 1500 # estimate
        sailWaterDamping: 300 # estimate
      foils:
        boardSpan: 0.69 # 0.787 m below the waterline, less the hull's draught
        boardChord: 0.34
        boardPosition: 0.45 # estimate, tuned for weather helm
        rudderSpan: 0.60 # estimate
        rudderChord: 0.25 # estimate
        rudderPosition: 2.05 # estimate
        rudderAngle: 40 # estimate
        foilStall: 13 # estimate for thin sections at these Reynolds numbers
        foilStallWidth: 6 # estimate
        foilDrag: 0.010 # ITTC 1957 at Re ≈ 10⁶, both faces
        plateNormal: 1.2 # a flat plate
        pressureDepth: 0.43 # Keuning and Vermeulen (2003), via Day
        carryOver: 1.80 # Keuning and Verwerft (2009)
        heelLoss: 0.382 # Keuning and Verwerft (2009)
        rudderInflow: 0.9 # Day
        downwash: 0.5 # estimate: the rudder works in the board's downwash (Keuning, Vermeulen and de Ridder 2005)
        foilWetHeel: 60 # estimate
        foilDryHeel: 90 # estimate
      sailor:
        sailorMass: 80 # Day's baseline sailor
        sailorSeatHeight: 0.25 # estimate
        hikeReach: 0.956 # Day's bound: 0.95 × 0.55 × 1.83 m
        leeReach: 0.30 # estimate
        hikeSpeed: 1.5
        hikeLag: 0.35
        heelGain: 1.0
        rollRateGain: 0.6 # tuned: 0.3 let the boat death-roll running in 22 knots
        # Estimates, tuned against Day's upwind VMG above 9 knots. ORC's floor
        # is 0.6.
        flattenFrom: 6
        flattenTo: 11
        flattenMin: 0.62
        fallOutHeel: 70 # estimate
        climbInHeel: 30 # estimate
        boardReach: 0.99 # board span and 0.3 m
        sailorDrag: 600 # estimate
        swimTime: 10 # estimate
        climbTime: 4 # estimate
      rates:
        rudderTime: 0.25 # estimate
        sheetHaulTime: 2.5 # estimate
        sheetEaseTime: 1.0 # estimate
