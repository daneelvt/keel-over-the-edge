// SPDX-License-Identifier: AGPL-3.0-only

// The game connection's control messages. Each WebSocket binary message is
// one game message whose first byte is its kind (snapshot.txt): kind 1 is
// one of the envelopes below, encoded as Protocol Buffers; kind 2 is the
// packed snapshot, which is not described here.
//
// go run ./tools/protocol generates the Go and TypeScript from this file,
// and the protocol version from this file and snapshot.txt.
syntax = "proto3";

package keel.v1;

option go_package = "github.com/daneelvt/keel-over-the-edge/internal/protocol/pb";

// ClientMessage is everything a client sends, after the kind byte 1.
message ClientMessage {
  oneof body {
    Hello hello = 1;
    Input input = 2;
    Ping ping = 3;
    Command command = 4;
  }
}

// Hello is the first message on a connection. A client whose protocol,
// catalog or physics layout differs from the server's is closed with 4002.
message Hello {
  // The protocol version: a hash of the schema and the snapshot's layout.
  string protocol = 1;
  // The catalog version the client was built with.
  string catalog = 2;
  // The physics module's layout version.
  uint32 physics_layout = 3;
  // The client's build, for the log only.
  string build = 4;
  // A sailor's name, to watch their boat rather than sail: empty to sail.
  // Watching is as Command.watch asks it, the connection's first.
  string watch = 5;
  // A race's boat to watch rather than sail, as Command.watch asks it by
  // its race: for the connection's first watch when watch is empty.
  Watch race_watch = 6;
}

// Input is the controls the client steps its boat with, stamped with the
// tick it predicted them for; or, with ack_only, just an acknowledgement.
message Input {
  // The low 32 bits of the tick the controls are for.
  uint32 seq = 1;
  // The helm, 0 (hard to port) to 1024 (hard to starboard).
  uint32 helm = 2;
  // The sheet, 0 (hauled in) to 1024 (let fly).
  uint32 sheet = 3;
  // The tick of the newest snapshot the client has decoded; 0 for none.
  int64 ack_tick = 4;
  // No control change: the message only acknowledges.
  bool ack_only = 5;
  // The autopilot: 0 off, 1 holding an angle off the wind, 2 a compass
  // heading. While it is on it steers, and helm is not used.
  uint32 pilot = 6;
  // What it holds, in 65536ths of a turn: the angle off the wind, positive
  // with the wind over starboard (from 32768 on, the angle less a whole
  // turn), or the heading clockwise from north.
  uint32 target = 7;
  // The order count, 0 to 3: a count the boat has not taken is a new order,
  // a tack or a gybe, applied at the input's tick as the helm is.
  uint32 order = 8;
  // The way of the latest order: 0 hold, 1 tack, 2 gybe.
  uint32 way = 9;
  // The reef the crew is to take: 0 full sail, 1 or 2 reefs. A target the
  // crew works to over the rig's reef time, applied at the input's tick as
  // the helm is.
  uint32 reef = 10;
}

// Ping asks for the server's world time, for the client's clock.
message Ping {
  // The client's own clock, in microseconds; returned in the Pong.
  int64 client_time_us = 1;
  // The tick of the newest snapshot the client has decoded; 0 for none.
  int64 ack_tick = 2;
  // The client's estimate of the round trip, in milliseconds.
  uint32 rtt_ms = 3;
  // The 95th percentile of the client's frame time, in milliseconds.
  uint32 frame_ms = 4;
  // How much the client draws: 1 the low tier, 2 medium, 3 high; 0 unknown.
  uint32 tier = 5;
  // The pixel ratio the client draws at, in hundredths; 0 unknown.
  uint32 render_scale = 6;
}

// Command is something the player asks of the game.
message Command {
  oneof body {
    Resync resync = 1;
    Roam roam = 2;
    Watch watch = 3;
    Sail sail = 4;
    Unwatch unwatch = 5;
    Knock knock = 6;
    Answer answer = 7;
    Hand hand = 8;
    Take take = 9;
    GiveBack give_back = 10;
    GoAshore ashore = 11;
    CloseKnocks close_knocks = 12;
    Say say = 13;
    Mute mute = 14;
    Block block = 15;
    Report report = 16;
    ComeAboard come_aboard = 17;
    RaceRetire race_retire = 18;
    Cheer cheer = 19;
  }
}

// RaceRetire retires the connection's boat from the race it sails in, at
// its skipper's word. The race's next messages say so (RaceCall retired).
message RaceRetire {}

// Cheer cheers the boat the connection watches in a race: one gesture, no
// words. At most one every ten seconds counts, from the warning signal
// until the race ends; the cheers come back gathered (RaceCheered).
message Cheer {}

// ComeAboard brings an owner watching their own machine sailor aboard its
// boat, as crew, without knocking: the boat is theirs. It is told how it
// stands as a knock is (Knocking): let aboard, a Welcome to the boat
// follows and the watch ends; or why not (the boat full, boarding off, the
// age question or the Rules of the sea first, the machine sailor not its
// boat's skipper).
message ComeAboard {}

// Say says a line to everyone aboard the boat the connection sails or is
// aboard, or, with to, a message to one shipmate wherever they are in the
// game: at most 200 characters, one line, text only. The server checks
// it, and the sender is sent the line back as it was said (Chat, with
// echo), or why it was not (Chat.refused). A line refused for a word
// comes back as said and reaches nobody. A message reaches a shipmate
// only while they are in the game; it is never kept for later.
message Say {
  string text = 1;
  // The client's own number for the line, which its Chat echoes.
  uint32 id = 2;
  // A shipmate's account, as the shipmates list names it (its ID in UUID
  // text); "" to say it aboard.
  string to = 3;
}

// Who is someone aboard, for mute, block and report: by their seat on the
// boat the connection sails or is aboard, or by a line of theirs the
// connection was sent (its Chat.id), which the server still holds.
message Who {
  oneof who {
    uint32 seat = 1;
    uint64 line = 2;
  }
}

// Mute hides one player's lines from the connection's account, everywhere,
// or shows them again; they are not told.
message Mute {
  Who who = 1;
  bool on = 2;
}

// Block hides each one's lines from the other, everywhere, refuses their
// knocks both ways and their watch of the account's sailor, and puts them
// ashore from the account's boat; or ends the block. They are not told.
message Block {
  Who who = 1;
  bool on = 2;
}

// Report reports a player, from a line of theirs or from their name
// aboard: the server keeps what it still holds of the boat's chat with
// the report, for the game's owner. The reporter is told it was received
// (Reported); the reported is never told who.
message Report {
  Who who = 1;
  ReportReason reason = 2;
  // Seen only by the game's owner: at most 200 characters.
  string note = 3;
}

// ReportReason is why a player is reported.
enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  // A child may be at risk: ahead of every other report.
  REPORT_REASON_CHILD = 1;
  REPORT_REASON_SEXUAL = 2;
  REPORT_REASON_BULLYING = 3;
  REPORT_REASON_HATE = 4;
  // Threats or self-harm.
  REPORT_REASON_THREATS = 5;
  // Scams or spam.
  REPORT_REASON_SCAM = 6;
  REPORT_REASON_CHEATING = 7;
  REPORT_REASON_OTHER = 8;
}

// Knock asks to come aboard another sailor's boat, by the token of the
// link its skipper shared (the last part of /sail/<token>). The skipper is
// shown a card and answers it; the knocker is told how it stands
// (Knocking), and once let aboard is welcomed to the boat as its crew
// (Welcome.aboard): a boat it sails leaves the water then, at once, and a
// watch ends. A connection knocks on one boat at a time: a second knock
// withdraws the first.
message Knock {
  string token = 1;
  // The name of one of the account's machine sailors, to send it aboard
  // rather than come aboard oneself: the link must be a machine sailor's,
  // the machine sailor sent in the water, and the knock is answered by
  // the skipper machine sailor's owner, wherever they are in the game,
  // never by its agent. Let aboard, the machine sailor's own boat leaves
  // the water and it is crew there; the connection is told as a knocker
  // is.
  string machine = 2;
  // A shipmate's account, as the shipmates list names it, to knock on the
  // boat they skipper without a link: token is then empty. Their skipper's
  // answer is asked as for any knock.
  string shipmate = 3;
}

// Answer is the skipper's answer to a knock: let them aboard, or not now.
// Only the boat's skipper answers its knocks, never whoever holds the
// controls.
message Answer {
  // The knock's ID, as its KnockCard has it.
  uint64 knock = 1;
  bool let = 2;
}

// Hand offers the boat's controls, all of them, to someone aboard, by
// their seat (Crew): from whoever holds them. The receiver is told
// (Handed) and has 15 seconds to take them; until then the controls stay
// where they are.
message Hand {
  uint32 to = 1;
}

// Take takes the controls offered to the connection; from the boat's
// skipper, it takes them back at once, from whoever holds them, offered or
// not.
message Take {}

// GiveBack hands the controls back to the skipper at once, from whoever
// holds them.
message GiveBack {}

// GoAshore leaves the boat the connection is aboard, its own boat put in
// the water at the nearest port; or, from the skipper, puts the crew
// member in seat who ashore. A skipper cannot go ashore from their own
// boat: they leave the water.
message GoAshore {
  // The seat of the crew member the skipper puts ashore; 0 to go ashore
  // oneself.
  uint32 who = 1;
}

// CloseKnocks closes the skipper's boat to knocks, or opens it again, for
// this voyage: closed, every knock is refused quietly, as "not taking
// crew".
message CloseKnocks {
  bool closed = 1;
}

// Watch asks to watch another sailor's boat from that boat's own place: a
// spectator, holding no boat. A race's boat is asked for by its race (the
// race's number in the world, or its link's code) and its race number, 0
// for the boat the game chooses: the one at the front of the closest
// battle, or before the start the first entered; its Welcome names its
// sailor as the reader may be told them ("" for one not named). A boat the connection sails leaves the water
// at once, with no grace; a place in the queue for one is kept, and the
// watch ends when the queue gives the boat. The watch begins with a
// Welcome whose watching names the sailor, its snapshots the watched
// boat's; or, refused, a WatchEnded, the connection sailing, waiting or
// idle as it was. While the spectators are as many as may watch, a Queued
// with spectators set comes first. At most one a second is honoured.
message Watch {
  // The sailor's name, as players see it: case and look-alikes do not
  // matter.
  string sailor = 1;
  // A race's boat instead: its race by number, or by its link's code, and
  // its race number.
  uint32 race = 2;
  string code = 3;
  uint32 number = 4;
}

// Sail asks for a boat, as a connection that opens to sail does: a new one
// at the start, or a place in the queue, while the watch, if any, goes on.
// A connection that sails or waits already is answered nothing.
message Sail {}

// Unwatch ends the watch: the connection is idle, sent no snapshots, until
// it watches again or sails.
message Unwatch {}

// Resync asks for the next snapshot in full: the client lacks the base of
// one it received. At most one a second is honoured.
message Resync {}

// Roam is the owner's free camera, from an account that carries the
// owner's flag (Welcome.tools); from any other it is ignored. While it is
// on, the connection's eye is the camera's point: the other boats, the sea
// areas and the land's chunks it is sent are those about the eye, not
// about the boat, which stays where it is, not stepped, until the camera
// is off or the connection ends. Sent as the camera leaves the boat, as it
// moves, at most five a second and once it has moved 20 m, and as it comes
// back. The eye is clamped to the whole disk and 500 m beyond its lip,
// from 2 m to 500 m above the sea.
message Roam {
  // The camera is off the boat.
  bool on = 1;
  // The point under the camera, in centimetres east and north of the
  // world's centre, and its height above the sea, in centimetres.
  sint32 east = 2;
  sint32 north = 3;
  uint32 height = 4;
}

// ServerMessage is everything the server sends but snapshots, after the
// kind byte 1.
message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Pong pong = 2;
    Queued queued = 3;
    Restart restart = 4;
    SeaAreas sea_areas = 5;
    WeatherSystems weather_systems = 6;
    Bump bump = 7;
    Chunks chunks = 8;
    Tools tools = 9;
    Places places = 10;
    Lights lights = 11;
    Chart chart = 12;
    Charted charted = 13;
    IslandCaps island_caps = 14;
    Forecast forecast = 15;
    WatchEnded watch_ended = 16;
    Watchers watchers = 17;
    AgentLamp agent_lamp = 18;
    LookChanged look_changed = 19;
    BoatLookChanged boat_look_changed = 20;
    BoatNames boat_names = 21;
    Life life = 22;
    KnockCard knock = 23;
    Knocking knocking = 24;
    Crew crew = 25;
    Handed handed = 26;
    Ashore ashore = 27;
    Chat chat = 28;
    ChatState chat_state = 29;
    Tied tied = 30;
    Reported reported = 31;
    Shipmates shipmates = 32;
    Crews crews = 33;
    RaceTold race_told = 34;
    RacePicture race_picture = 35;
    RaceSignal race_signal = 36;
    RaceCall race_call = 37;
    RaceFinish race_finish = 38;
    RaceResults race_results = 39;
    RaceCheered race_cheered = 40;
    BoatPrizes boat_prizes = 41;
  }
}

// RaceTold tells a race under way: to its boats and those watching them,
// and to every connection near enough to see its course, once as it is
// first seen and again when its names are known (the latest replaces what
// was told). race is the race's number in the world, by which every race
// message names it; code its link's; name its name, as its owner gave it;
// boat the boats' kind, an index into the catalog's; trial a time trial's
// run, of number run. warning and start are its ticks (a trial's start 0
// until its boat crosses the line). Its course: the start line, the pin's
// end then the committee boat's, and the finish line, each two points of
// metres east and north; its marks laid; the way sailed from the start
// line's middle to the finish's, as metres east and north one after the
// other; its legs, the points of the way a boat makes for in turn (a
// boat's leg in RacePicture is one of them); where it lies and how far it
// reaches, m; its laps and its expected time, s. Its entrants, by number:
// each one's name as the reader may be told it ("" for one not named:
// show their boat's name and number), their boat's name, and whether a
// machine sailor's, or the reader's own. gone: the race is over and its
// course taken up.
message RaceTold {
  uint32 race = 1;
  string code = 2;
  string name = 3;
  uint32 boat = 4;
  bool trial = 5;
  uint32 run = 6;
  int64 warning = 7;
  int64 start = 8;
  repeated sint32 line = 9;
  repeated sint32 finish = 10;
  repeated RaceMark marks = 11;
  repeated sint32 way = 12;
  repeated RaceLeg legs = 13;
  sint32 east = 14;
  sint32 north = 15;
  uint32 reach = 16;
  uint32 laps = 17;
  float expected = 18;
  repeated RaceEntrant entrants = 19;
  bool gone = 20;
}

// RaceMark is a mark laid: where, its number, and the side it is left to:
// 1 starboard, −1 port, 0 a gate's buoy.
message RaceMark {
  sint32 east = 1;
  sint32 north = 2;
  uint32 number = 3;
  sint32 side = 4;
}

// RaceLeg is a point of a race's way a boat makes for: the mark it rounds
// there (0 for the start or the finish line), and the point, m.
message RaceLeg {
  uint32 mark = 1;
  sint32 east = 2;
  sint32 north = 3;
}

// RaceEntrant is a boat in a race, by its race number.
message RaceEntrant {
  uint32 number = 1;
  string name = 2;
  string boat = 3;
  bool machine = 4;
  bool me = 5;
}

// RacePicture is a race as it stands, every two seconds, to its boats and
// those watching them: every boat, wherever it is.
message RacePicture {
  uint32 race = 1;
  int64 tick = 2;
  repeated RacerAt racers = 3;
  // The race number of the boat the connection sails, is aboard or
  // watches; 0 for none.
  uint32 eye = 4;
}

// RaceCheered is the crowd's cheers for a boat in a race, gathered every
// two seconds, to the boat's racers and those watching it: never who.
// count is the cheers since the last, crowd how many have cheered it
// within the last ten seconds, and mine whether the connection's own
// cheer is among count.
message RaceCheered {
  uint32 race = 1;
  uint32 number = 2;
  uint32 count = 3;
  uint32 crowd = 4;
  bool mine = 5;
}

// RacerAt is a boat in a race: its number; where it is, m east and north,
// and its heading, degrees; its place as it stands; its gap to the boat
// first, tenths of a second (as near as the way to go says, for those
// still racing); the seconds added; its state; its leg, the index of the
// RaceTold's leg it makes for; its way to go, m; its cheers.
message RacerAt {
  uint32 number = 1;
  sint32 east = 2;
  sint32 north = 3;
  uint32 heading = 4;
  uint32 place = 5;
  uint32 gap = 6;
  uint32 added = 7;
  RacerState state = 8;
  uint32 leg = 9;
  uint32 to_go = 10;
  uint32 cheers = 11;
}

// RacerState is how a boat stands in its race.
enum RacerState {
  RACER_STATE_UNSPECIFIED = 0;
  // Did not start: not at sea as the boats were placed.
  RACER_STATE_DNS = 1;
  // On the line, before the start or a trial's crossing.
  RACER_STATE_PLACED = 2;
  RACER_STATE_RACING = 3;
  RACER_STATE_FINISHED = 4;
  RACER_STATE_RETIRED = 5;
  // Still racing as the race ended: placed by its progress.
  RACER_STATE_PLACED_AT_END = 6;
}

// RaceSignal is a signal from the committee boat: the flags it hoists and
// whether its gun fires. A finish is boat number's, in place.
message RaceSignal {
  uint32 race = 1;
  RaceSignalKind signal = 2;
  bool gun = 3;
  uint32 number = 4;
  uint32 place = 5;
}

// RaceSignalKind is a signal of the start's sequence, or a finish's gun.
enum RaceSignalKind {
  RACE_SIGNAL_KIND_UNSPECIFIED = 0;
  // The class's pennant up, two minutes before the start.
  RACE_SIGNAL_KIND_WARNING = 1;
  // P up, a minute before the start: from here bumps are called.
  RACE_SIGNAL_KIND_PREPARATORY = 2;
  // Both down: the start.
  RACE_SIGNAL_KIND_START = 3;
  // X up: a boat over early.
  RACE_SIGNAL_KIND_RECALL = 4;
  // A boat finished: the winner's gun the loudest.
  RACE_SIGNAL_KIND_FINISH = 5;
}

// RaceCall is something the committee saw: a bump with boat number at
// fault, other the boat it bumped, by article, added seconds; a boat over
// early; a mark missed, mark; a boat asked whether it still races; a boat
// retired; a mark rounded, mark, in place.
message RaceCall {
  uint32 race = 1;
  RaceCallKind kind = 2;
  uint32 number = 3;
  uint32 other = 4;
  string article = 5;
  uint32 mark = 6;
  uint32 added = 7;
  uint32 place = 8;
}

// RaceCallKind is what a RaceCall tells.
enum RaceCallKind {
  RACE_CALL_KIND_UNSPECIFIED = 0;
  RACE_CALL_KIND_BUMP = 1;
  RACE_CALL_KIND_OVER_EARLY = 2;
  RACE_CALL_KIND_MISSED_MARK = 3;
  RACE_CALL_KIND_DRIFTING = 4;
  RACE_CALL_KIND_RETIRED = 5;
  RACE_CALL_KIND_ROUNDED = 6;
}

// RaceFinish is a boat home: its place as it stands, its time from the
// start, ms, and the seconds added.
message RaceFinish {
  uint32 race = 1;
  uint32 number = 2;
  uint32 place = 3;
  uint32 elapsed_ms = 4;
  uint32 added = 5;
}

// RaceResults are a race's results as it ends: every boat, and whether
// its prizes are given (three boats of three accounts).
message RaceResults {
  uint32 race = 1;
  string code = 2;
  bool prizes = 3;
  repeated RaceResult results = 4;
}

// RaceResult is what a boat came to: its place (0 none), how it ended
// (finished, placed, dns, ret), its time, ms (0 not home), the seconds
// added, the marks rounded, its way still to go, m, its medal (a trial's)
// and its awards.
message RaceResult {
  uint32 number = 1;
  uint32 place = 2;
  string how = 3;
  uint32 elapsed_ms = 4;
  uint32 added = 5;
  uint32 marks = 6;
  uint32 to_go = 7;
  string medal = 8;
  repeated string awards = 9;
}

// Shipmates says the account's shipmates have changed: an offer made to
// it, an offer accepted, or a shipmate no longer one. Never what changed
// or why: the shipmates list is read again over HTTP.
message Shipmates {}

// KnockCard tells a skipper that a sailor asks to come aboard, for them to
// answer (Answer) within two minutes; with gone, the knock is no longer
// waiting: answered, lapsed or withdrawn. Never an age.
message KnockCard {
  uint64 id = 1;
  // The sailor's name and look, as players see them.
  string sailor = 2;
  uint32 look = 3;
  bool gone = 4;
  // A machine sailor sent aboard by its owner, named owner (their sailor's
  // name), knocking on the boat of skipper, the connection's own machine
  // sailor: the card goes to that machine sailor's owner wherever they are
  // in the game.
  bool machine = 5;
  string owner = 6;
  string skipper = 7;
  // A shipmate of the skipper's, knocking from their shipmates list.
  bool shipmate = 8;
}

// Knocking tells a knocker how their knock stands. Let aboard, a Welcome
// to the boat follows.
message Knocking {
  KnockState state = 1;
  // The skipper's name, their boat's kind (an index into the catalog's
  // boats) and its name, player text: what the knock is for.
  string skipper = 2;
  uint32 kind = 3;
  string boat = 4;
  // The machine sailor the knock sends aboard, "" for the knocker's own.
  string machine = 5;
}

// KnockState is how a knock stands, or why it was refused. A refusal never
// says that a block refused it.
enum KnockState {
  KNOCK_STATE_UNSPECIFIED = 0;
  // The skipper has the card.
  KNOCK_STATE_WAITING = 1;
  // Let aboard: a Welcome follows.
  KNOCK_STATE_LET = 2;
  // The skipper said not now.
  KNOCK_STATE_NOT_NOW = 3;
  // The skipper did not answer within two minutes.
  KNOCK_STATE_LAPSED = 4;
  // The link has expired, or was ended, or links are off.
  KNOCK_STATE_ENDED = 5;
  // The skipper's boat is not in the water.
  KNOCK_STATE_NOT_AT_SEA = 6;
  // The boat has no room aboard.
  KNOCK_STATE_FULL = 7;
  // The boat is not taking crew.
  KNOCK_STATE_CLOSED = 8;
  // The skipper has knocks waiting: try again soon.
  KNOCK_STATE_BUSY = 9;
  // Too many knocks in the last hour, or on this boat again too soon.
  KNOCK_STATE_OFTEN = 10;
  // Too many people are aboard boats across the sea.
  KNOCK_STATE_CROWDED = 11;
  // The link is the connection's own.
  KNOCK_STATE_OWN = 12;
  // The age question or the Rules of the sea must be answered first.
  KNOCK_STATE_FIRST = 13;
  // The game could not look the link up in time: try again.
  KNOCK_STATE_TRY_AGAIN = 14;
  // Withdrawn by a knock on another boat, or the knocker went elsewhere.
  KNOCK_STATE_WITHDRAWN = 15;
  // The machine sailor sent aboard is not in the water: its AI app sails
  // it there first.
  KNOCK_STATE_AWAY = 16;
}

// Crew is who is aboard the boat the connection sails, is aboard or
// watches, and who holds its controls: sent as it changes, and once at
// each Welcome to a boat with anyone aboard but its skipper. Names only to
// those aboard. In Crews, it is another boat's, by its view slot.
message Crew {
  // Everyone aboard, the skipper first, in seat order.
  repeated Person people = 1;
  // The seat of whoever holds the controls.
  uint32 holder = 2;
  // In Crews: the view slot of the boat it is for, the boat that slot
  // holds as of the next snapshot. Unused in a Crew sent alone.
  uint32 slot = 3;
}

// Crews are who is aboard the other boats in the connection's near band
// with anyone aboard besides their skipper, so that their crews are drawn:
// each boat's sent as it comes into the band, and again when who is aboard
// or who holds its controls changes; and with nobody (no people) when it
// leaves the band, everyone but its skipper goes ashore, or its slot holds
// another boat. Each person carries their seat, look and machine mark
// only: never a name, nor anything of the connection's own.
message Crews {
  repeated Crew crews = 1;
}

// Person is someone aboard: their seat, the station on deck they stand at
// (the skipper's, 0, is the helm's), and their look; whoever holds the
// controls stands at the helm, and the skipper at the holder's station.
message Person {
  uint32 seat = 1;
  uint32 look = 2;
  // As players see it; "" for a spectator.
  string name = 3;
  // A machine sailor, sailed by an AI agent.
  bool machine = 4;
  // The connection's own.
  bool you = 5;
  // The connection's account mutes them, or blocks them.
  bool muted = 6;
  bool blocked = 7;
  // A shipmate of the connection's account.
  bool shipmate = 8;
  // They wear the winner's cockade, for a race won in the world.
  bool cockade = 9;
}

// Chat is a line said aboard the boat the connection sails, is aboard,
// or (its owner's machine sailor aboard it) watches: player text, from the
// person in seat. To its sender it comes back with echo, said or refused.
message Chat {
  // The line's number, for mute, block and report (Who.line).
  uint64 id = 1;
  uint32 seat = 2;
  // The sender's name as players see it, and whether a machine sailor
  // said it.
  string name = 3;
  bool machine = 4;
  // When it was said, µs of UTC.
  int64 at_us = 5;
  string text = 6;
  // The connection's own line, its Say's id; refused, it reached nobody.
  bool you = 7;
  uint32 echo = 8;
  ChatRefusal refused = 9;
  // A message between shipmates, not a line aboard: the other shipmate's
  // account, as the shipmates list names it (to its sender, whom it was
  // to; to its receiver, who sent it). Seat is then 0.
  string thread = 10;
}

// ChatRefusal is why a line was not said. A line refused for a word is
// never told so: it comes back as said.
enum ChatRefusal {
  CHAT_REFUSAL_UNSPECIFIED = 0;
  // A link or a contact detail: those can't be sent aboard.
  CHAT_REFUSAL_CONTACT = 1;
  // Longer than 200 characters, or empty.
  CHAT_REFUSAL_LONG = 2;
  // Too many lines too fast.
  CHAT_REFUSAL_FAST = 3;
  // The sender may say nothing now (ChatState says why).
  CHAT_REFUSAL_SILENT = 4;
  // Nobody is aboard to hear it.
  CHAT_REFUSAL_NOBODY = 5;
  // The shipmate isn't in the game: messages aren't kept for later.
  CHAT_REFUSAL_AWAY = 6;
  // The game's owner has shipmates' messages off for everyone.
  CHAT_REFUSAL_RESTING = 7;
}

// ChatState is whether the connection may chat aboard now, sent at each
// Welcome and as it changes.
message ChatState {
  ChatStatus status = 1;
  // Until when it rests, µs of UTC; 0 for until the game's owner looks.
  int64 until_us = 2;
  // The Rules of the sea are to be accepted before a first line.
  bool rules = 3;
}

// ChatStatus is how chat stands for a connection.
enum ChatStatus {
  CHAT_STATUS_UNSPECIFIED = 0;
  // Lines go and come.
  CHAT_STATUS_ON = 1;
  // The game's owner has chat off, for everyone or where the player is:
  // "Chat is resting".
  CHAT_STATUS_OFF = 2;
  // The player's own chat is off (a player of 13 to 17 until they turn it
  // on).
  CHAT_STATUS_OWN_OFF = 3;
  // The player's chat rests: too many lines refused, a report, or the
  // game's owner.
  CHAT_STATUS_RESTING = 4;
}

// Tied says a mute or a block is in force, or ended, for the person named.
message Tied {
  string name = 1;
  bool muted = 2;
  bool blocked = 3;
  // The account has as many as it may keep: nothing changed.
  bool full = 4;
}

// Reported says a report was received, or (ok false) could not be kept:
// try again.
message Reported {
  bool ok = 1;
}

// Handed offers the connection the boat's controls, from whoever holds
// them: a Take within the seconds given takes them. With gone, the offer
// has lapsed or been withdrawn.
message Handed {
  string from = 1;
  uint32 seconds = 2;
  bool gone = 3;
}

// Ashore says the connection has left the boat it was aboard, and why: a
// Welcome to its own boat follows, at the nearest port, or a Queued.
message Ashore {
  AshoreWhy why = 1;
}

// AshoreWhy is why someone left a boat they were aboard.
enum AshoreWhy {
  ASHORE_WHY_UNSPECIFIED = 0;
  // They chose to go ashore.
  ASHORE_WHY_CHOSE = 1;
  // The skipper put them ashore.
  ASHORE_WHY_PUT = 2;
  // The skipper's boat left the water.
  ASHORE_WHY_LEFT = 3;
}

// WatchEnded says a watch has ended, or was refused: the connection is
// idle, sent no snapshots, unless it sails or waits for a boat. A refusal
// never tells whether a human sailor who does not allow spectators is at
// sea.
message WatchEnded {
  WatchEnd why = 1;
  // The sailor's name: as the game has it, or as it was asked for when
  // there is no such sailor.
  string sailor = 2;
}

// WatchEnd is why a watch ended or was refused.
enum WatchEnd {
  WATCH_END_UNSPECIFIED = 0;
  // The boat has left the water.
  WATCH_END_LEFT = 1;
  // The sailor no longer allows spectators.
  WATCH_END_OFF = 2;
  // The sailor cannot be watched now: a human not at sea or not allowing
  // spectators, or a boat kept out of sight.
  WATCH_END_CANNOT = 3;
  // A machine sailor not at sea.
  WATCH_END_NOT_AT_SEA = 4;
  // No sailor of that name.
  WATCH_END_NO_SAILOR = 5;
  // The connection's own boat.
  WATCH_END_OWN = 6;
  // Asked again within a second: not honoured.
  WATCH_END_QUICK = 7;
  // The game could not look the sailor up in time: try again.
  WATCH_END_BUSY = 8;
  // The connection is aboard a boat: it goes ashore first.
  WATCH_END_ABOARD = 9;
  // No such race on the water: not yet at its warning signal, or over; or
  // no such boat in it.
  WATCH_END_NO_RACE = 10;
}

// Watchers says how many watch the connection's boat, as it changes, at
// most every two seconds; never who.
message Watchers {
  uint32 count = 1;
}

// LookChanged says the sailor of the boat the connection sails or watches
// changed their look, at Port Royal: as of the next snapshot, the boat is
// drawn in it. Other connections see it as an enter of the boat.
message LookChanged {
  // The sailor's look: a look code, as an enter in a snapshot has it.
  uint32 look = 1;
}

// BoatLookChanged says the boat the connection sails or watches was given
// a new look in port, its paint, cloth, sail number or name: as of the
// next snapshot, it is drawn so. Other connections see it as an enter of
// the boat, and its name in BoatNames. A boat swapped for another kind
// comes as a Welcome instead.
message BoatLookChanged {
  // The boat's look: a boat look code, as an enter in a snapshot has it.
  uint32 look = 1;
  // The boat's name, player text; "" for none.
  string name = 2;
}

// BoatNames are the names of boats in the connection's view, each sent once
// as the boat comes into the near band, and again if it changes: player
// text, drawn on the boat's topsides or transom. A boat with no name is
// sent "" only to clear a name the slot was told before.
message BoatNames {
  repeated BoatName names = 1;
}

// BoatName is a boat's name by its view slot: the boat that slot holds as
// of the next snapshot.
message BoatName {
  uint32 slot = 1;
  string name = 2;
}

// BoatPrizes are what boats fly for their skippers' races in the world:
// of the boats in the connection's view, each as it comes into the view
// and again when it changes, and of the boat the connection sails or
// watches (own) as a Welcome begins it and when it changes. A Welcome
// clears what the view's slots were told.
message BoatPrizes {
  repeated BoatPrize prizes = 1;
}

// BoatPrize is a boat's prizes: by its view slot as of the next snapshot,
// or the connection's own boat. prizes is a prize code, from the low bits:
// how many winner's pennants it flies (3 bits, 0 … 5), each one's colour,
// a place in the races' colours, the newest win's first (five fields of 3
// bits), its burgee (2 bits: 0 none, 1 the racing burgee, 2 the gilded
// one), how many wooden spoons hang from its stern (2 bits, 0 … 3) and the
// committee's flag (1 bit); its skipper wears the winner's cockade while
// it flies a pennant. number is its race number while it races, from its
// placing on the line until its race is over; 0 for none.
message BoatPrize {
  uint32 slot = 1;
  bool own = 2;
  uint32 prizes = 3;
  uint32 number = 4;
}

// AgentLamp says whether the AI agent of the machine sailor a connection
// watches is attending to it, as that changes: sent only to a connection
// watching a machine sailor of its own account, never to the sailor, to
// other spectators or in an agent's report. An agent that speaks over HTTP
// holds nothing open, so attending is read from its calls: a wait under
// way, or a call within the last minute.
message AgentLamp {
  Lamp state = 1;
}

// Lamp is the agent's attention to its boat.
enum Lamp {
  LAMP_UNSPECIFIED = 0;
  // A wait is under way, or a call came within the last minute.
  LAMP_AT_HELM = 1;
  // No call for a minute, and no wait.
  LAMP_QUIET = 2;
}

// Forecast is the forecast, issued at each boundary of ten minutes of world
// time from the world's epoch for the next ninety, in steps of ten: sent to
// every connection as it is issued, and after the Welcome with its past.
// It is the truth: the records of every system alive at the issue or born
// within its horizon and one issue more, from which a client makes the
// server's keyframes of any tick it knows, bit for bit; the spells as they
// will blow, without their shifts; and the gale warning in force.
message Forecast {
  // The tick it was issued at; how many steps it has, the issue's own
  // first, fewer as the world's end nears; and the ticks between them.
  int64 issue = 1;
  uint32 steps = 2;
  uint32 step = 3;
  // The spells over its reach, by the tick each begins at, ascending, the
  // shifts not placed; and each one's shifts' swing either way, in
  // 65536ths of a turn.
  repeated Spell spells = 4;
  repeated uint32 shifts = 5;
  // Its systems' records, in the order of their births.
  repeated ForecastSystem systems = 6;
  // The gale warning in force, if any.
  GaleWarning gale = 7;
  // After the Welcome, what has been: the issue of ninety minutes before
  // and the truth since.
  ForecastPast past = 8;
  // The last tick it knows the systems to; how many ticks apart the
  // systems' keyframes are; and the tick its records' tick 0 falls on.
  int64 until = 9;
  uint32 every = 10;
  int64 origin = 11;
}

// ForecastSystem is a system of the forecast: its slot, as its keyframes',
// and its record, from which its keyframe at any tick is made.
message ForecastSystem {
  reserved 7 to 15;
  reserved "forming", "crosses", "cross_east", "cross_north", "strength";
  // Its slot; the catalog's index of its kind; its seed; its radius, m, a
  // line's half its depth; its peak and its depth, as a keyframe's.
  uint32 slot = 1;
  uint32 kind = 2;
  uint32 seed = 3;
  uint32 size = 4;
  uint32 peak = 5;
  sint32 depth = 6;
  // The ticks it is born at, has grown to its whole by, begins to decay
  // at and is gone at, in its records' time.
  int64 born = 16;
  int64 mature = 17;
  int64 decays = 18;
  int64 gone = 19;
  // Its track: 0 a straight line, 1 an arc round the centre.
  uint32 track = 20;
  // A line: where it is at its birth, in quarter metres east and north of
  // the world's centre, and the direction it moves toward, in 65536ths of
  // a turn.
  sint32 east = 21;
  sint32 north = 22;
  uint32 heading = 23;
  // How fast it moves along its track, in steps of 0.01 m/s.
  uint32 speed = 24;
  // An arc: its distance from the centre at its birth, in quarter metres;
  // its bearing from the centre then, in 65536ths of a turn; which way it
  // goes round, 1 clockwise and −1 the other way; and how fast it closes
  // on the centre, in steps of 0.01 m/s.
  uint32 radius = 25;
  uint32 angle = 26;
  sint32 sense = 27;
  uint32 inward = 28;
  // A line's length across its motion, m.
  uint32 length = 29;
  // Its wobble off its track: how far, in quarter metres, and each way's
  // period in ticks and phase at tick 0 in 65536ths of a turn; and its
  // strength's throb, in 4096ths, with its period and phase.
  uint32 wobble = 30;
  repeated uint32 wobble_period = 31;
  repeated uint32 wobble_phase = 32;
  uint32 throb = 33;
  uint32 throb_period = 34;
  uint32 throb_phase = 35;
}

// GaleWarning is a gale warning in force: issued from the forecast's
// synoptic wind, its spells, fronts and lows, where the mean wind reaches
// force 8 or the typical strongest gust a gale's gusts.
message GaleWarning {
  // The issue it came into force at: the same while it is in force, so a
  // client tells a new one by it.
  int64 key = 1;
  // The steps it blows at, a bit for each, the issue's the lowest; the
  // first of them; and its force, 8 to 12.
  uint32 steps = 2;
  uint32 first = 3;
  uint32 force = 4;
  // The direction its wind first blows from, in 65536ths of a turn; and
  // its strongest point, in metres east and north of the world's centre.
  uint32 from = 5;
  sint32 east = 6;
  sint32 north = 7;
  // The nearest charted island or place to its strongest point, by its
  // kind and number; unspecified for none.
  ChartSubject subject = 8;
  uint32 number = 9;
}

// ForecastPast is what has been, for a client just come: the forecast
// issued ninety minutes before, and the truth since, the systems'
// keyframes at each five minutes and the spells in play over them.
message ForecastPast {
  Forecast issue = 1;
  repeated Keyframe truth = 2;
  repeated Spell spells = 3;
}

// Chart is the world's chart so far: every subject charted, once a
// connection, after the Welcome. Names reach a client only here: a player
// learns a place's name only once it is charted, by anyone.
message Chart {
  repeated ChartEntry entries = 1;
  // The island courses open for racing, in the order they opened.
  repeated Course courses = 2;
}

// Charted is what has been charted since, sent to every connection as each
// is written, each once a connection; and the courses opened since.
message Charted {
  repeated ChartEntry entries = 1;
  repeated Course courses = 2;
}

// Course is an island course of the world, open for racing once every
// island and place it names is charted, and sent only then: its number
// among the world's courses, its kind and its name; its way, the shortest
// a boat sails, from the start to the finish, as metres east and north,
// one after the other; its length, m; what it rounds or passes, in order,
// each to its side; and the boats it is offered to, each with how long
// she is expected to take in its typical wind.
message Course {
  uint32 number = 1;
  CourseKind kind = 2;
  string name = 3;
  repeated sint32 way = 4;
  uint32 length = 5;
  repeated CourseRound rounds = 6;
  repeated CourseBoat boats = 7;
}

// CourseKind is a kind of island course.
enum CourseKind {
  COURSE_KIND_UNSPECIFIED = 0;
  // Round one island, from a line off a port and back.
  COURSE_KIND_ROUND = 1;
  // Round two or three islands.
  COURSE_KIND_TOUR = 2;
  // From a line off one port to a line off another.
  COURSE_KIND_PASSAGE = 3;
  // Round a lighthouse's island or rock, and home.
  COURSE_KIND_LIGHT = 4;
}

// CourseRound is what a course rounds or passes: a subject of the chart (an
// island, or a place: a lighthouse's rock, a beacon), and whether it is
// left to starboard.
message CourseRound {
  ChartSubject subject = 1;
  uint32 number = 2;
  bool starboard = 3;
}

// CourseBoat is a boat a course is offered to: her kind, an index into the
// catalog's boats, and her expected time, s.
message CourseBoat {
  uint32 kind = 1;
  uint32 seconds = 2;
}

// ChartEntry is a subject of the world's chart: an island, a place or a
// feature.
message ChartEntry {
  // What it is: its kind, its number among the world's islands, places or
  // features, and its sort, by its index in the catalog's list (an
  // island's size class, a place's or a feature's kind).
  ChartSubject subject = 1;
  uint32 number = 2;
  uint32 sort = 3;
  // Its name: an island's, a place's; none for a feature, which is named
  // by its sort and its island.
  string name = 4;
  // Where it is, in centimetres east and north of the world's centre.
  sint32 east = 5;
  sint32 north = 6;
  // Who charted it: the sailor's name as it was, and whether the sailor is
  // an AI agent; empty for a subject known from the world's start or
  // charted with another.
  string by = 7;
  bool ai = 8;
  // When, in milliseconds of UTC since 1970.
  int64 when_ms = 9;
  // What charting it was worth, in tenths.
  uint32 worth = 10;
  // The island it is on or by, its number and one; 0 for none.
  uint32 island = 11;
  // An island's: the name of its group of rocks, if it is in one; its
  // land's bounds, in centimetres (west, south, east, north); its highest
  // land, in centimetres; its zone, 0 the centre, 1 the middle waters, 2
  // the rim; its class of scenery, A, B or C; and its model's address, a
  // path on the play origin, fetched as a chunk is.
  string group = 12;
  repeated sint32 bounds = 13;
  uint32 highest = 14;
  uint32 zone = 15;
  string class = 16;
  string model = 17;
  // A lighthouse's light, by its number among the world's lights and one,
  // 0 for none; its character, by its index in the catalog's characters;
  // its height above the sea, in centimetres; and its nominal range, in
  // metres: what a chart prints beside it.
  uint32 light = 18;
  uint32 character = 23;
  uint32 focal = 24;
  uint32 range = 25;
  // A wreck's ship's name, and whether she lies sunk.
  string ship = 19;
  bool sunk = 20;
  // The subject it was charted with, if it was: its kind, and its number.
  ChartSubject with_subject = 21;
  uint32 with_number = 22;
}

// ChartSubject is a kind of subject of the chart.
enum ChartSubject {
  CHART_SUBJECT_UNSPECIFIED = 0;
  CHART_SUBJECT_ISLAND = 1;
  CHART_SUBJECT_PLACE = 2;
  CHART_SUBJECT_FEATURE = 3;
}

// Places are the places in chunks of the land the connection has just been
// handed: each place once, with its chunk, the chunk the place stands in,
// after that chunk's Chunks; so a place reaches only a client that could
// see the land about it. A place carries what is drawn of it, never its
// name.
message Places {
  repeated Place places = 1;
}

// Place is a place of the world: a port, a lighthouse, a reef, a wreck.
message Place {
  // Its number among the world's places.
  uint32 number = 1;
  // Its kind: an index into the catalog's kinds of place.
  uint32 kind = 2;
  // Where it is, in centimetres east and north of the world's centre, and
  // the way it faces, in 65536ths of a turn clockwise from north.
  sint32 east = 3;
  sint32 north = 4;
  uint32 heading = 5;
  // A lighthouse's tower: the ground under it and its height, in
  // centimetres, and its daymark, an index into the catalog's daymarks.
  uint32 ground = 6;
  uint32 tower = 7;
  uint32 daymark = 8;
  // A wreck: her rig and her age, indices into the catalog's rigs and
  // ages; whether she is sunk or lies stranded; and her heel, in 65536ths
  // of a turn, to starboard.
  uint32 rig = 9;
  uint32 age = 10;
  bool sunk = 11;
  sint32 heel = 12;
}

// Lights are the lighthouses' lights the connection is to show, and those
// it is to drop: a light is sent once the connection's eye is within its
// range, and dropped once the eye is further than its range by a margin.
// A light carries what is seen of it, never its name.
message Lights {
  repeated Light lights = 1;
  // The numbers of lights to drop.
  repeated uint32 drop = 2;
}

// Life is the sea's life about the connection's eye: the encounters come
// within their reach, each once and again when it changes, and those to
// drop, by id, once the eye is further than their reach by a margin. The
// eye is the boat's, or the watched boat's for a spectator. An encounter
// not dropped ends at its end. A new connection's Welcome drops every
// encounter it held; a later Welcome on it, none.
message Life {
  repeated LifeEncounter encounters = 1;
  repeated uint64 drop = 2;
}

// LifeEncounter is a group of one kind of the sea's life, met from its
// start to its end: the phone draws each animal of it from this record and
// world time, as every other phone near does. A group with no boat follows
// its kind's path through its centre; one with a boat moves about that
// boat as the phone draws it.
message LifeEncounter {
  // Its id, the same for every connection; and how many times it has
  // changed: a later revision replaces an earlier.
  uint64 id = 1;
  uint32 rev = 2;
  // Its kind: an index into the catalog's life kinds.
  uint32 kind = 3;
  // Its start and its end, in ticks of world time.
  int64 start = 4;
  int64 end = 5;
  // Its centre, in centimetres east and north of the world's centre.
  sint32 east = 6;
  sint32 north = 7;
  // The way it goes, in radians clockwise from north, and how fast, in
  // m/s.
  float heading = 8;
  float speed = 9;
  // How many there are, and its own number, which each animal's path is
  // drawn from.
  uint32 count = 10;
  uint32 seed = 11;
  // The boat it is with, as this connection sees boats: 0 none, 1 the
  // connection's own boat or the one it watches, 2 + n the boat in view
  // slot n, and 255 a boat this connection does not see, so it is drawn
  // nowhere.
  uint32 with = 12;
  // The encounter on whose patch it comes, 0 for none: the birds and the
  // dolphins with bait, the flying fish a boat flushes from a ground. One
  // with a kind that moves otherwise over another's patch moves so.
  uint64 over = 13;
}

// Light is a lighthouse's light. It shows its character's light and dark
// in turn at world time t plus its phase, so that every client shows the
// same flash at the same moment.
message Light {
  // Its number among the world's lights.
  uint32 number = 1;
  // Where it is, in centimetres east and north of the world's centre, and
  // its height above the sea, in centimetres.
  sint32 east = 2;
  sint32 north = 3;
  uint32 focal = 4;
  // Its character: an index into the catalog's characters.
  uint32 character = 5;
  // Its phase, in microseconds of world time.
  int64 phase = 6;
  // Its nominal range, in metres.
  uint32 range = 7;
  // Its lighthouse's fog signal: an index into the catalog's fog signals.
  // Its blasts keep the light's phase, and each sounds while the
  // visibility at the light is poor or worse as it begins.
  uint32 fog_signal = 8;
}

// Tools says the account's owner's flag has been set or cleared while the
// connection is open, as Welcome.tools says it at the start: the free
// camera is offered or withdrawn. Cleared, a free camera roaming is
// brought back to the boat.
message Tools {
  bool on = 1;
}

// Chunks hands the client the addresses of chunks of the world's land: each
// once a connection, once its boat could see something in the chunk (land
// over the horizon from the highest the camera goes, shallows within the
// far sea's reach, or the chunk within a few hundred metres). The client
// fetches each from its address (GET, public and cached for a year), and
// never makes an address itself: no other address is served. They come
// after the Welcome, nearest first.
message Chunks {
  // Each chunk's number on the world's grid of 16 by 16, row by row from
  // the south-west, and its address, a path on the play origin.
  repeated uint32 number = 1;
  repeated string path = 2;
}

// Bump is two boats touching after being apart: a correction the
// snapshots carry, and this, sent once. Each boat's sailor is told whose
// fault it was, by the Articles, the right-of-way rules; a connection that
// sees either boat in its near band is told of the knock, without the
// verdict. A connection is sent the bumps after it joins, each once.
message Bump {
  // The tick the hulls touched.
  int64 tick = 1;
  // Where, in centimetres east and north of the world's centre.
  sint32 x = 2;
  sint32 y = 3;
  // How fast they closed along the normal between the hulls, in cm/s.
  uint32 closing = 4;
  // Whose fault it was, seen from the connection's boat.
  BumpPart part = 5;
  // The Article that puts the fault there, numbered as the Racing Rules
  // of Sailing number the rule: "10", "16.1", "22". Empty for a viewer.
  string article = 6;
}

// BumpPart is a connection's part in a bump.
enum BumpPart {
  // Not one of the boats: a connection that only saw it.
  BUMP_PART_UNSPECIFIED = 0;
  // Its boat was at fault.
  BUMP_PART_YOURS = 1;
  // The other boat was.
  BUMP_PART_THEIRS = 2;
  // Neither was: both capsized.
  BUMP_PART_NONE = 3;
}

// WeatherSystems is the weather in play about the present: the spells and
// the weather systems' keyframes the client needs to compute the wind at
// its boat, at every tick it steps ahead of the server or replays behind
// it, exactly as the server does. It comes after the Welcome, with the
// keyframes at the last keyframe's tick and the two after; whenever the
// spells in play change: a spell is sent ten seconds before its change from
// the one before begins, never earlier, and kept until ten seconds after
// its change to the next has ended, or a front's line has left the disk;
// and at each keyframe's tick, with the keyframe twenty seconds on, never
// further, and any the client holds that has changed. The client holds the
// latest spells it was sent, and the latest four keyframes by their ticks.
message WeatherSystems {
  // The spells in play, by the tick each begins at, ascending: at most 4.
  repeated Spell spells = 1;
  // Keyframes, by their ticks, ascending: at most 3. Each replaces any the
  // client holds of its tick.
  repeated Keyframe keyframes = 2;
  // The spells the client holds are still those in play: spells is empty.
  bool keep_spells = 3;
  // The next front, before its spell is in play: from when its cirrus can
  // first be seen from the disk until its spell is announced. Each message
  // carries it, or none, which replaces what the client holds.
  ComingFront coming = 4;
}

// ComingFront is a front before its spell is in play: its line alone,
// which its cirrus shows far ahead of it, never its spell's wind. It is a
// spell's fields of the same names.
message ComingFront {
  // The tick its line enters the disk's reach, the ticks it takes to cross
  // to the far side, and the direction it moves toward, in 65536ths of a
  // turn clockwise from north.
  int64 begin = 1;
  uint32 change = 2;
  uint32 toward = 3;
}

// IslandCaps are the islands whose cap of cumulus the connection is to
// draw by day, and those it is to drop: an island is sent once the
// connection's eye is within sight of its cap, and dropped once the eye is
// further than that by a margin. It carries what the sky shows of the
// island, never its name: its centre and its width, each to 50 m.
message IslandCaps {
  repeated IslandCap caps = 1;
  // The numbers of islands to drop.
  repeated uint32 drop = 2;
}

// IslandCap is an island's cap.
message IslandCap {
  // Its number among the world's islands.
  uint32 number = 1;
  // Its centre, in metres east and north of the world's centre, and its
  // width, in metres, each to 50 m.
  sint32 east = 2;
  sint32 north = 3;
  uint32 width = 4;
}

// Keyframe is the weather systems at a tick: each one's place, motion,
// strength and size, in whole numbers. Between two keyframes the client
// interpolates, as the server does.
message Keyframe {
  // The tick it is of.
  int64 tick = 1;
  // The systems, by their slots, ascending: at most 28.
  repeated SystemKey systems = 2;
}

// SystemKey is a weather system at a keyframe.
message SystemKey {
  // Its slot, which it holds from its birth to its end: below 24 the
  // world's own, from 24 a developer's.
  uint32 slot = 1;
  // The catalog's index of its kind, and a seed for drawing it.
  uint32 kind = 2;
  uint32 seed = 3;
  // Growing, mature or decaying: 0, 1 or 2.
  uint32 stage = 4;
  // Its centre, in quarter metres east and north of the world's centre.
  sint32 east = 5;
  sint32 north = 6;
  // The direction it moves toward, in 65536ths of a turn clockwise from
  // north, and how fast, in steps of 0.01 m/s.
  uint32 heading = 7;
  uint32 speed = 8;
  // Its strength, in 4096ths; its radius, m.
  uint32 strength = 9;
  uint32 size = 10;
  // The wind it adds at its peak at full strength, in steps of 0.01 m/s;
  // for a patch of its kind, the wind's share at its core, in thousandths.
  uint32 peak = 11;
  // Its pressure at its centre at full strength, in hundredths of a hPa: a
  // dome's above, a low's below.
  sint32 depth = 12;
  // A line's length across its motion, m; 0 for any other shape.
  uint32 length = 13;
}

// Spell is a spell of weather: a stretch of time with one base wind, its
// shifts and its gust field, in whole numbers.
message Spell {
  // The tick its change from the spell before begins, and how many ticks
  // the change takes: 0 is at once.
  int64 begin = 1;
  uint32 change = 2;
  // The tick its drift, its gust field's travel and its life count from,
  // and the ticks over which it drifts by drift: 0 for no drift.
  int64 start = 3;
  uint64 length = 4;
  // The catalog's index of its regime.
  uint32 regime = 5;
  // The same wind everywhere, with no shifts, gusts, rim or refuge.
  bool steady = 6;
  // Its wind at mid-disk, in steps of 0.01 m/s.
  uint32 speed = 7;
  // The direction its wind comes from at start, and how far that veers
  // over length (negative backs), in 65536ths of a turn clockwise from
  // north.
  uint32 from = 8;
  sint32 drift = 9;
  // Its gust factor, in thousandths.
  uint32 gust = 10;
  // Its two oscillating shifts: each one's amplitude and phase at tick 0,
  // in 65536ths of a turn, and its period in ticks.
  repeated uint32 shift = 11;
  repeated uint32 period = 12;
  repeated uint32 phase = 13;
  // How far the direction differs at the rim from the centre, in 65536ths
  // of a turn; the axis it differs along at tick 0, a direction in
  // 65536ths of a turn; and the ticks the axis takes to turn once.
  uint32 across = 14;
  uint32 axis = 15;
  uint32 axis_period = 16;
  // The gust field's seed.
  uint32 seed = 17;
  // Its pressure's level, in hundredths of a hPa.
  uint32 pressure = 18;
  // The spell arrives by a front: a line that enters the disk's reach at
  // begin and leaves it change ticks later, moving toward toward, in
  // 65536ths of a turn clockwise from north, its trough trough deep, in
  // hundredths of a hPa.
  bool front = 19;
  uint32 toward = 20;
  uint32 trough = 21;
  // The world's own weather systems do not blow while it is the spell in
  // effect: a developer's weather.
  bool still = 22;
  // Its front is a warm front: its rain in a band ahead of its line, and
  // no surge of the gusts behind it.
  bool warm = 23;
}

// SeaAreas is what raises the waves about the boat: a square of sea areas,
// each 463 m on a side, with the wind and the fetch that give each its
// waves. The client derives the waves from them exactly as the server does.
// It comes after the Welcome; whenever the sea is to change, a second or
// so before the tick the change applies from; and whenever the boat sails
// into another area, with the areas about that one. A client keeps the two
// with the latest ticks, and at each tick uses the later of those whose
// tick has come.
message SeaAreas {
  // The first tick these apply to.
  int64 tick = 1;
  // The column, counted from the west, and the row, from the south, of the
  // first area, in the world's 37 by 37 areas: the middle one, 18 and 18,
  // is centred on the world's centre. Either may be negative or reach past
  // the world's edge.
  sint32 col = 2;
  sint32 row = 3;
  // Areas on a side: 5.
  uint32 size = 4;
  // For each area, row by row from the south-west: the speed of the wind
  // that raises its waves, in steps of 0.01 m/s; the direction it comes
  // from, clockwise from north, in steps of a 65536th of a turn; and the
  // fetch, in metres.
  repeated uint32 speed = 5;
  repeated uint32 from = 6;
  repeated uint32 fetch = 7;
  // For each area, as above, the swell that reaches it from a storm: its
  // significant height in centimetres, none if 0; its peak period in steps
  // of 0.01 s; and the direction it comes from, as the wind's. Sent only
  // when they differ from those last sent: empty, they are as they were.
  // An area's current is not sent: the client works it out at the area's
  // centre from the world's circulation, as the server does.
  repeated uint32 swell_height = 8;
  repeated uint32 swell_period = 9;
  repeated uint32 swell_from = 10;
}

// Restart says the server is about to restart, as a new version is
// deployed: the world sails on until then, and the connection is closed
// with 1012. Every boat waits, in its grace, for its sailor to come back
// to the restarted server.
message Restart {
  // About how long until the connection closes, in milliseconds.
  uint32 in_ms = 1;
}

// Queued says the sea is full: the client waits for a boat. It comes after
// the Hello, and again whenever the place changes, at most once a second;
// a Welcome follows when the boat is given.
message Queued {
  // The place in the queue, 1 for the next to be given a boat.
  uint32 position = 1;
  // How many wait in all.
  uint32 waiting = 2;
  // A place in the spectators' queue, to watch, not the queue for a boat.
  bool spectators = 3;
}

// Welcome says the client has its boat; its snapshots follow.
message Welcome {
  // The world's ID.
  string world = 1;
  // The tick of the first frame the boat was in.
  int64 tick = 2;
  // World time when sent: microseconds since the world's epoch.
  int64 world_time_us = 3;
  // The boat's ID.
  uint64 boat = 4;
  // The boat's kind: an index into the catalog's boats.
  uint32 kind = 5;
  // The boat is the one the account already had.
  bool rejoined = 6;
  // The world's epoch, from which world time counts: microseconds of UTC
  // since 1970. The sky is counted from a moment of its own, the same in
  // every world, so the client needs the world's to tell sky time.
  int64 epoch_us = 7;
  // The world's land is sailed: boats run aground on it, and the wind and
  // the waves feel it. Without it the world is open sea, and no Chunks come.
  bool land = 8;
  // The way the world's water circulates round the disk: 1 clockwise seen
  // from above, -1 the other way, 0 none. The client works the current out
  // from it, the drain and the ground, as the server does.
  sint32 circulation = 9;
  // The account carries the owner's flag: the free camera (Roam) is its.
  bool tools = 10;
  // The main port's light, seen from everywhere in the world; none in a
  // world without land.
  Light light = 11;
  // When the world ends: microseconds of UTC since 1970, 0 for no end
  // known. At its end the falls take the world, its last tick is
  // (ends_us - epoch_us) * 30 / 1e6, and every connection is closed with
  // 4004: the next world is reached by connecting again.
  int64 ends_us = 12;
  // When the world begins closing, its last days: microseconds of UTC
  // since 1970, 0 for no end known. The game warns of the end from then.
  int64 closing_us = 13;
  // The time zone the schedule's ends are published in, an IANA name such
  // as America/New_York; "" for a schedule of periods, published in UTC.
  string zone = 14;
  // The connection watches another sailor's boat, not sails its own: boat
  // and kind are the watched boat's, and so are the snapshots. A Welcome
  // comes again at each new watch, and for the connection's own boat when
  // it sails again.
  Watching watching = 15;
  // The world's harbour, where the refuge holds the wind and the start's
  // breeze does not; none in a world without land, whose refuge and
  // breeze are about the world's centre. The client computes the wind
  // with it, as the server does, and a new boat's first view looks past
  // the boat at its mouth.
  Harbour harbour = 16;
  // The look of the boat's sailor, the connection's own or the one it
  // watches: a look code, as an enter in a snapshot has it.
  uint32 look = 17;
  // The boat's own look, its paint, cloth and sail number: a boat look
  // code, as an enter in a snapshot has it; and its name, player text, ""
  // for none.
  uint32 boat_look = 18;
  string boat_name = 19;
  // The connection is aboard another sailor's boat, as its crew: boat and
  // kind are that boat's, and so are the snapshots, as when watching; its
  // inputs steer the boat only while it holds the controls (the
  // snapshot's holding flag). A Welcome to the connection's own boat comes
  // when it goes ashore.
  Aboard aboard = 20;
}

// Aboard is whose boat a connection is aboard, and its seat there.
message Aboard {
  // The skipper's name and look.
  string skipper = 1;
  uint32 look = 2;
  uint32 seat = 3;
}

// Harbour is a world's harbour, in decimetres east and north of the
// world's centre: its basin, a circle at its widest radius; and its narrows,
// from the basin's centre out to the mouth, where they open to the sea,
// and their width there.
message Harbour {
  sint32 east = 1;
  sint32 north = 2;
  uint32 radius = 3;
  sint32 mouth_east = 4;
  sint32 mouth_north = 5;
  uint32 narrows = 6;
}

// Watching is whose boat a connection watches.
message Watching {
  // The sailor's name; whether it is a machine sailor, sailed by an AI
  // agent; and whether it is one of the account's own machine sailors.
  string sailor = 1;
  bool machine = 2;
  bool mine = 3;
  // The sailor's look: a look code, as an enter in a snapshot has it.
  uint32 look = 4;
}

// Pong answers a Ping.
message Pong {
  // The Ping's client_time_us.
  int64 client_time_us = 1;
  // World time when sent: microseconds since the world's epoch.
  int64 world_time_us = 2;
}
