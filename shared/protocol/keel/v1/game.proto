// The game connection's control messages. Each WebSocket binary message is
// one game message whose first byte is its kind (snapshot.txt): kind 1 is
// one of the envelopes below, encoded as Protocol Buffers; kind 2 is the
// packed snapshot, which is not described here.
//
// go run ./tools/protocol generates the Go and TypeScript from this file,
// and the protocol version from this file and snapshot.txt.
syntax = "proto3";

package keel.v1;

option go_package = "github.com/daneelvt/keel-over-the-edge/internal/protocol/pb";

// ClientMessage is everything a client sends, after the kind byte 1.
message ClientMessage {
  oneof body {
    Hello hello = 1;
    Input input = 2;
    Ping ping = 3;
    Command command = 4;
  }
}

// Hello is the first message on a connection. A client whose protocol,
// catalog or physics layout differs from the server's is closed with 4002.
message Hello {
  // The protocol version: a hash of the schema and the snapshot's layout.
  string protocol = 1;
  // The catalog version the client was built with.
  string catalog = 2;
  // The physics module's layout version.
  uint32 physics_layout = 3;
  // The client's build, for the log only.
  string build = 4;
}

// Input is the controls the client steps its boat with, stamped with the
// tick it predicted them for; or, with ack_only, just an acknowledgement.
message Input {
  // The low 32 bits of the tick the controls are for.
  uint32 seq = 1;
  // The helm, 0 (hard to port) to 1024 (hard to starboard).
  uint32 helm = 2;
  // The sheet, 0 (hauled in) to 1024 (let fly).
  uint32 sheet = 3;
  // The tick of the newest snapshot the client has decoded; 0 for none.
  int64 ack_tick = 4;
  // No control change: the message only acknowledges.
  bool ack_only = 5;
  // The autopilot: 0 off, 1 holding an angle off the wind, 2 a compass
  // heading. While it is on it steers, and helm is not used.
  uint32 pilot = 6;
  // What it holds, in 65536ths of a turn: the angle off the wind, positive
  // with the wind over starboard (from 32768 on, the angle less a whole
  // turn), or the heading clockwise from north.
  uint32 target = 7;
  // The order count, 0 to 3: a count the boat has not taken is a new order,
  // a tack or a gybe, applied at the input's tick as the helm is.
  uint32 order = 8;
  // The way of the latest order: 0 hold, 1 tack, 2 gybe.
  uint32 way = 9;
}

// Ping asks for the server's world time, for the client's clock.
message Ping {
  // The client's own clock, in microseconds; returned in the Pong.
  int64 client_time_us = 1;
  // The tick of the newest snapshot the client has decoded; 0 for none.
  int64 ack_tick = 2;
  // The client's estimate of the round trip, in milliseconds.
  uint32 rtt_ms = 3;
  // The 95th percentile of the client's frame time, in milliseconds.
  uint32 frame_ms = 4;
  // How much the client draws: 1 the low tier, 2 medium, 3 high; 0 unknown.
  uint32 tier = 5;
  // The pixel ratio the client draws at, in hundredths; 0 unknown.
  uint32 render_scale = 6;
}

// Command is something the player asks of the game.
message Command {
  oneof body {
    Resync resync = 1;
    Roam roam = 2;
  }
}

// Resync asks for the next snapshot in full: the client lacks the base of
// one it received. At most one a second is honoured.
message Resync {}

// Roam is the owner's free camera, from an account that carries the
// owner's flag (Welcome.tools); from any other it is ignored. While it is
// on, the connection's eye is the camera's point: the other boats, the sea
// areas and the land's chunks it is sent are those about the eye, not
// about the boat, which stays where it is, not stepped, until the camera
// is off or the connection ends. Sent as the camera leaves the boat, as it
// moves, at most five a second and once it has moved 20 m, and as it comes
// back. The eye is clamped to the whole disk and 500 m beyond its lip,
// from 2 m to 500 m above the sea.
message Roam {
  // The camera is off the boat.
  bool on = 1;
  // The point under the camera, in centimetres east and north of the
  // world's centre, and its height above the sea, in centimetres.
  sint32 east = 2;
  sint32 north = 3;
  uint32 height = 4;
}

// ServerMessage is everything the server sends but snapshots, after the
// kind byte 1.
message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Pong pong = 2;
    Queued queued = 3;
    Restart restart = 4;
    SeaAreas sea_areas = 5;
    WeatherSystems weather_systems = 6;
    Bump bump = 7;
    Chunks chunks = 8;
    Tools tools = 9;
    Places places = 10;
    Lights lights = 11;
    Chart chart = 12;
    Charted charted = 13;
  }
}

// Chart is the world's chart so far: every subject charted, once a
// connection, after the Welcome. Names reach a client only here: a player
// learns a place's name only once it is charted, by anyone.
message Chart {
  repeated ChartEntry entries = 1;
}

// Charted is what has been charted since, sent to every connection as each
// is written, each once a connection.
message Charted {
  repeated ChartEntry entries = 1;
}

// ChartEntry is a subject of the world's chart: an island, a place or a
// feature.
message ChartEntry {
  // What it is: its kind, its number among the world's islands, places or
  // features, and its sort, by its index in the catalog's list (an
  // island's size class, a place's or a feature's kind).
  ChartSubject subject = 1;
  uint32 number = 2;
  uint32 sort = 3;
  // Its name: an island's, a place's; none for a feature, which is named
  // by its sort and its island.
  string name = 4;
  // Where it is, in centimetres east and north of the world's centre.
  sint32 east = 5;
  sint32 north = 6;
  // Who charted it: the sailor's name as it was, and whether the sailor is
  // an AI agent; empty for a subject known from the world's start or
  // charted with another.
  string by = 7;
  bool ai = 8;
  // When, in milliseconds of UTC since 1970.
  int64 when_ms = 9;
  // What charting it was worth, in tenths.
  uint32 worth = 10;
  // The island it is on or by, its number and one; 0 for none.
  uint32 island = 11;
  // An island's: the name of its group of rocks, if it is in one; its
  // land's bounds, in centimetres (west, south, east, north); its highest
  // land, in centimetres; its zone, 0 the centre, 1 the middle waters, 2
  // the rim; its class of scenery, A, B or C; and its model's address, a
  // path on the play origin, fetched as a chunk is.
  string group = 12;
  repeated sint32 bounds = 13;
  uint32 highest = 14;
  uint32 zone = 15;
  string class = 16;
  string model = 17;
  // A lighthouse's light, by its number among the world's lights and one,
  // 0 for none; its character, by its index in the catalog's characters;
  // its height above the sea, in centimetres; and its nominal range, in
  // metres: what a chart prints beside it.
  uint32 light = 18;
  uint32 character = 23;
  uint32 focal = 24;
  uint32 range = 25;
  // A wreck's ship's name, and whether she lies sunk.
  string ship = 19;
  bool sunk = 20;
  // The subject it was charted with, if it was: its kind, and its number.
  ChartSubject with_subject = 21;
  uint32 with_number = 22;
}

// ChartSubject is a kind of subject of the chart.
enum ChartSubject {
  CHART_SUBJECT_UNSPECIFIED = 0;
  CHART_SUBJECT_ISLAND = 1;
  CHART_SUBJECT_PLACE = 2;
  CHART_SUBJECT_FEATURE = 3;
}

// Places are the places in chunks of the land the connection has just been
// handed: each place once, with its chunk, the chunk the place stands in,
// after that chunk's Chunks; so a place reaches only a client that could
// see the land about it. A place carries what is drawn of it, never its
// name.
message Places {
  repeated Place places = 1;
}

// Place is a place of the world: a port, a lighthouse, a reef, a wreck.
message Place {
  // Its number among the world's places.
  uint32 number = 1;
  // Its kind: an index into the catalog's kinds of place.
  uint32 kind = 2;
  // Where it is, in centimetres east and north of the world's centre, and
  // the way it faces, in 65536ths of a turn clockwise from north.
  sint32 east = 3;
  sint32 north = 4;
  uint32 heading = 5;
  // A lighthouse's tower: the ground under it and its height, in
  // centimetres, and its daymark, an index into the catalog's daymarks.
  uint32 ground = 6;
  uint32 tower = 7;
  uint32 daymark = 8;
  // A wreck: her rig and her age, indices into the catalog's rigs and
  // ages; whether she is sunk or lies stranded; and her heel, in 65536ths
  // of a turn, to starboard.
  uint32 rig = 9;
  uint32 age = 10;
  bool sunk = 11;
  sint32 heel = 12;
}

// Lights are the lighthouses' lights the connection is to show, and those
// it is to drop: a light is sent once the connection's eye is within its
// range, and dropped once the eye is further than its range by a margin.
// A light carries what is seen of it, never its name.
message Lights {
  repeated Light lights = 1;
  // The numbers of lights to drop.
  repeated uint32 drop = 2;
}

// Light is a lighthouse's light. It shows its character's light and dark
// in turn at world time t plus its phase, so that every client shows the
// same flash at the same moment.
message Light {
  // Its number among the world's lights.
  uint32 number = 1;
  // Where it is, in centimetres east and north of the world's centre, and
  // its height above the sea, in centimetres.
  sint32 east = 2;
  sint32 north = 3;
  uint32 focal = 4;
  // Its character: an index into the catalog's characters.
  uint32 character = 5;
  // Its phase, in microseconds of world time.
  int64 phase = 6;
  // Its nominal range, in metres.
  uint32 range = 7;
}

// Tools says the account's owner's flag has been set or cleared while the
// connection is open, as Welcome.tools says it at the start: the free
// camera is offered or withdrawn. Cleared, a free camera roaming is
// brought back to the boat.
message Tools {
  bool on = 1;
}

// Chunks hands the client the addresses of chunks of the world's land: each
// once a connection, once its boat could see something in the chunk (land
// over the horizon from the highest the camera goes, shallows within the
// far sea's reach, or the chunk within a few hundred metres). The client
// fetches each from its address (GET, public and cached for a year), and
// never makes an address itself: no other address is served. They come
// after the Welcome, nearest first.
message Chunks {
  // Each chunk's number on the world's grid of 16 by 16, row by row from
  // the south-west, and its address, a path on the play origin.
  repeated uint32 number = 1;
  repeated string path = 2;
}

// Bump is two boats touching after being apart: a correction the
// snapshots carry, and this, sent once. Each boat's sailor is told whose
// fault it was, by the Articles, the right-of-way rules; a connection that
// sees either boat in its near band is told of the knock, without the
// verdict. A connection is sent the bumps after it joins, each once.
message Bump {
  // The tick the hulls touched.
  int64 tick = 1;
  // Where, in centimetres east and north of the world's centre.
  sint32 x = 2;
  sint32 y = 3;
  // How fast they closed along the normal between the hulls, in cm/s.
  uint32 closing = 4;
  // Whose fault it was, seen from the connection's boat.
  BumpPart part = 5;
  // The Article that puts the fault there, numbered as the Racing Rules
  // of Sailing number the rule: "10", "16.1", "22". Empty for a viewer.
  string article = 6;
}

// BumpPart is a connection's part in a bump.
enum BumpPart {
  // Not one of the boats: a connection that only saw it.
  BUMP_PART_UNSPECIFIED = 0;
  // Its boat was at fault.
  BUMP_PART_YOURS = 1;
  // The other boat was.
  BUMP_PART_THEIRS = 2;
  // Neither was: both capsized.
  BUMP_PART_NONE = 3;
}

// WeatherSystems is the weather in play about the present: the spells the
// client needs to compute the wind at its boat, at every tick it steps
// ahead of the server or replays behind it, exactly as the server does. It
// comes after the Welcome, and whenever the spells in play change: a spell
// is sent ten seconds before its change from the one before begins, never
// earlier, and kept until ten seconds after its change to the next has
// ended. The client holds the latest it was sent.
message WeatherSystems {
  // The spells in play, by the tick each begins at, ascending: at most 4.
  repeated Spell spells = 1;
}

// Spell is a spell of weather: a stretch of time with one base wind, its
// shifts and its gust field, in whole numbers.
message Spell {
  // The tick its change from the spell before begins, and how many ticks
  // the change takes: 0 is at once.
  int64 begin = 1;
  uint32 change = 2;
  // The tick its drift, its gust field's travel and its life count from,
  // and the ticks over which it drifts by drift: 0 for no drift.
  int64 start = 3;
  uint64 length = 4;
  // The catalog's index of its regime.
  uint32 regime = 5;
  // The same wind everywhere, with no shifts, gusts, rim or refuge.
  bool steady = 6;
  // Its wind at mid-disk, in steps of 0.01 m/s.
  uint32 speed = 7;
  // The direction its wind comes from at start, and how far that veers
  // over length (negative backs), in 65536ths of a turn clockwise from
  // north.
  uint32 from = 8;
  sint32 drift = 9;
  // Its gust factor, in thousandths.
  uint32 gust = 10;
  // Its two oscillating shifts: each one's amplitude and phase at tick 0,
  // in 65536ths of a turn, and its period in ticks.
  repeated uint32 shift = 11;
  repeated uint32 period = 12;
  repeated uint32 phase = 13;
  // How far the direction differs at the rim from the centre, in 65536ths
  // of a turn; the axis it differs along at tick 0, a direction in
  // 65536ths of a turn; and the ticks the axis takes to turn once.
  uint32 across = 14;
  uint32 axis = 15;
  uint32 axis_period = 16;
  // The gust field's seed.
  uint32 seed = 17;
}

// SeaAreas is what raises the waves about the boat: a square of sea areas,
// each 463 m on a side, with the wind and the fetch that give each its
// waves. The client derives the waves from them exactly as the server does.
// It comes after the Welcome; whenever the sea is to change, a second or
// so before the tick the change applies from; and whenever the boat sails
// into another area, with the areas about that one. A client keeps the two
// with the latest ticks, and at each tick uses the later of those whose
// tick has come.
message SeaAreas {
  // The first tick these apply to.
  int64 tick = 1;
  // The column, counted from the west, and the row, from the south, of the
  // first area, in the world's 37 by 37 areas: the middle one, 18 and 18,
  // is centred on the world's centre. Either may be negative or reach past
  // the world's edge.
  sint32 col = 2;
  sint32 row = 3;
  // Areas on a side: 5.
  uint32 size = 4;
  // For each area, row by row from the south-west: the speed of the wind
  // that raises its waves, in steps of 0.01 m/s; the direction it comes
  // from, clockwise from north, in steps of a 65536th of a turn; and the
  // fetch, in metres.
  repeated uint32 speed = 5;
  repeated uint32 from = 6;
  repeated uint32 fetch = 7;
}

// Restart says the server is about to restart, as a new version is
// deployed: the world sails on until then, and the connection is closed
// with 1012. Every boat waits, in its grace, for its sailor to come back
// to the restarted server.
message Restart {
  // About how long until the connection closes, in milliseconds.
  uint32 in_ms = 1;
}

// Queued says the sea is full: the client waits for a boat. It comes after
// the Hello, and again whenever the place changes, at most once a second;
// a Welcome follows when the boat is given.
message Queued {
  // The place in the queue, 1 for the next to be given a boat.
  uint32 position = 1;
  // How many wait in all.
  uint32 waiting = 2;
}

// Welcome says the client has its boat; its snapshots follow.
message Welcome {
  // The world's ID.
  string world = 1;
  // The tick of the first frame the boat was in.
  int64 tick = 2;
  // World time when sent: microseconds since the world's epoch.
  int64 world_time_us = 3;
  // The boat's ID.
  uint64 boat = 4;
  // The boat's kind: an index into the catalog's boats.
  uint32 kind = 5;
  // The boat is the one the account already had.
  bool rejoined = 6;
  // The world's epoch, from which world time counts: microseconds of UTC
  // since 1970. The sky is counted from a moment of its own, the same in
  // every world, so the client needs the world's to tell sky time.
  int64 epoch_us = 7;
  // The world's land is sailed: boats run aground on it, and the wind and
  // the waves feel it. Without it the world is open sea, and no Chunks come.
  bool land = 8;
  // The way the world's water circulates round the disk: 1 clockwise seen
  // from above, -1 the other way, 0 none. The client works the current out
  // from it, the drain and the ground, as the server does.
  sint32 circulation = 9;
  // The account carries the owner's flag: the free camera (Roam) is its.
  bool tools = 10;
  // The main port's light, seen from everywhere in the world; none in a
  // world without land.
  Light light = 11;
  // When the world ends: microseconds of UTC since 1970, 0 for no end
  // known. At its end the falls take the world, its last tick is
  // (ends_us - epoch_us) * 30 / 1e6, and every connection is closed with
  // 4004: the next world is reached by connecting again.
  int64 ends_us = 12;
  // When the world begins closing, its last days: microseconds of UTC
  // since 1970, 0 for no end known. The game warns of the end from then.
  int64 closing_us = 13;
  // The time zone the schedule's ends are published in, an IANA name such
  // as America/New_York; "" for a schedule of periods, published in UTC.
  string zone = 14;
}

// Pong answers a Ping.
message Pong {
  // The Ping's client_time_us.
  int64 client_time_us = 1;
  // World time when sent: microseconds since the world's epoch.
  int64 world_time_us = 2;
}
