// The game connection's control messages. Each WebSocket binary message is
// one game message whose first byte is its kind (snapshot.txt): kind 1 is
// one of the envelopes below, encoded as Protocol Buffers; kind 2 is the
// packed snapshot, which is not described here.
//
// go run ./tools/protocol generates the Go and TypeScript from this file,
// and the protocol version from this file and snapshot.txt.
syntax = "proto3";

package keel.v1;

option go_package = "github.com/daneelvt/keel-over-the-edge/internal/protocol/pb";

// ClientMessage is everything a client sends, after the kind byte 1.
message ClientMessage {
  oneof body {
    Hello hello = 1;
    Input input = 2;
    Ping ping = 3;
    Command command = 4;
  }
}

// Hello is the first message on a connection. A client whose protocol,
// catalog or physics layout differs from the server's is closed with 4002.
message Hello {
  // The protocol version: a hash of the schema and the snapshot's layout.
  string protocol = 1;
  // The catalog version the client was built with.
  string catalog = 2;
  // The physics module's layout version.
  uint32 physics_layout = 3;
  // The client's build, for the log only.
  string build = 4;
}

// Input is the controls the client steps its boat with, stamped with the
// tick it predicted them for; or, with ack_only, just an acknowledgement.
message Input {
  // The low 32 bits of the tick the controls are for.
  uint32 seq = 1;
  // The helm, 0 (hard to port) to 1024 (hard to starboard).
  uint32 helm = 2;
  // The sheet, 0 (hauled in) to 1024 (let fly).
  uint32 sheet = 3;
  // The tick of the newest snapshot the client has decoded; 0 for none.
  int64 ack_tick = 4;
  // No control change: the message only acknowledges.
  bool ack_only = 5;
}

// Ping asks for the server's world time, for the client's clock.
message Ping {
  // The client's own clock, in microseconds; returned in the Pong.
  int64 client_time_us = 1;
  // The tick of the newest snapshot the client has decoded; 0 for none.
  int64 ack_tick = 2;
  // The client's estimate of the round trip, in milliseconds.
  uint32 rtt_ms = 3;
  // The 95th percentile of the client's frame time, in milliseconds.
  uint32 frame_ms = 4;
  // How much the client draws: 1 the low tier, 2 medium, 3 high; 0 unknown.
  uint32 tier = 5;
  // The pixel ratio the client draws at, in hundredths; 0 unknown.
  uint32 render_scale = 6;
}

// Command is something the player asks of the game.
message Command {
  oneof body {
    Resync resync = 1;
  }
}

// Resync asks for the next snapshot in full: the client lacks the base of
// one it received. At most one a second is honoured.
message Resync {}

// ServerMessage is everything the server sends but snapshots, after the
// kind byte 1.
message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Pong pong = 2;
    Queued queued = 3;
    Restart restart = 4;
    SeaAreas sea_areas = 5;
  }
}

// SeaAreas is what raises the waves about the boat: a square of sea areas,
// each 463 m on a side, with the wind and the fetch that give each its
// waves. The client derives the waves from them exactly as the server does.
// It comes after the Welcome; whenever the sea is to change, a second or
// so before the tick the change applies from; and whenever the boat sails
// into another area, with the areas about that one. A client keeps the two
// with the latest ticks, and at each tick uses the later of those whose
// tick has come.
message SeaAreas {
  // The first tick these apply to.
  int64 tick = 1;
  // The column, counted from the west, and the row, from the south, of the
  // first area, in the world's 37 by 37 areas: the middle one, 18 and 18,
  // is centred on the world's centre. Either may be negative or reach past
  // the world's edge.
  sint32 col = 2;
  sint32 row = 3;
  // Areas on a side: 5.
  uint32 size = 4;
  // For each area, row by row from the south-west: the speed of the wind
  // that raises its waves, in steps of 0.01 m/s; the direction it comes
  // from, clockwise from north, in steps of a 65536th of a turn; and the
  // fetch, in metres.
  repeated uint32 speed = 5;
  repeated uint32 from = 6;
  repeated uint32 fetch = 7;
}

// Restart says the server is about to restart, as a new version is
// deployed: the world sails on until then, and the connection is closed
// with 1012. Every boat waits, in its grace, for its sailor to come back
// to the restarted server.
message Restart {
  // About how long until the connection closes, in milliseconds.
  uint32 in_ms = 1;
}

// Queued says the sea is full: the client waits for a boat. It comes after
// the Hello, and again whenever the place changes, at most once a second;
// a Welcome follows when the boat is given.
message Queued {
  // The place in the queue, 1 for the next to be given a boat.
  uint32 position = 1;
  // How many wait in all.
  uint32 waiting = 2;
}

// Welcome says the client has its boat; its snapshots follow.
message Welcome {
  // The world's ID.
  string world = 1;
  // The tick of the first frame the boat was in.
  int64 tick = 2;
  // World time when sent: microseconds since the world's epoch.
  int64 world_time_us = 3;
  // The boat's ID.
  uint64 boat = 4;
  // The boat's kind: an index into the catalog's boats.
  uint32 kind = 5;
  // The boat is the one the account already had.
  bool rejoined = 6;
  // The world's epoch, from which world time counts: microseconds of UTC
  // since 1970. The sky is counted from a moment of its own, the same in
  // every world, so the client needs the world's to tell sky time.
  int64 epoch_us = 7;
}

// Pong answers a Ping.
message Pong {
  // The Ping's client_time_us.
  int64 client_time_us = 1;
  // World time when sent: microseconds since the world's epoch.
  int64 world_time_us = 2;
}
