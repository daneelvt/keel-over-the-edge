# SPDX-License-Identifier: AGPL-3.0-only
name: Install from Ubuntu's archive
description: >-
  Runs an install that fetches packages from Ubuntu's archive. The runners'
  Azure mirror sometimes trickles (35 kB/s, once 1.4 kB/s), which ate a
  browser job's 20 minutes before its tests began; an install not done in
  three minutes is stopped, and tried again from archive.ubuntu.com.
inputs:
  command:
    description: The install, run by bash.
    required: true
  working-directory:
    description: Where it runs.
    default: "."
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
      run: |
        if timeout --kill-after=15 180 bash -c "$COMMAND"; then
          exit 0
        fi
        echo "::warning::The install was not done in three minutes: again, from archive.ubuntu.com"
        # apt-get under sudo is in a session of its own, out of timeout's
        # reach: stopped here, so that it lets go of dpkg's lock.
        sudo pkill -TERM -x apt-get || true
        sudo pkill -TERM -f '^/usr/lib/apt/methods/' || true
        for _ in $(seq 30); do
          pgrep -x apt-get >/dev/null || break
          sleep 1
        done
        sudo pkill -KILL -x apt-get || true
        # The runners name their mirrors in apt-mirrors.txt (mirror+file:),
        # Azure's first; some images in the sources themselves.
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          cat /etc/apt/apt-mirrors.txt
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          grep -q . /etc/apt/apt-mirrors.txt || echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
        fi
        sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
          /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
        sudo dpkg --configure -a || true
        sudo apt-get -o DPkg::Lock::Timeout=60 update
        timeout --kill-after=15 300 bash -c "$COMMAND"
