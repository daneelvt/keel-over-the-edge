# SPDX-License-Identifier: AGPL-3.0-only
name: Set up the toolchains
description: Go from go.mod; Node from .nvmrc with npm pinned by client/package.json; client packages installed.
inputs:
  go:
    description: Set up Go.
    default: "true"
  node:
    description: Set up Node and install the client packages.
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - if: inputs.node == 'true'
      name: Use the npm pinned in client/package.json, verified by its hash
      shell: bash
      run: corepack enable npm

    - if: inputs.node == 'true'
      name: Install client packages
      shell: bash
      working-directory: client
      run: |
        npm --version
        npm ci
