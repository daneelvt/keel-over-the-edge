# SPDX-License-Identifier: AGPL-3.0-only
# A new advisory against code already merged is caught weekly, without waiting
# for a pull request; and every decoder of what a client sends is fuzzed for
# longer than a pull request's checks can afford.
name: security

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  security:
    name: security
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: govulncheck
        run: go tool govulncheck ./...
      - name: Registry signatures of client packages
        working-directory: client
        run: npm audit signatures

  # Every fuzz target in the module, found afresh each run so a target
  # added later is fuzzed too, one at a time, a minute each, on x64 (ci.yaml
  # runs a few of them for 30 s on every pull request; their seeds run with
  # every test). A failing input is kept as an artifact: put it in the
  # package's testdata/fuzz/<target>/ to replay it with go test.
  fuzz:
    name: fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Every fuzz target, a minute each
        shell: bash
        run: |
          go test -list '^Fuzz' ./... |
            awk '/^Fuzz/ { names[n++] = $1; next } /^ok/ { for (i = 0; i < n; i++) print $2, names[i]; n = 0 }' > "$RUNNER_TEMP/targets"
          test -s "$RUNNER_TEMP/targets"
          failed=0
          while read -r pkg name; do
            echo "::group::$name ($pkg)"
            if ! go test -run '^$' -fuzz "^${name}\$" -fuzztime 60s "$pkg"; then
              echo "::error::$name ($pkg) failed"
              failed=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/targets"
          exit "$failed"
      - name: Gather the failing inputs
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-failures"
          git ls-files --others --exclude-standard -z -- '*/testdata/fuzz/*' |
            xargs -0 -r cp --parents -t "$RUNNER_TEMP/fuzz-failures"
      - name: The failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore
          retention-days: 30
