# SPDX-License-Identifier: AGPL-3.0-only
# Runs only when a source file, art, or a Go dependency changed.
name: pr.licences

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      licences: ${{ steps.filter.outputs.licences }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            licences:
              - '.github/workflows/pr.licences.yaml'
              - '.github/actions/setup/**'
              - 'go.mod'
              - 'go.sum'
              - '**/*.go'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.html'
              - 'art/**'
              - 'tools/licences/**'

  licences:
    name: licences
    needs: [changes]
    if: needs.changes.outputs.licences == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Licence headers, and licences of Go packages linked into keel
        run: go run ./tools/licences

  pr-licences:
    name: pr-licences
    if: always()
    needs: [changes, licences]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Every job passed, or was skipped as nothing it checks changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended: $r"; exit 1 ;; esac
          done
