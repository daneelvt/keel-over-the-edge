# SPDX-License-Identifier: AGPL-3.0-only
# Runs only when the catalog, its art, its generated files, or code that could
# name a kind, changed.
name: pr.catalog

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # list the pull request's changed files, read whether it is a draft
    outputs:
      catalog: ${{ steps.filter.outputs.catalog }}
    steps:
      # Whether the pull request is a draft now: an event's own flag is as
      # it was when the event was made, and a push just before "ready for
      # review" can arrive after it and cancel the run that was ready.
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: echo "ready=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.draft | not')" >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.ready.outputs.ready == 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            catalog:
              - '.github/workflows/pr.catalog.yaml'
              - '.github/actions/setup/**'
              - '.nvmrc'
              - 'go.mod'
              - 'go.sum'
              - 'client/package.json'
              - 'client/package-lock.json'
              - 'shared/**'
              - 'client/src/catalog/**'
              - 'art/**'
              - 'internal/catalog/**'
              - 'internal/physics/**'
              - 'tools/catalog/**'
              - '**/*.go'
              - '**/*.ts'

  catalog:
    name: catalog
    needs: [changes]
    if: needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Schema, ids, art, generated files current, no ids in code
        run: go run ./tools/catalog -check

  pr-catalog:
    name: pr-catalog
    if: always()
    needs: [changes, catalog]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Every job passed, or was skipped as nothing it checks changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended: $r"; exit 1 ;; esac
          done
