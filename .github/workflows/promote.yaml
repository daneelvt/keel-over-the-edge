# SPDX-License-Identifier: AGPL-3.0-only
# Deploying is tagging: this moves prod, the tag production's Flux follows,
# to a release, once the owner has approved the run (the production
# environment, which only main may use). Before it moves anything it checks
# the release's signature as Flux will, that its commit is on main, and
# that it is not older than what production follows now. Rolling back is
# promoting an older build, with the box ticked to say it is meant.
#
# go run ./tools/release -promote does the work; see its tests for each
# refusal.
name: promote

on:
  workflow_dispatch:
    inputs:
      build:
        description: The build to promote, the first 12 characters of its commit
        required: true
        type: string
      rollback:
        description: A rollback (allow a build older than the one production follows)
        type: boolean
        default: false

permissions: {}

# One change to production at a time, here and in every workflow that
# changes it: a second run waits for the first, which is never cancelled.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  promote:
    name: promote
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write # move the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
          cache: "false"
      - name: Sign in to the registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Check the release, then move the tag production follows
        env:
          BUILD: ${{ inputs.build }}
          ROLLBACK: ${{ inputs.rollback }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$ROLLBACK" = "true" ]; then set -- -rollback; fi
          go run ./tools/release -promote "$BUILD" "$@"
