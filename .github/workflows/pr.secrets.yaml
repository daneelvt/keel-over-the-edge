# SPDX-License-Identifier: AGPL-3.0-only
# Generic secrets in the pull request's commits. GitHub's own scanning covers
# provider patterns; this covers the rest.
name: pr.secrets

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    name: ready
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # read whether the pull request is a draft
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      # Whether the pull request is ready now, and this event is for its
      # head: an event's draft flag is as it was when the event was made,
      # and events can arrive out of order. A push just before "ready for
      # review" can arrive after it and cancel the run that was ready, and
      # a late event for an older commit need not be tested.
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "ready=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '(.draft | not) and .head.sha == env.HEAD')" >> "$GITHUB_OUTPUT"

  pr-secrets:
    name: pr-secrets
    needs: [ready]
    if: needs.ready.outputs.ready == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: gitleaks over the pull request's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: go tool gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
