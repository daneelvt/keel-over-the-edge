# SPDX-License-Identifier: AGPL-3.0-only
# Runs only when a dependency, or Go code govulncheck follows into one,
# changed.
name: pr.dependencies

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dependencies:
              - '.github/workflows/pr.dependencies.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.nvmrc'
              - 'go.mod'
              - 'go.sum'
              - '**/*.go'
              - 'client/package.json'
              - 'client/package-lock.json'

  dependencies:
    name: dependencies
    needs: [changes]
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No new dependency with a known vulnerability
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development
          show-openssf-scorecard: true
          retry-on-snapshot-warnings: true
          comment-summary-in-pr: never
      - uses: ./.github/actions/setup
      - name: govulncheck (vulnerabilities in code the build calls)
        run: go tool govulncheck ./...
      - name: Registry signatures of client packages
        working-directory: client
        run: npm audit signatures

  pr-dependencies:
    name: pr-dependencies
    if: always()
    needs: [changes, dependencies]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Every job passed, or was skipped as nothing it checks changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended: $r"; exit 1 ;; esac
          done
