# SPDX-License-Identifier: AGPL-3.0-only
# Builds and tests the game. The other checks are the pr.*.yaml workflows.
# On a pull request the Go tests run only when Go code or what it reads
# changed, the client's only when the client or what it loads changed, and
# the smoke test when either did; a push to main runs everything.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      client: ${{ github.event_name != 'pull_request' || steps.filter.outputs.client == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '.github/workflows/ci.yaml'
              - '.github/actions/setup/**'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'tools/**'
              - 'shared/**'
            client:
              - '.github/workflows/ci.yaml'
              - '.github/actions/setup/**'
              - '.nvmrc'
              - 'go.mod'
              - 'go.sum'
              - 'client/**'
              - 'art/**'
              - 'internal/catalog/**'
              - 'internal/physics/**'
              - 'tools/internal/**'
              - 'tools/physics/**'
              - 'tools/licences/allowed.txt'

  # The Go tests on both machines the server is built for, so the physics
  # golden tests show amd64 and arm64 agree bit for bit.
  go:
    name: go (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - run: go test -race ./...
      - name: The physics tests again, built for amd64 with fused multiply-add available
        if: runner.arch == 'X64'
        env:
          GOAMD64: v3
        run: go test -count=1 ./internal/physics
      - name: Fuzz the catalog decoder
        if: runner.arch == 'X64'
        run: go test -run '^$' -fuzz FuzzParse -fuzztime 30s ./internal/catalog

  client:
    name: client
    needs: [changes]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the physics module (the WebAssembly golden tests run it)
        run: go run ./tools/physics
      - working-directory: client
        run: npx --no-install vitest run
      - name: Build (checks the licences of bundled packages)
        working-directory: client
        run: npx --no-install vite build
      - name: The size of the first download, against the 4 MB critical set
        working-directory: client
        run: node build/size.ts

  # Starts the server and the client together: after either changed, once
  # whichever ran has passed.
  smoke:
    name: smoke
    needs: [changes, go, client]
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.client == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start everything with the one command, check it over HTTPS
        run: go run ./tools/dev -smoke

  ci:
    name: ci
    if: always()
    needs: [changes, go, client, smoke]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Every job passed, or was skipped as nothing it checks changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended: $r"; exit 1 ;; esac
          done
