# SPDX-License-Identifier: AGPL-3.0-only
# Builds and tests the game. The other checks are the pr.*.yaml workflows.
# On a pull request the Go tests run only when Go code or what it reads
# changed, the client's only when the client or what it loads changed, the
# smoke test when either did, and the image when anything it holds did. On
# a push to main, release.yaml calls this workflow first, and it runs
# everything: a release is built only from a commit that passed.
name: ci

on:
  pull_request:
  workflow_call:

permissions: {}

# A pull request's newer run replaces its older one. Called by a release,
# each run stands alone: the group would otherwise be the caller's, and one
# release's tests would cancel the tests of the release before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      client: ${{ github.event_name != 'pull_request' || steps.filter.outputs.client == 'true' }}
      image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.image == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '.github/workflows/ci.yaml'
              - '.github/actions/setup/**'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'tools/**'
              - 'shared/**'
            client:
              - '.github/workflows/ci.yaml'
              - '.github/actions/setup/**'
              - '.nvmrc'
              - 'go.mod'
              - 'go.sum'
              - 'client/**'
              - 'art/**'
              - 'internal/catalog/**'
              - 'internal/physics/**'
              - 'internal/moderation/testdata/**'
              - 'shared/protocol/**'
              - 'tools/internal/**'
              - 'tools/physics/**'
              - 'tools/licences/allowed.txt'
            image:
              - '.github/workflows/ci.yaml'
              - '.github/actions/check-image/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.nvmrc'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'shared/**'
              - 'client/**'
              - 'art/**'
              - 'tools/internal/**'
              - 'tools/physics/**'
              - 'tools/licences/allowed.txt'

  # The Go tests on both machines the server is built for, so the physics
  # golden tests and the simulation's committed replay show amd64 and arm64
  # agree bit for bit, and the schema's rules hold in the database on both.
  # A test that needs a database fails here rather than skip (CI is set).
  go:
    name: go (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # PostgreSQL for the tests that need a database, on the image and
    # version tools/dev runs locally; the password is the throwaway
    # service's own.
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username keel --dbname keel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      # With the race detector the slowest package takes from five minutes
      # to just under ten on these runners, by the runner it lands on, and
      # ten is Go's own limit for a package: twice that, so a slow runner
      # is not a failed test, nor a release not made.
      - run: go test -race -timeout 20m ./...
      - name: The physics and simulation tests again, built for amd64 with fused multiply-add available
        if: runner.arch == 'X64'
        env:
          GOAMD64: v3
        run: go test -count=1 ./internal/physics ./internal/sim
      - name: The tick and the physics workers, timed (a smoke test; the numbers are in the log)
        run: go test -run '^$' -bench 'Tick|Workers' -benchtime 100x ./internal/sim
      - name: Fuzz the catalog decoder
        if: runner.arch == 'X64'
        run: go test -run '^$' -fuzz FuzzParse -fuzztime 30s ./internal/catalog
      - name: Fuzz the input log's reader
        if: runner.arch == 'X64'
        run: go test -run '^$' -fuzz FuzzRead -fuzztime 30s ./internal/replay
      - name: Fuzz the sailor name check
        if: runner.arch == 'X64'
        run: go test -run '^$' -fuzz FuzzCheckName -fuzztime 30s ./internal/moderation
      - name: Fuzz the decoding of what a game client sends
        if: runner.arch == 'X64'
        run: go test -run '^$' -fuzz FuzzDecodeClient -fuzztime 30s ./internal/protocol
      - name: Fuzz the decoding of the other boats' views
        if: runner.arch == 'X64'
        run: go test -run '^$' -fuzz FuzzApplyEntries -fuzztime 30s ./internal/protocol

  client:
    name: client
    needs: [changes]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the physics module (the WebAssembly golden tests run it)
        run: go run ./tools/physics
      - working-directory: client
        run: npx --no-install vitest run
      - name: Fuzz the page's decoding of the other boats' views
        working-directory: client
        env:
          KEEL_FUZZ_SECONDS: "30"
        run: npx --no-install vitest run src/net/view.fuzz.test.ts
      - name: Build (checks the licences of bundled packages)
        working-directory: client
        run: npx --no-install vite build
      - name: The size of the first download, against the 4 MB critical set
        working-directory: client
        run: node build/size.ts

  # Starts the server and the client together, and the database in a
  # container as on a new computer: after either changed, once whichever ran
  # has passed.
  smoke:
    name: smoke
    needs: [changes, go, client]
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.client == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start everything with the one command, check it over HTTPS
        run: go run ./tools/dev -smoke

  # The game's image, built from the repository alone on each machine it is
  # made for; not pushed. keel is cross-compiled and the page built on the
  # runner's own platform, so each build checks the image runs where it was
  # built. A release builds both in one run, and checks them the same way.
  image:
    name: image (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    needs: [changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker buildx build --provenance=false --sbom=false --build-arg "BUILD=${GITHUB_SHA::12}" --tag keel:ci --load .
      - uses: ./.github/actions/check-image
        with:
          image: keel:ci

  ci:
    name: ci
    if: always()
    needs: [changes, go, client, smoke, image]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Every job passed, or was skipped as nothing it checks changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended: $r"; exit 1 ;; esac
          done
