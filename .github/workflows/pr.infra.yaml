# Runs only when the cluster's manifests, their schemas, k3s's settings, or
# the tools that render, release and apply them changed.
name: pr.infra

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            infra:
              - '.github/workflows/pr.infra.yaml'
              - '.github/actions/setup/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/release.yaml'
              - 'renovate.json'
              - 'infra/**'
              - 'tools/cluster/**'
              - 'tools/release/**'
              - 'tools/internal/**'

  infra:
    name: infra
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Every entry point of both clusters renders, keeps the rules and passes kubeconform; no Secret under infra/; a release's and the local cluster's steps against fakes
        run: go test -count=1 ./tools/cluster ./tools/release ./tools/internal/manifests ./tools/internal/pinned

  pr-infra:
    name: pr-infra
    if: always()
    needs: [changes, infra]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Every job passed, or was skipped as nothing it checks changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended: $r"; exit 1 ;; esac
          done
