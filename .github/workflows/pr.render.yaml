# SPDX-License-Identifier: AGPL-3.0-only
# The game in a real browser, the merge-blocking suite: Playwright on
# Chromium. Two kinds of test, each run only when a file it depends on
# changed:
#
# - the page's (page and page-serial in playwright.config.ts): keel, the
#   account and the screen's words, against keel (tools/e2e builds it) and
#   a PostgreSQL service, on pages that draw nothing (?draw=off), three at a
#   time, then the tests that change the shared world one at a time; and
#   the net worker's upgrade, the passkeys and the screen's layout on
#   WebKit;
# - the scene's (webgl2 and webgpu): the sea, the sky, the land and their
#   pictures on the offline sandbox, on the WebGL 2 back end, drawn on
#   Mesa's lavapipe, and on WebGPU, drawn on SwiftShader (client/e2e/gpu.ts;
#   a step checks each draws there first), split over runners by spec file.
#
# No test is retried: a test that fails here is a fault, in the test or the
# game. The tests tagged @long or @nightly, the compatibility-mode device,
# the real TCP loss and five runs of this suite run every night on main
# instead (render-nightly.yaml), and on a pull request labelled render.
# Each job writes its runner's CPU and speed, its tests' outcomes, its
# slowest tests and each file's time to its summary on the run's page
# (e2e/runner.ts, e2e/summary.ts).
name: pr.render

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What each kind of test depends on (tools/e2e/filters_test.go checks the
  # two together cover what either can read). The page's: keel, and the
  # client but the parts that only draw. The scene's: the client but keel's
  # own pages, its art, the physics module, the catalog and seed 1's world.
  # The toolchains, the tests and this file: both. A new folder under
  # client/src is both kinds', unless it only draws or only keel's pages use
  # it.
  changes:
    name: changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      page: ${{ steps.both.outputs.page == 'true' || steps.client.outputs.page == 'true' }}
      scene: ${{ steps.both.outputs.scene == 'true' || steps.client.outputs.scene == 'true' }}
    steps:
      - id: both
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            common: &common
              - '.github/workflows/pr.render.yaml'
              - '.github/actions/setup/**'
              - '.nvmrc'
              - 'go.mod'
              - 'go.sum'
              - 'client/*'
              - 'client/build/**'
              - 'client/e2e/**'
              - 'client/src/*'
              - 'art/**'
              - 'shared/**'
              - 'internal/catalog/**'
              - 'internal/physics/**'
              - 'internal/sky/**'
              - 'tools/dev/**'
              - 'tools/internal/**'
              - 'tools/physics/**'
              - 'tools/licences/allowed.txt'
            page:
              - *common
              - 'cmd/**'
              - 'internal/**'
              - 'tools/e2e/**'
              - 'client/approve/**'
            scene:
              - *common
              - 'internal/worldgen/**'
              - 'internal/chart/**'
      # Within client/src, folder by folder.
      - id: client
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            page:
              - 'client/src/*/**'
              - '!client/src/{ocean,sky,land,edge,lights,sandbox}/**'
            scene:
              - 'client/src/*/**'
              - '!client/src/{owner,account,net}/**'

  page:
    name: browser (the page, no drawing)
    needs: [changes]
    if: needs.changes.outputs.page == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    # PostgreSQL for keel, on the image and version tools/dev runs locally;
    # the password is the throwaway service's own.
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username keel --dbname keel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The runner's CPU and speed, on the job's summary
        working-directory: client
        shell: bash
        run: node e2e/runner.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the physics module (the game's page steps it)
        run: go run ./tools/physics
      - name: Seed 1's world, for its chart (discover.spec.ts)
        run: go run ./tools/dev -world 1
      - name: Chromium's headless shell for Playwright
        working-directory: client
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: The page's tests, three at a time, then those that change the world
        working-directory: client
        # Apart, not page-serial with its dependency: Playwright filters no
        # dependency by --grep, and skips the dependent if it fails.
        shell: bash
        run: |
          status=0
          # Each its own results and report, which the other would clear.
          SUMMARY_TITLE="browser (the page, no drawing)" PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/page \
            npx --no-install playwright test --project page --grep-invert '@long|@nightly' \
            --output test-results/page || status=$?
          SUMMARY_TITLE="browser (the page, the tests that change the world)" PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/page-serial \
            npx --no-install playwright test --project page-serial --no-deps --grep-invert '@long|@nightly' \
            --output test-results/page-serial || status=$?
          exit "$status"
      - name: The traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-page
          path: |
            client/test-results
            client/playwright-report
          retention-days: 14

  scene:
    name: browser (${{ matrix.project }}, the scene, ${{ matrix.shard }} of ${{ matrix.shards }})
    needs: [changes]
    if: needs.changes.outputs.scene == 'true'
    strategy:
      fail-fast: false
      # Split over runners by spec file: the files of each shard but the
      # last are named in playwright.config.ts, chosen by the files'
      # measured times (each job's summary lists them), and the last shard
      # runs every other scene file, so a new file always runs.
      matrix:
        include:
          - { project: webgl2, shard: 1, shards: 3 }
          - { project: webgl2, shard: 2, shards: 3 }
          - { project: webgl2, shard: 3, shards: 3 }
          - { project: webgpu, shard: 1, shards: 6 }
          - { project: webgpu, shard: 2, shards: 6 }
          - { project: webgpu, shard: 3, shards: 6 }
          - { project: webgpu, shard: 4, shards: 6 }
          - { project: webgpu, shard: 5, shards: 6 }
          - { project: webgpu, shard: 6, shards: 6 }
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    # PostgreSQL for keel, which Playwright starts for every project; the
    # scene's tests do not use it.
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username keel --dbname keel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The runner's CPU and speed, on the job's summary
        working-directory: client
        shell: bash
        run: node e2e/runner.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the physics module (the sandbox steps it)
        run: go run ./tools/physics
      - name: Seed 1's world, for the sandbox's land (land.spec.ts)
        run: go run ./tools/dev -world 1
      - name: Chromium's headless shell for Playwright
        working-directory: client
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Mesa's lavapipe, the CPU's Vulkan, for WebGL 2 (e2e/gpu.ts)
        run: sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: The page draws on lavapipe (WebGL 2) and SwiftShader (WebGPU)
        working-directory: client
        # bash as named, so that the pipe fails when the check does.
        shell: bash
        run: node e2e/gpu.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The scene on ${{ matrix.project }}, part ${{ matrix.shard }} of ${{ matrix.shards }}
        working-directory: client
        env:
          SUMMARY_TITLE: browser (${{ matrix.project }}, the scene, ${{ matrix.shard }} of ${{ matrix.shards }})
          PROJECT: ${{ matrix.project }}
          # playwright.config.ts reads these, with PROJECT, for the files
          # this shard runs.
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: npx --no-install playwright test --project "$PROJECT" --grep-invert '@long|@nightly'
      - name: The pictures and traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.project }}-scene-${{ matrix.shard }}
          path: |
            client/test-results
            client/playwright-report
          retention-days: 14

  webkit:
    name: browser (webkit, the net worker)
    needs: [changes]
    if: needs.changes.outputs.page == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username keel --dbname keel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The runner's CPU and speed, on the job's summary
        working-directory: client
        shell: bash
        run: node e2e/runner.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the physics module (the game's page steps it)
        run: go run ./tools/physics
      - name: Seed 1's world, for the sandbox's harbour (layout.spec.ts)
        run: go run ./tools/dev -world 1
      - name: WebKit for Playwright
        working-directory: client
        run: npx --no-install playwright install --with-deps webkit
      - name: The net worker's upgrade, the account's passkeys and the screen's layout on WebKit
        working-directory: client
        env:
          SUMMARY_TITLE: browser (webkit)
        run: npx --no-install playwright test --project webkit --grep-invert '@long|@nightly'
      - name: The pictures and traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-webkit
          path: |
            client/test-results
            client/playwright-report
          retention-days: 14

  pr-render:
    name: pr-render
    if: always()
    needs: [changes, page, scene, webkit]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Every job passed, or was skipped as nothing it checks changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended: $r"; exit 1 ;; esac
          done
