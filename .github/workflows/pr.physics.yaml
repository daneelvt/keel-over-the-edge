# SPDX-License-Identifier: AGPL-3.0-only
# Runs only when the physics, the simulation, their tools or what they build
# changed.
name: pr.physics

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # list the pull request's changed files, read whether it is a draft
    outputs:
      physics: ${{ steps.filter.outputs.physics }}
    steps:
      # Whether the pull request is ready now, and this event is for its
      # head: an event's draft flag is as it was when the event was made,
      # and events can arrive out of order. A push just before "ready for
      # review" can arrive after it and cancel the run that was ready, and
      # a late event for an older commit need not be tested.
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "ready=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '(.draft | not) and .head.sha == env.HEAD')" >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.ready.outputs.ready == 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            physics:
              - '.github/workflows/pr.physics.yaml'
              - '.github/actions/setup/**'
              - '.nvmrc'
              - 'go.mod'
              - 'go.sum'
              - 'client/package.json'
              - 'client/package-lock.json'
              - 'client/src/predict/**'
              - 'internal/physics/**'
              - 'internal/sky/**'
              - 'internal/catalog/**'
              - 'internal/sim/**'
              - 'internal/bus/**'
              - 'internal/worldgen/**'
              - 'internal/life/**'
              - 'tools/internal/**'
              - 'tools/physics/**'
              - 'tools/polar/**'

  physics:
    name: physics
    needs: [changes]
    if: needs.changes.outputs.physics == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Rules of the physics package and the world generator, no fused multiply-add in them or the simulation, layout files current, no allocations, size budget
        run: go run ./tools/physics -check
      - name: The polar against the boats' measured data
        run: go run ./tools/polar -check
      - name: The trimmed sail against ORC's mainsail
        run: go run ./tools/polar -sail
      - name: The polar in a breeze's sea and in a gale's, beside flat water
        run: |
          go run ./tools/polar -sea 12
          go run ./tools/polar -sea 34

  pr-physics:
    name: pr-physics
    if: always()
    needs: [changes, physics]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Every job passed, or was skipped as nothing it checks changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended: $r"; exit 1 ;; esac
          done
