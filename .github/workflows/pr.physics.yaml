# SPDX-License-Identifier: AGPL-3.0-only
name: pr.physics

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-physics:
    name: pr-physics
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Rules of the physics package, no fused multiply-add, layout files current, no allocations, size budget
        run: go run ./tools/physics -check
      - name: The polar against the boats' measured data
        run: go run ./tools/polar -check
      - name: The trimmed sail against ORC's mainsail
        run: go run ./tools/polar -sail
