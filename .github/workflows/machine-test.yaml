# SPDX-License-Identifier: AGPL-3.0-only
# The whole playbook on a fresh Ubuntu 26.04 runner, the machine's own
# system, as root, twice: the second run must change nothing. Then
# verify.yaml checks the runner as the machine would be checked, with Flux
# following the real prod; then Lynis, and kube-bench as a report.
#
# It takes minutes, so it is not run on every pull request: on one
# labelled machine (again on each push while the label stays), and by
# hand. pr.machine runs the fast checks on every one. A pull request has
# no access to the tailnet or Infisical, so the join is left out and the
# cluster's credential is made up; the runner's image, far larger than the
# machine's, gets no AIDE record.
name: machine-test

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playbook:
    name: playbook
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'machine'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      # Built once, before the playbook mounts /tmp with nothing to run.
      - name: Build the tool
        run: go build -o .dev/bin/machine ./tools/machine
      - name: Ansible, from hashed requirements
        run: .dev/bin/machine -ansible
      - name: DEBUG state.yaml as the tool runs it
        working-directory: infra/ansible
        run: |
          AP=$(realpath ../../.dev/ansible/bin/ansible-playbook)
          python3 - "$AP" <<'PY'
          import subprocess as s, sys, os
          cmd=["sudo","env","ANSIBLE_CONFIG="+os.getcwd()+"/ansible.cfg","ANSIBLE_NOCOLOR=1","ANSIBLE_FORCE_COLOR=0",sys.argv[1],"state.yaml","--inventory","inventory/runner.yaml"]
          r=s.run(cmd,stdout=s.PIPE,stderr=s.PIPE,stdin=s.DEVNULL)
          print("py separate", r.returncode, len(r.stdout), len(r.stderr), r.stdout[-300:], r.stderr[-300:])
          PY
          mkdir -p /tmp/h && cat > /tmp/h/main.go <<'GO'
          package main

          import (
          	"bytes"
          	"fmt"
          	"io"
          	"os"
          	"os/exec"
          	"strings"
          )

          func main() {
          	x := exec.Command("sudo", "env", "ANSIBLE_CONFIG="+os.Args[2]+"/ansible.cfg", "ANSIBLE_NOCOLOR=1", "ANSIBLE_FORCE_COLOR=0", os.Args[1], "state.yaml", "--inventory", "inventory/runner.yaml")
          	x.Dir = os.Args[2]
          	x.Env = os.Environ()
          	var log bytes.Buffer
          	var stdout strings.Builder
          	x.Stdout = io.MultiWriter(&log, &stdout)
          	x.Stderr = &log
          	err := x.Run()
          	fmt.Printf("go: err=%v log=%d stdout=%d\n%s\n", err, log.Len(), stdout.Len(), log.String())
          }
          GO
          (cd /tmp/h && go mod init h >/dev/null 2>&1; go run . "$AP" "$PWD") || true
          env | grep -iE '^(ANSIBLE|PY|LC_|LANG|TERM|CI)' | sort
        continue-on-error: true
      - name: The playbook on this runner, the first time
        run: .dev/bin/machine -run apply -local
      - name: The playbook again, which must change nothing
        run: .dev/bin/machine -run apply -local -unchanged
      - name: The runner is as the playbook leaves it; Flux follows the real prod
        run: .dev/bin/machine -verify -local
      - name: Lynis, with no warning not accepted; kube-bench, a report
        run: .dev/bin/machine -audit -local
