# Workflows checked for mistakes (actionlint) and for security (zizmor). zizmor
# reports to code scanning; the main ruleset blocks merging on its findings.
name: pr.actions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    name: ready
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read # read whether the pull request is a draft
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      # Whether the pull request is a draft now: an event's own flag is as
      # it was when the event was made, and a push just before "ready for
      # review" can arrive after it and cancel the run that was ready.
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: echo "ready=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.draft | not')" >> "$GITHUB_OUTPUT"

  pr-actions:
    name: pr-actions
    needs: [ready]
    if: needs.ready.outputs.ready == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: actionlint
        run: go tool actionlint
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: auditor
