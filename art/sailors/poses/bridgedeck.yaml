#
# The cruising catamaran's people: the clips her helm stands at her raised
# wheel in and sits behind it in, on the settle; her company sits in beside
# the helm, round her table, on her aft bench and on her lounger, walks her
# cockpit and climbs her helm's ladder in (written to
# <version>.bridgedeck.glb, which only a boat whose kind names it loads).
#
# Each is placed from her place it is made at (stage.Bridgedeck, from her
# model's nodes): at the wheel and sat at it, from the helm's stance; on a
# seat, from its front edge where the clip is made; on the ladder, from its
# foot; walking, from where her sole is walked. Her places are hers alone:
# a clip's -port is at the same place, the figure its own mirror image (the
# wind over her port side).
poses:
  # The helm sat on the settle behind her wheel, facing forward, the feet
  # on the platform before it; sitting up, the hands on the thighs; looking
  # forward over the roof. (The settle is aft of where the helm stands, the
  # wheel beyond a hand's reach from it.) The coat's skirts as seated: the
  # front over the thighs, the sides laid on the settle, the back down
  # behind.
  bridge-seated:
    place: bridge-wheel-seat
    shift: [0.0, 0.0, 0.015]
    turn:
      - [thigh_l, x, -82]
      - [thigh_r, x, -80]
      - [thigh_l, z, 6]
      - [thigh_r, z, -8]
      - [calf_l, x, 74]
      - [calf_r, x, 70]
      - [spine_01, x, 2]
      - [spine_02, x, 1]
      - [neck_01, x, -2]
      - [head, x, -2]
      - [skirt_front_l_01, x, -80]
      - [skirt_front_r_01, x, -80]
      - [skirt_side_l_01, y, 80]
      - [skirt_side_r_01, y, -80]
      - [skirt_back_l_01, x, 75]
      - [skirt_back_r_01, x, 75]
    ik:
      hand_r: { at: bone, bone: thigh_r, offset: [-0.03, -0.12, -0.2], pole: [-0.5, 0.3, -0.3] }
      hand_l: { at: bone, bone: thigh_l, offset: [0.03, -0.12, -0.2], pole: [0.5, 0.3, -0.3] }
      foot_l: { at: bridge-wheel-floor, offset: [0.36, 0.14, 0.1], pole: [0.1, -0.5, 0.6] }
      foot_r: { at: bridge-wheel-floor, offset: [0.4, -0.16, 0.1], pole: [-0.1, -0.5, 0.6] }

  # Looking up at the main's luff, and over the shoulder to windward.
  bridge-seated-aloft:
    from: bridge-seated
    turn:
      - [spine_03, x, -3]
      - [neck_01, x, -10]
      - [head, x, -18]
      - [neck_01, z, -4]
      - [head, z, -8]

  bridge-seated-windward:
    from: bridge-seated
    turn:
      - [spine_03, z, -5]
      - [neck_01, z, -14]
      - [head, z, -28]

  # Sat on the bench round her table facing it, braced as she pitches: on
  # the seat's front, leaning forward, the right hand gripping the table's
  # edge, the left on its thigh, the feet set wide on the sole; looking
  # across the table and out to sea. The coat's skirts as seated.
  table-brace:
    place: bridge-table
    shift: [0.1, 0.0, 0.008]
    turn:
      - [thigh_l, x, -80]
      - [thigh_r, x, -78]
      - [thigh_l, z, 10]
      - [thigh_r, z, -12]
      - [calf_l, x, 72]
      - [calf_r, x, 68]
      - [spine_01, x, 16]
      - [spine_02, x, 14]
      - [spine_03, x, 10]
      - [neck_01, x, -14]
      - [head, x, -14]
      - [skirt_front_l_01, x, -78]
      - [skirt_front_r_01, x, -78]
      - [skirt_side_l_01, y, 80]
      - [skirt_side_r_01, y, -80]
      - [skirt_back_l_01, x, 82]
      - [skirt_back_r_01, x, 82]
    ik:
      hand_r: { at: bridge-table-top, offset: [-0.04, -0.16, 0.04], pole: [-0.6, 0.3, -0.4] }
      hand_l: { at: bone, bone: thigh_l, offset: [0.03, -0.12, -0.22], pole: [0.5, 0.3, -0.3] }
      foot_l: { at: bridge-table-floor, offset: [0.36, 0.2, 0.1], pole: [0.1, -0.5, 0.6] }
      foot_r: { at: bridge-table-floor, offset: [0.3, -0.22, 0.1], pole: [-0.1, -0.5, 0.6] }

  table-brace-across:
    from: table-brace
    turn:
      - [neck_01, z, 8]
      - [head, z, 16]
      - [head, x, -4]

  table-brace-sea:
    from: table-brace
    turn:
      - [neck_01, z, -16]
      - [head, z, -30]
      - [head, x, -6]

  # Sat on the aft bench facing forward, braced: sitting back toward its
  # rail, the left leg straightened, its foot braced further out on the
  # sole, the right foot drawn in; the hands on the thighs; looking forward
  # over the table. The coat's skirts as seated.
  beam-brace:
    place: bridge-beam
    shift: [0.02, 0.0, 0.012]
    turn:
      - [thigh_l, x, -80]
      - [thigh_r, x, -80]
      - [thigh_l, z, 6]
      - [thigh_r, z, -8]
      - [calf_l, x, 56]
      - [calf_r, x, 78]
      - [spine_01, x, -2]
      - [spine_02, x, -1]
      - [neck_01, x, 4]
      - [head, x, 3]
      - [skirt_front_l_01, x, -72]
      - [skirt_front_r_01, x, -78]
      - [skirt_side_l_01, y, 80]
      - [skirt_side_r_01, y, -80]
      - [skirt_back_l_01, x, 70]
      - [skirt_back_r_01, x, 70]
    ik:
      hand_l: { at: bone, bone: thigh_l, offset: [0.03, -0.12, -0.14], pole: [0.5, 0.3, -0.3] }
      hand_r: { at: bone, bone: thigh_r, offset: [-0.03, -0.12, -0.12], pole: [-0.5, 0.3, -0.3] }
      foot_l: { at: bridge-beam-floor, offset: [0.33, 0.16, 0.12], pole: [0.1, -0.5, 0.6] }
      foot_r: { at: bridge-beam-floor, offset: [0.2, -0.16, 0.1], pole: [-0.1, -0.5, 0.6] }

  beam-brace-aloft:
    from: beam-brace
    turn:
      - [neck_01, x, -10]
      - [head, x, -16]
      - [neck_01, z, 4]
      - [head, z, 8]

  beam-brace-sea:
    from: beam-brace
    turn:
      - [neck_01, z, -14]
      - [head, z, -28]

  # Up her helm's ladder facing up it, from its foot on the sole to its
  # landing, a tread a step, the left foot first (the body moved up and
  # along by each key's shift, as high over the lower foot's tread as the
  # leg on it reaches), the foot to step next up on its toes; the hands at
  # the hips, clear of its rail and the settle beside it. The ankles a
  # little aft of each tread's middle, the toes short of its nosing.
  stairs-foot:
    place: bridge-stairs
    shift: [0.0, 0.0, -0.04]
    turn:
      - [spine_01, x, 6]
      - [spine_02, x, 3]
      - [neck_01, x, 6]
      - [head, x, 10]
    ik:
      hand_l: { at: bone, bone: pelvis, offset: [0.23, -0.02, 0.04] }
      hand_r: { at: bone, bone: pelvis, offset: [-0.23, -0.02, 0.04] }
      foot_l: { at: bridge-stairs, offset: [0.0, 0.1, 0.1] }
      foot_r: { at: bridge-stairs, offset: [0.0, -0.1, 0.1] }
  stairs-1:
    place: bridge-stairs
    shift: [0.18, 0.0, -0.08]
    turn:
      - [spine_01, x, 6]
      - [spine_02, x, 3]
      - [neck_01, x, 6]
      - [head, x, 10]
    ik:
      hand_l: { at: bone, bone: pelvis, offset: [0.23, -0.02, 0.04] }
      hand_r: { at: bone, bone: pelvis, offset: [-0.23, -0.02, 0.04] }
      foot_l: { at: bridge-tread-1, offset: [-0.08, 0.1, 0.1] }
      foot_r: { at: bridge-stairs, offset: [0.0, -0.1, 0.13] }
  stairs-2:
    place: bridge-stairs
    shift: [0.5, 0.0, 0.17]
    turn:
      - [spine_01, x, 6]
      - [spine_02, x, 3]
      - [neck_01, x, 6]
      - [head, x, 10]
    ik:
      hand_l: { at: bone, bone: pelvis, offset: [0.23, -0.02, 0.04] }
      hand_r: { at: bone, bone: pelvis, offset: [-0.23, -0.02, 0.04] }
      foot_l: { at: bridge-tread-1, offset: [-0.08, 0.1, 0.15] }
      foot_r: { at: bridge-tread-2, offset: [-0.08, -0.1, 0.1] }
  stairs-3:
    place: bridge-stairs
    shift: [0.75, 0.0, 0.37]
    turn:
      - [spine_01, x, 6]
      - [spine_02, x, 3]
      - [neck_01, x, 6]
      - [head, x, 10]
    ik:
      hand_l: { at: bone, bone: pelvis, offset: [0.23, -0.02, 0.04] }
      hand_r: { at: bone, bone: pelvis, offset: [-0.23, -0.02, 0.04] }
      foot_l: { at: bridge-tread-3, offset: [-0.08, 0.1, 0.1] }
      foot_r: { at: bridge-tread-2, offset: [-0.08, -0.1, 0.15] }
  stairs-4:
    place: bridge-stairs
    shift: [1.0, 0.0, 0.57]
    turn:
      - [spine_01, x, 6]
      - [spine_02, x, 3]
      - [neck_01, x, 6]
      - [head, x, 10]
    ik:
      hand_l: { at: bone, bone: pelvis, offset: [0.23, -0.02, 0.04] }
      hand_r: { at: bone, bone: pelvis, offset: [-0.23, -0.02, 0.04] }
      foot_l: { at: bridge-tread-3, offset: [-0.08, 0.1, 0.15] }
      foot_r: { at: bridge-tread-4, offset: [-0.08, -0.1, 0.1] }
  stairs-5:
    place: bridge-stairs
    shift: [1.23, 0.03, 0.77]
    turn:
      - [spine_01, x, 6]
      - [spine_02, x, 3]
      - [neck_01, x, 6]
      - [head, x, 10]
    ik:
      hand_l: { at: bone, bone: pelvis, offset: [0.23, -0.02, 0.04] }
      hand_r: { at: bone, bone: pelvis, offset: [-0.23, -0.02, 0.04] }
      foot_l: { at: bridge-landing, offset: [-0.1, 0.1, 0.1] }
      foot_r: { at: bridge-tread-4, offset: [-0.08, -0.1, 0.15] }
  stairs-top:
    place: bridge-stairs
    shift: [1.43, 0.04, 0.97]
    turn:
      - [spine_01, x, 6]
      - [spine_02, x, 3]
      - [neck_01, x, 6]
      - [head, x, 10]
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.23, -0.02, 0.04] }
      hand_l: { at: bone, bone: pelvis, offset: [0.23, -0.02, 0.04] }
      foot_l: { at: bridge-landing, offset: [0.0, 0.1, 0.1] }
      foot_r: { at: bridge-landing, offset: [0.0, -0.1, 0.1] }

  # Down it facing aft, from its landing to its foot, the right foot first,
  # the foot to step next down on its toes.
  down-landing:
    place: bridge-landing
    shift: [0.0, 0.0, -0.04]
    turn:
      - [spine_01, x, 3]
      - [neck_01, x, 10]
      - [head, x, 14]
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.2, 0.02, 0.04] }
      hand_l: { at: bone, bone: pelvis, offset: [0.2, 0.02, 0.04] }
      foot_l: { at: bridge-landing, offset: [0.0, 0.1, 0.1] }
      foot_r: { at: bridge-landing, offset: [0.0, -0.1, 0.1] }
  down-1:
    place: bridge-landing
    shift: [0.2, 0.0, -0.23]
    turn:
      - [spine_01, x, 3]
      - [neck_01, x, 10]
      - [head, x, 14]
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.2, 0.02, 0.04] }
      hand_l: { at: bone, bone: pelvis, offset: [0.2, 0.02, 0.04] }
      foot_l: { at: bridge-landing, offset: [0.0, 0.1, 0.15] }
      foot_r: { at: bridge-tread-4, offset: [0.06, -0.1, 0.1] }
  down-2:
    place: bridge-landing
    shift: [0.45, 0.03, -0.395]
    turn:
      - [spine_01, x, 3]
      - [neck_01, x, 10]
      - [head, x, 14]
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.2, 0.02, 0.04] }
      hand_l: { at: bone, bone: pelvis, offset: [0.2, 0.02, 0.04] }
      foot_l: { at: bridge-tread-3, offset: [0.06, 0.1, 0.1] }
      foot_r: { at: bridge-tread-4, offset: [0.06, -0.1, 0.15] }
  down-3:
    place: bridge-landing
    shift: [0.7, 0.03, -0.63]
    turn:
      - [spine_01, x, 3]
      - [neck_01, x, 10]
      - [head, x, 14]
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.2, 0.02, 0.04] }
      hand_l: { at: bone, bone: pelvis, offset: [0.2, 0.02, 0.04] }
      foot_l: { at: bridge-tread-3, offset: [0.06, 0.1, 0.15] }
      foot_r: { at: bridge-tread-2, offset: [0.06, -0.1, 0.1] }
  down-4:
