#    (helm-seat), on the bench round her table (table-), on her aft bench
#    (beam-) and on her lounger (lounger-). Each placed from its seat's
#    front edge where it is made;
#  - walking her cockpit facing forward, set on her sole, a foot that bears
#    moving back at the walk's speed; and turning on the spot to the left
