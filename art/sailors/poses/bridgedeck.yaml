      - [head, x, 14]
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.2, 0.02, 0.04] }
      hand_l: { at: bone, bone: pelvis, offset: [0.2, 0.02, 0.04] }
      foot_l: { at: bridge-tread-1, offset: [0.06, 0.1, 0.1] }
      foot_r: { at: bridge-tread-2, offset: [0.06, -0.1, 0.15] }
  down-5:
    place: bridge-landing
    shift: [1.28, 0.03, -1.06]
    turn:
      - [spine_01, x, 3]
      - [neck_01, x, 10]
      - [head, x, 14]
    ik:
      hand_l: { at: bone, bone: pelvis, offset: [0.2, 0.02, 0.04] }
      hand_r: { at: bone, bone: pelvis, offset: [-0.2, 0.02, 0.04] }
      foot_l: { at: bridge-tread-1, offset: [0.06, 0.1, 0.15] }
      foot_r: { at: bridge-stairs, offset: [-0.13, -0.1, 0.1] }
  down-foot:
    place: bridge-landing
    shift: [1.3, 0.04, -1.04]
    turn:
      - [spine_01, x, 3]
      - [neck_01, x, 10]
      - [head, x, 14]
    ik:
      hand_l: { at: bone, bone: pelvis, offset: [0.2, 0.02, 0.04] }
      hand_r: { at: bone, bone: pelvis, offset: [-0.2, 0.02, 0.04] }
      foot_l: { at: bridge-stairs, offset: [-0.1, 0.1, 0.1] }
      foot_r: { at: bridge-stairs, offset: [-0.1, -0.1, 0.1] }

clips:
  # The helm standing at her wheel, the hands on its rim: the wheel's clip
  # made at her wheel. Its -port for the wind over her port side.
  bridge-wheel:
    of: helm-wheel
    restage: bridgedeck
    group: bridgedeck

  # The look's habit at her wheel (each look's own, named so by it).
  bridge-habit-wheel:
    of: habit-wheel
    restage: bridgedeck
    group: bridgedeck

  # The helm sat on the settle behind her wheel: looking forward, at the
  # luff, forward and to windward. Placed from the stance,
  # as bridge-wheel is.
  bridge-wheel-seated:
    loop: true
    idle: true
    sides: true
    group: bridgedeck
    keys:
      - { pose: bridge-seated, hold: 1.4, ramp: 1.5, lead: head }
      - { pose: bridge-seated-aloft, hold: 1.4, ramp: 1.4, lead: head, anticipate: 0.05 }
      - { pose: bridge-seated, hold: 1.0, ramp: 1.4, lead: head }
      - { pose: bridge-seated-windward, hold: 1.2, ramp: 1.3, lead: head, anticipate: 0.05 }

  # Braced round her table and on her aft bench, as she pitches in a
  # breeze; their -port the same seat, braced the other way. The game
  # blends each seat's idles into them by the wind and her motion.
  table-braced:
    loop: true
    idle: true
    sides: true
    group: bridgedeck
    keys:
      - { pose: table-brace, hold: 1.6, ramp: 1.5, lead: head }
      - { pose: table-brace-across, hold: 1.4, ramp: 1.3, lead: head, anticipate: 0.05 }
      - { pose: table-brace, hold: 1.2, ramp: 1.5, lead: head }
      - { pose: table-brace-sea, hold: 1.2, ramp: 1.4, lead: head, anticipate: 0.05 }

  beam-braced:
    loop: true
    idle: true
    sides: true
    group: bridgedeck
    keys:
      - { pose: beam-brace, hold: 1.6, ramp: 1.5, lead: head }
      - { pose: beam-brace-aloft, hold: 1.4, ramp: 1.3, lead: head, anticipate: 0.05 }
      - { pose: beam-brace, hold: 1.2, ramp: 1.5, lead: head }
      - { pose: beam-brace-sea, hold: 1.2, ramp: 1.4, lead: head, anticipate: 0.05 }

  # Up her helm's ladder from its foot to its landing, and down it from its
  # landing to its foot: placed from its foot (up) and its landing (down),
  # once through, the body carried up or down it.
  stairs-up:
    group: bridgedeck
    # The ankles near the ends of their ranges, as on any steep stair; a
    # coat's front falling from the knee as it rises, not held out over the
    # treads above.
    strain: [foot]
    hang: { front_02: 1.0 }
    keys:
      - { pose: stairs-foot, hold: 0.25 }
      - { pose: stairs-1, hold: 0.0, ramp: 0.6, step: 0.16 }
      - { pose: stairs-2, hold: 0.0, ramp: 0.55, step: 0.16 }
      - { pose: stairs-3, hold: 0.0, ramp: 0.55, step: 0.16 }
      - { pose: stairs-4, hold: 0.0, ramp: 0.55, step: 0.16 }
      - { pose: stairs-5, hold: 0.0, ramp: 0.55, step: 0.16 }
      - { pose: stairs-top, hold: 0.3, ramp: 0.6, step: 0.1 }

  stairs-down:
    group: bridgedeck
    strain: [foot]
    hang: { front_02: 1.0 }
    keys:
      - { pose: down-landing, hold: 0.25 }
      - { pose: down-1, hold: 0.0, ramp: 0.6, step: 0.16 }
      - { pose: down-2, hold: 0.0, ramp: 0.55, step: 0.16 }
      - { pose: down-3, hold: 0.0, ramp: 0.55, step: 0.16 }
      - { pose: down-4, hold: 0.0, ramp: 0.55, step: 0.16 }
      - { pose: down-5, hold: 0.0, ramp: 0.55, step: 0.16 }
      - { pose: down-foot, hold: 0.3, ramp: 0.6, step: 0.16 }

