#
# The machines' habit: at the helm, the sensor discs at its ears turned
# back to the wind, which comes over the side deck it sits on, behind it;
# the head following them round in small steps, held, and back. Its other
# clips are every sailor's (sailing.yaml). The discs turn on the lower
# lids' joints, which a machine places at its ears.
poses:
  machine-listen:
    from: helm-seated
    turn:
      - [lid_lower_l, z, 50]
      - [lid_lower_r, z, -50]
      - [head, x, -3]

  machine-turn-1:
    from: machine-listen
    turn:
      - [neck_01, z, 4]
      - [head, z, 9]

  machine-turn-2:
    from: machine-listen
    turn:
      - [neck_01, z, 8]
      - [head, z, 19]

  machine-turn-3:
    from: machine-listen
    turn:
      - [neck_01, z, 13]
      - [head, z, 30]
      - [head, x, 4]

  # Standing: the hands at the sides, the same steps.
  machine-stand:
    from: stand
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.24, -0.02, -0.16], pole: [-0.8, 0.2, 0.0] }

  machine-stand-listen:
    from: machine-stand
    turn:
      - [lid_lower_l, z, 50]
      - [lid_lower_r, z, -50]
      - [head, x, -3]

  machine-stand-turn-1:
    from: machine-stand-listen
    turn:
      - [neck_01, z, 5]
      - [head, z, 10]

  machine-stand-turn-2:
    from: machine-stand-listen
    turn:
      - [neck_01, z, 10]
      - [head, z, 22]

  # At the wheel, both hands on its spokes: the same steps.
  machine-wheel-listen:
    from: wheel-stand
    turn:
      - [lid_lower_l, z, 50]
      - [lid_lower_r, z, -50]
      - [head, x, -3]

  machine-wheel-turn-1:
    from: machine-wheel-listen
    turn:
      - [neck_01, z, -5]
      - [head, z, -10]

  machine-wheel-turn-2:
    from: machine-wheel-listen
    turn:
      - [neck_01, z, -10]
      - [head, z, -22]

  # Sat by a cruising yacht's wheel, a little further aft, the hand on the
  # rim's aft side: the long coat's skirts on the inboard side clear of the
  # wheel's spokes.
  machine-yacht-seated:
    from: yacht-seated
    shift: [-0.04, 0.0, 0.0]
    ik:
      hand_l: { at: yacht-seat, offset: [-0.1, -0.02, 0.0], pole: [0.6, 0.2, -0.3] }
  machine-yacht-seated-aloft:
    from: yacht-seated-aloft
    shift: [-0.04, 0.0, 0.0]
    ik:
      hand_l: { at: yacht-seat, offset: [-0.1, -0.02, 0.0], pole: [0.6, 0.2, -0.3] }
  machine-yacht-seated-windward:
    from: yacht-seated-windward
    shift: [-0.04, 0.0, 0.0]
    ik:
      hand_l: { at: yacht-seat, offset: [-0.1, -0.02, 0.0], pole: [0.6, 0.2, -0.3] }

clips:
  # The habit at a cruising catamaran's wheel: the same, made at hers.
  machine-bridge-habit-wheel:
    of: machine-habit-wheel
    restage: bridgedeck
    group: bridgedeck
  machine-yacht-wheel-seated:
    loop: true
    idle: true
    sides: true
    strain: [thigh]
    group: cruiser
    keys:
      - { pose: machine-yacht-seated, hold: 1.4, ramp: 1.5, lead: head }
      - { pose: machine-yacht-seated-aloft, hold: 1.4, ramp: 1.4, lead: head, anticipate: 0.05 }
      - { pose: machine-yacht-seated, hold: 1.0, ramp: 1.4, lead: head }
      - { pose: machine-yacht-seated-windward, hold: 1.2, ramp: 1.3, lead: head, anticipate: 0.05 }
  # The habit at a cruising yacht's wheel: the same, made at hers.
  machine-yacht-habit-wheel:
    of: machine-habit-wheel
    restage: cruiser
    group: cruiser
  machine-habit:
    sides: true
    keys:
      - { pose: helm-seated, hold: 0.3 }
      - { pose: machine-listen, hold: 0.4, ramp: 0.5 }
      - { pose: machine-turn-1, hold: 0.25, ramp: 0.55, lead: head }
      - { pose: machine-turn-2, hold: 0.25, ramp: 0.55, lead: head }
      - { pose: machine-turn-3, hold: 0.8, ramp: 0.55, lead: head }
      - { pose: machine-turn-1, hold: 0.3, ramp: 1.1, lead: head }
      - { pose: helm-seated, hold: 0.4, ramp: 1.0, lead: head }

  machine-habit-standing:
    keys:
      - { pose: machine-stand, hold: 0.3 }
      - { pose: machine-stand-listen, hold: 0.4, ramp: 0.5 }
      - { pose: machine-stand-turn-1, hold: 0.25, ramp: 0.55, lead: head }
      - { pose: machine-stand-turn-2, hold: 0.8, ramp: 0.55, lead: head }
      - { pose: machine-stand, hold: 0.4, ramp: 1.2, lead: head }

  machine-habit-wheel:
    keys:
      - { pose: wheel-stand, hold: 0.3 }
      - { pose: machine-wheel-listen, hold: 0.4, ramp: 0.5 }
      - { pose: machine-wheel-turn-1, hold: 0.25, ramp: 0.55, lead: head }
      - { pose: machine-wheel-turn-2, hold: 0.8, ramp: 0.55, lead: head }
      - { pose: wheel-stand, hold: 0.4, ramp: 1.2, lead: head }

# Sat on a cruising yacht's bench, the long coat kept off the bench's back:
# the bench's edge further from the knees.
retarget:
  machine-bench:
    file: vendor/quaternius/Sitting_Idle_Loop.glb
    loop: true
    idle: true
    deck: true
    stage: yacht-bench
    knee: 0.3
    strain: [hand]
    group: cruiser
  machine-bench-shift:
    file: vendor/quaternius/Sitting_Idle02_Loop.glb
    loop: true
    idle: true
    deck: true
    stage: yacht-bench
    knee: 0.3
    strain: [hand]
    group: cruiser
  machine-bench-nod:
    file: vendor/quaternius/Sitting_Nodding_Loop.glb
    loop: true
    idle: true
    deck: true
    stage: yacht-bench
    knee: 0.3
    strain: [hand]
    group: cruiser
