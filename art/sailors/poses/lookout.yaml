#
# The Lookout's habit: shading the eyes and scanning the sea. At the helm
# the sheet hand comes up to the brow, flat over the eyes like a visor, and
# the head turns slowly across the water ahead, one way and back the
# other, before the hand goes back to the sheet. Standing, the same, the
# other hand on the hip.
poses:
  lookout-shade:
    from: helm-seated
    turn:
      - [spine_02, x, -3]
      - [head, x, -5]
      - [hand_r, x, -35]
    ik:
      hand_r: { at: bone, bone: head, offset: [-0.15, -0.26, 0.13], pole: [-0.6, -0.1, -0.1] }

  lookout-scan-ahead:
    from: lookout-shade
    turn:
      - [spine_03, z, -4]
      - [neck_01, z, -7]
      - [head, z, -14]

  lookout-scan-windward:
    from: lookout-shade
    turn:
      - [spine_03, z, 4]
      - [neck_01, z, 6]
      - [head, z, 12]

  lookout-stand-shade:
    from: stand
    turn:
      - [spine_02, x, -3]
      - [head, x, -5]
      - [hand_r, x, -35]
    ik:
      hand_r: { at: bone, bone: head, offset: [-0.15, -0.25, 0.12], pole: [-0.6, -0.1, -0.1] }

  # The hand down before the waist on its way to the hip, so the elbow
  # stays open.
  lookout-stand-lower:
    from: stand
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.2, -0.2, 0.16], pole: [-0.7, 0.4, 0.0] }

  lookout-stand-left:
    from: lookout-stand-shade
    turn:
      - [spine_03, z, 5]
      - [neck_01, z, 7]
      - [head, z, 14]

  lookout-stand-right:
    from: lookout-stand-shade
    turn:
      - [spine_03, z, -5]
      - [neck_01, z, -7]
      - [head, z, -14]

  # At the wheel: the right hand off its spoke, flat over the eyes, and
  # the head turning slowly across the water ahead and back.
  lookout-wheel-shade:
    from: wheel-grip-left
    turn:
      - [spine_02, x, -3]
      - [head, x, -5]
      - [hand_r, x, -35]
    ik:
      hand_r: { at: bone, bone: head, offset: [-0.15, -0.25, 0.12], pole: [-0.6, -0.1, -0.1] }

  lookout-wheel-left:
    from: lookout-wheel-shade
    turn:
      - [spine_03, z, 5]
      - [neck_01, z, 7]
      - [head, z, 14]

  lookout-wheel-right:
    from: lookout-wheel-shade
    turn:
      - [spine_03, z, -5]
      - [neck_01, z, -7]
      - [head, z, -14]

  lookout-yacht-wheel-left:
    from: lookout-wheel-shade
    turn:
      - [spine_03, z, 2]
      - [neck_01, z, 9]
      - [head, z, 15]

  lookout-yacht-wheel-right:
    from: lookout-wheel-shade
    turn:
      - [spine_03, z, -2]
      - [neck_01, z, -9]
      - [head, z, -15]

  # On a cruising yacht's rail, sat leaning a little back: her loose hair,
  # turning to look forward, kept inboard of the upper lifeline.
  lookout-yacht-rail-sit:
    from: yacht-rail-sit
    turn:
      - [spine_01, x, -8]
  lookout-yacht-rail-sit-luff:
    from: yacht-rail-sit-luff
    turn:
      - [spine_01, x, -8]
      - [head, z, -4]
  lookout-yacht-rail-sit-sea:
    from: yacht-rail-sit-sea
    turn:
      - [spine_01, x, -8]
  lookout-yacht-rail-lean:
    from: yacht-rail-lean
    turn:
      - [spine_01, x, -8]
  lookout-yacht-rail-lean-luff:
    from: yacht-rail-lean-luff
    turn:
      - [spine_01, x, -8]
      - [head, z, -4]
  lookout-yacht-rail-lean-sea:
    from: yacht-rail-lean-sea
    turn:
      - [spine_01, x, -8]

clips:
  lookout-yacht-rail:
    loop: true
    idle: true
    sides: true
    hang: { back: 1.0, front_02: 1.0 }
    group: cruiser
    keys:
      - { pose: lookout-yacht-rail-sit, hold: 1.6, ramp: 1.5, lead: head }
      - { pose: lookout-yacht-rail-sit-luff, hold: 1.4, ramp: 1.3, lead: head, anticipate: 0.05 }
      - { pose: lookout-yacht-rail-sit, hold: 1.2, ramp: 1.5, lead: head }
      - { pose: lookout-yacht-rail-sit-sea, hold: 1.2, ramp: 1.4, lead: head, anticipate: 0.05 }
  lookout-yacht-rail-out:
    loop: true
    idle: true
    sides: true
    hang: { back: 1.0, front_02: 1.0 }
    group: cruiser
    keys:
      - { pose: lookout-yacht-rail-lean, hold: 1.6, ramp: 1.5, lead: head }
      - { pose: lookout-yacht-rail-lean-luff, hold: 1.4, ramp: 1.3, lead: head, anticipate: 0.05 }
      - { pose: lookout-yacht-rail-lean, hold: 1.2, ramp: 1.5, lead: head }
      - { pose: lookout-yacht-rail-lean-sea, hold: 1.2, ramp: 1.4, lead: head, anticipate: 0.05 }
  # The habit at a cruising yacht's wheel: the same, made at hers, turning
  # less from the hips, so the hand on her rim (a hair further out than the
  # ship's spoke) stays on it.
  lookout-yacht-habit-wheel:
    restage: cruiser
    group: cruiser
    keys:
      - { pose: wheel-stand, hold: 0.4 }
      - { pose: lookout-wheel-shade, hold: 0.4, ramp: 1.4, arc: [0.06, 0.05] }
      - { pose: lookout-yacht-wheel-left, hold: 0.5, ramp: 1.9, lead: head }
      - { pose: lookout-yacht-wheel-right, hold: 0.5, ramp: 2.0, lead: head }
      - { pose: lookout-wheel-shade, hold: 0.2, ramp: 1.4, lead: head }
      - { pose: wheel-stand, hold: 0.5, ramp: 1.5, arc: [0.08, 0.0] }
  lookout-habit:
    sides: true
    keys:
      - { pose: helm-seated, hold: 0.4 }
      - { pose: lookout-shade, hold: 0.4, anticipate: 0.08, arc: [0.06, 0.05] }
      - { pose: lookout-scan-ahead, hold: 0.5, ramp: 1.6, lead: head }
      - { pose: lookout-scan-windward, hold: 0.5, ramp: 2.0, lead: head }
      - { pose: lookout-shade, hold: 0.2, ramp: 1.4, lead: head }
      - { pose: helm-seated, hold: 0.5, arc: [0.1, 0.0] }

  lookout-habit-standing:
    keys:
      - { pose: stand, hold: 0.4 }
      - { pose: lookout-stand-lower, hold: 0.05, ramp: 0.9 }
      - { pose: lookout-stand-shade, hold: 0.4, ramp: 1.2, arc: [0.06, 0.05] }
      - { pose: lookout-stand-left, hold: 0.5, ramp: 1.9, lead: head }
      - { pose: lookout-stand-right, hold: 0.5, ramp: 2.0, lead: head }
      - { pose: lookout-stand-shade, hold: 0.2, ramp: 1.4, lead: head }
      - { pose: lookout-stand-lower, hold: 0.1, ramp: 1.2 }
      - { pose: stand, hold: 0.5, ramp: 1.0 }

  lookout-habit-wheel:
    keys:
      - { pose: wheel-stand, hold: 0.4 }
      - { pose: lookout-wheel-shade, hold: 0.4, ramp: 1.4, arc: [0.06, 0.05] }
      - { pose: lookout-wheel-left, hold: 0.5, ramp: 1.9, lead: head }
      - { pose: lookout-wheel-right, hold: 0.5, ramp: 2.0, lead: head }
      - { pose: lookout-wheel-shade, hold: 0.2, ramp: 1.4, lead: head }
      - { pose: wheel-stand, hold: 0.5, ramp: 1.5, arc: [0.08, 0.0] }
