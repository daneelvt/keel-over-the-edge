#
# The Buccaneer's habit: thumbs at the belt. At the helm the sheet hand
# leaves the sheet for the sash at the front, the shoulders go back and
# the head tips up with a look round to windward, easy, and the hand goes
# back to the sheet. Standing, both thumbs in the sash, the hips easing
# over onto one leg, a look round, and back.
poses:
  buccaneer-belt:
    from: helm-seated
    turn:
      - [spine_03, x, -4]
      - [head, x, -6]
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.15, -0.12, 0.12], pole: [-0.8, 0.3, -0.1] }

  buccaneer-round:
    from: buccaneer-belt
    turn:
      - [neck_01, z, 7]
      - [head, z, 16]
      - [head, x, -3]

  buccaneer-back:
    from: buccaneer-belt
    turn:
      - [head, x, 4]
      - [head, z, -6]

  buccaneer-stand-belt:
    from: stand
    turn:
      - [spine_03, x, -3]
      - [head, x, -4]
    ik:
      hand_l: { at: bone, bone: pelvis, offset: [0.18, -0.08, 0.11], pole: [0.8, 0.3, -0.1] }
      hand_r: { at: bone, bone: pelvis, offset: [-0.18, -0.08, 0.11], pole: [-0.8, 0.3, -0.1] }

  buccaneer-stand-hip:
    from: buccaneer-stand-belt
    turn:
      - [spine_01, y, 3]
      - [spine_02, y, 2]
      - [neck_01, y, -3]
      - [neck_01, z, 6]
      - [head, z, 14]

  buccaneer-stand-round:
    from: buccaneer-stand-hip
    turn:
      - [neck_01, z, -12]
      - [head, z, -28]

  # At the wheel: the right thumb hooked in the belt, a swagger of the
  # shoulders and a look round, the left hand on its spoke.
  buccaneer-wheel-belt:
    from: wheel-grip-left
    turn:
      - [spine_03, x, -3]
      - [head, x, -4]
    ik:
      hand_r: { at: bone, bone: pelvis, offset: [-0.18, -0.08, 0.11], pole: [-0.8, 0.3, -0.1] }

  buccaneer-wheel-round:
    from: buccaneer-wheel-belt
    turn:
      - [spine_02, z, -3]
      - [neck_01, z, -7]
      - [head, z, -18]
      - [head, x, -3]

  buccaneer-wheel-back:
    from: buccaneer-wheel-belt
    turn:
      - [head, x, 4]
      - [head, z, 6]

clips:
  buccaneer-habit:
    sides: true
    keys:
      - { pose: helm-seated, hold: 0.3 }
      - { pose: buccaneer-belt, hold: 0.4, ramp: 1.2 }
      - { pose: buccaneer-round, hold: 0.6, ramp: 1.6, lead: head }
      - { pose: buccaneer-back, hold: 0.3, ramp: 1.2, lead: head }
      - { pose: helm-seated, hold: 0.3, ramp: 1.2 }

  buccaneer-habit-standing:
    keys:
      - { pose: stand, hold: 0.3 }
      - { pose: buccaneer-stand-belt, hold: 0.3, ramp: 1.2 }
      - { pose: buccaneer-stand-hip, hold: 0.5, ramp: 1.3, lead: head }
      - { pose: buccaneer-stand-round, hold: 0.5, ramp: 1.4, lead: head }
      - { pose: buccaneer-stand-belt, hold: 0.2, ramp: 1.3, lead: head }
      - { pose: stand, hold: 0.3, ramp: 1.3 }

  buccaneer-habit-wheel:
    keys:
      - { pose: wheel-stand, hold: 0.3 }
      - { pose: buccaneer-wheel-belt, hold: 0.4, ramp: 1.3 }
      - { pose: buccaneer-wheel-round, hold: 0.6, ramp: 1.6, lead: head }
      - { pose: buccaneer-wheel-back, hold: 0.3, ramp: 1.2, lead: head }
      - { pose: wheel-stand, hold: 0.3, ramp: 1.3 }
