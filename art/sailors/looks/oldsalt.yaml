#
# The Old Salt: the oldest hand aboard, weathered, in a knitted Monmouth
# cap, its brim turned up in a roll and its top drooping over; a short sea
# jacket of heavy wool to the hip, no lapels, open at the throat; a
# wool neckerchief wrapped at the throat; wide canvas slops to below the
# knee, grey stockings and shoes. From behind and
# above: the cap's round, its rolled brim and its top falling over to one
# side, the short jacket square at the hip; her white plait down the back,
# his white beard from the side. The jacket is the main colour.
id: oldsalt
name: Old Salt
committed: true
versions:
  female:
    base: female
    macros: { age: 0.72 }
    targets:
      # Weathered and still handsome: the eyes narrowed by years of
      # squinting at the sea, a determined chin, a wry smile, its right
      # corner the higher, one brow the higher.
      lr-eye-height2-decr: 0.4
      chin-prominent-incr: 0.25
      nose-point-down: 0.1
      mouth-angles-up: 0.3
      asym-mouth-1-r: 0.3
      asym-brown-1-l: 0.2
    face:
      eyes: { iris-inner: "#7E9CB0", iris-outer: "#3E5A6E", limbal: "#121A20" }
  male:
    base: male
    macros: { age: 0.75 }
    targets:
      # Dignified: a square, weathered head, a strong nose with a little
      # hump, the eyes narrowed under a low brow; one brow the higher.
      head-square: 0.3
      nose-hump-decr: 0.0
      nose-hump-incr: 0.3
      lr-eye-height2-decr: 0.35
      eyebrows-trans-down: 0.2
      mouth-angles-up: 0.15
      asym-brown-1-r: 0.3
    face:
      eyes: { iris-inner: "#6F8F9E", iris-outer: "#355260", limbal: "#10181C" }
# The hair, white, close under the cap: hers in a plait down the back from
# under its edge, tied at its end; his short, and a full white beard.
hair:
  id: hair
  family: hair
  region: hair
  params:
    shell: cap
    comb: back
    thickness: 0.0032
    details: false
    deck-weight: 1.5
    female:
      nape: 0.026
      volume: 0.006
      taper: 0.018
      length: 0.2
      strands: 300
      gather: [0, 0.08, -0.07]
      tail:
        {
          kind: braid,
          length: 0.28,
          width: 0.038,
          taper: 0.5,
          lean: 0.14,
          lobes: 8,
          clear: 0.056,
          share: 0.4,
        }
      ribbon: { colour: "#3A2A1C", at: 0.88, width: 0.012 }
      # A plait is not its own mirror.
      asymmetric: true
    male:
      nape: 0.014
      volume: 0.005
      taper: 0.015
      length: 0.14
      strands: 240
      beard:
        volume: 0.009
        taper: 0.018
        cheek: 0.03
        sideburn: 0.012
        moustache: 0.018
        mouth: 0.024
        lips: 0.0115
        under: 0.022
        back: -0.006
        chin: 0.034
        triangles: 480
        deck-weight: 3.0
        share: 1.0
garments:
  # Wide slops of tarred canvas to below the knee, open at the hem.
  - id: slops
    family: breeches
    region: fixed
    colour: "#8B8478"
    params:
      triangles: 1200
      below-knee: 0.08
      deck-weight: 2.5
      flare: { out: 0.04, power: 1.2, inner: 0.3 }
      bands:
        - { at: top, height: 0.035, out: -0.001 }
  # Grey wool, gartered below the knee under the slops.
  - id: stockings
    family: stockings
    region: fixed
    colour: "#5E5A54"
    params: { above-knee: -0.065, triangles: 600, deck-weight: 2.0 }
  - id: shoes
    family: shoes
    region: fixed
    colour: "#2A1D14"
    params: { rise: 0.45, at: -0.012, sole: 0.006, triangles: 380, deck-weight: 2.5 }
  # Linen, to the hips under the jacket, showing in its opening at the
  # throat.
  - id: shirt
    family: shirt
    region: fixed
    colour: "#E2D8C2"
    params:
      sleeve: 0.88
      neck: 0.05
      triangles: 1100
      female: { shoulder: { reach: 0.12, ease: 0.003 } }
      male: { shoulder: { reach: 0.18, ease: 0.003 } }
  # The wool neckerchief, wrapped round the throat, its ends falling into
  # the jacket's opening.
  - id: neckerchief
    family: neckcloth
    region: fixed
    colour: "#D9CDB0"
    params:
      layer: neckcloth
      ease: 0.008
      columns: 20
      below: -0.004
      height: 0.022
      deck-weight: 2.5
      ends: { length: 0.05, width: 0.026, spread: 0.004, off: 0.016 }
      # Hers open at the back, where her plait hangs over it.
      female: { open-back: 0.16 }
  # The sea jacket: heavy wool, fitted to the waist, no collar or lapels,
  # open at the throat to mid-chest and buttoned below (trims), the
  # sleeves to the wrist, turned back in a narrow band; the main colour.
  - id: jacket
    family: bodice
    region: main
    params:
      layer: coat
      ease: 0.02
      arm-ease: 0.011
      sleeve: 0.94
      neck: 0.03
      neck-slope: 0.25
      below-waist: 0.02
      open: { neck: 0.035, hem: -0.035 }
      fitted: true
      triangles: 1400
      female: { shoulder: { reach: 0.15, ease: 0.005 } }
      male: { shoulder: { reach: 0.19, ease: 0.005 } }
      bands:
        - { at: ends, height: 0.045, out: 0.004 }
  # Its short skirt, to the hip: close and square, a little open at the
  # front below the last button, a vent at the back.
  - id: jacket-skirt
    family: skirt
    region: main
    params:
      layer: coat
      skirt: true
      rise: 0.01
      length: 0.15
      ease: 0.022
      top-ease: 0.017
      rows: 5
      columns: 40
      follow: 0.3
      flare: { front: 0.02, side: 0.06, back: 0.04 }
      open: [{ width: 0.05 }, { azimuth: 180, width: 0.012, start: 0.35 }]
trims:
  - {
      kind: buttons,
      on: jacket,
      along: middle,
      count: 5,
      from: 0.04,
      to: 0.02,
      radius: 0.0065,
      colour: "#3A2E24",
    }
# The knitted Monmouth cap, red wool: close round the head, its brim
# turned up in a roll, its top drooping over to the left and back; the
# knit's ribs in the cloth.
hat:
  id: cap
  family: scarf
  region: fixed
  colour: "#8E2A2A"
  params:
    # Thick, felted knit, standing well off the head.
    volume: 0.014
    rows: 12
    columns: 28
    edge: { front: 0.04, side: 0.018, back: 0.05 }
    smooth: 8
    knot: null
    tall: { height: 0.035, swell: 0.06, back: 0.01, round: 2.0 }
    roll: { rows: [1.0, 0.9, 0.45], out: 0.012 }
    droop:
      {
        azimuth: 145,
        from: 80,
        down: -15,
        lift: 0.025,
        off: 0.11,
        radius: [0.036, 0.026],
        rings: 10,
        sides: 10,
      }
    pattern:
      {
        kind: stripes,
        period: 0.012,
        band: 0.45,
        soft: 0.5,
        ground: "#8E2A2A",
        colour: "#782222",
        radius: 0.1,
      }
    asymmetric: true
    # Hers fuller, its top falling further back.
    female:
      tall: { height: 0.05, swell: 0.06, back: 0.01, round: 2.0 }
      droop:
        {
          azimuth: 160,
          from: 80,
          down: -15,
          lift: 0.025,
          off: 0.15,
          radius: [0.042, 0.034],
          rings: 10,
          sides: 10,
        }
palette:
  main: "#1E1E1E"
  skin: "#B2815F"
  hair: "#D2CBC1"
# Every sailor's clips, and the Old Salt's habit: squinting at the sky.
clips:
  [
    helm,
    helm-wheel,
    trapeze,
    trapeze-low,
    rail,
    rail-out,
    crouch-enter,
    crouch-walk,
    crouch-exit,
    look-about,
    fold-arms,
    talking,
    leaning,
    hatch-sit,
    hatch-shift,
    hatch-nod,
    hatch-talk,
    walk,
    haul,
    aloft,
    yard,
    oldsalt-habit-wheel,
    hiking-1,
    hiking-2,
    hiking-3,
    cross,
    oldsalt-habit,
    oldsalt-habit-standing,
    standing-idle,
    treading-water,
    righting,
    climbing-in,
  ]
names:
  { oldsalt-habit: habit, oldsalt-habit-standing: habit-standing, oldsalt-habit-wheel: habit-wheel }
