#
# The tables every sailor is built by, so that twenty of them are alike
# where they should be: one ease table, one budget table, one atlas.

# How far each layer of clothing stands off what is under it, in metres,
# when it is pushed out from the body.
ease:
  stockings: 0.003
  shoes: 0.006
  shirt: 0.008
  breeches: 0.010
  waistcoat: 0.016
  neckcloth: 0.020
  coat: 0.024
  sash: 0.030
  cuff: 0.034

# The most triangles a mesh may have at each level: the body, each
# garment, the hair, a beard, the hat, each part of the face (the eyes, the lashes)
# and the trims (buttons, flaps, buckles, which the deck level leaves
# out); the gear a sailor carries (a case on its strap; what is too fine
# for the deck is a prop); a machine's head, and its plates over its coat; and the whole
# figure. The close body is its proxy with what the
# clothes cover taken out; the deck level is the close one collapsed mesh
# by mesh; the far level is one rigid mesh.
budgets:
  close:
    body: 5000
    garment: 4000
    hair: 1000
    beard: 700
    hat: 1000
    face: 300
    prop: 1500
    gear: 800
    head: 4000
    plate: 1000
    figure: 12000
  deck:
    body: 1300
    garment: 350
    hair: 250
    beard: 260
    hat: 250
    face: 80
    gear: 160
    head: 700
    plate: 350
    figure: 3300
  far:
    figure: 300

# The atlas: its size at each level, the margin round its islands in
# pixels at the close level, and the share of what its islands cover that
# the face and head take. The margin is wide enough that the mask's mip
# levels down to an eighth (and the far level's atlas, an eighth of the
# close's) keep each region its own: at 6 pixels, a third mip level mixed
# the shirt's region into the skin beside it, and the game drew the main
# colour on a shin and across the crown's seam.
atlas:
  close: 1024
  deck: 512
  far: 128
  margin: 24
  head: 0.37

# What a level's file may weigh, gzipped, in bytes (the deck and far levels
# together, as they load together).
sizes:
  close: 307200
  deck-far: 153600

# The boat a sailor is judged and moved in (build/stage.py): the game's
# dinghy, the hips this far out from the centreline on its side deck, the
# feet this far inboard of them on the cockpit's floor, hiking the hips
# this far inboard of the gunwale; and the places the
# hands go that the model has no node for yet, forward, inboard and up
# from the seat, in metres.
stage:
  boat: boats/jolly-boat.glb
  seat: { out: 0.6 }
  hike: { in: 0.05 }
  floor: { in: 0.45 }
  points:
    tiller: [-0.24, 0.2, 0.24]
    sheet: [0.3, 0.3, 0.3]
    tiller-hiking: [-0.3, 0.05, 0.22]
    sheet-hiking: [0.3, 0.12, 0.28]
  # The ship's helm, where the sailor stands at a wheel (build/stage.py's
  # Wheel): the point the helmsman stands at, between the feet on a flat
  # deck (set this far forward of the dinghy, clear of it); the hub this
  # far ahead of it and up from the deck, its axle fore and aft; the rim,
  # the spokes (the first straight up at rest) and their handles beyond the
  # rim, as the ship's model is built; and where the hands hold the
  # spokes, each the spoke's angle from the top (degrees, to starboard as
  # the helmsman sees it) and how far out along it from the hub. The clips
  # placed here are placed from the helmsman's point, as the game places
  # them from the model's `sailor` node.
  wheel:
    at: [0.0, 12.0, 0.0]
    deck: { width: 3.0, length: 3.0, thickness: 0.2 }
    hub: { ahead: 0.55, up: 1.05 }
    radius: 0.75
    spokes: 8
    handles: 0.15
    grips:
      wheel-left: [-45, 0.4]
      wheel-right: [45, 0.4]
  # A boat sailed from the trapeze (build/stage.py's Trapeze): its model,
  # set this far forward of the dinghy in the stage's scene, clear of it
  # and of the wheel; its `trapeze` node gives the rack's edge the feet
  # stand on (on the starboard side, at the helm's station), each side's
  # ring and the hounds the wires come down from. The clips placed there
  # are placed from the rack's edge on their side, as the game places them
  # from the model's node. The harness the wire hooks to (build/gear.py's
  # harness), worn only there: a belt this wide and thick round the
  # clothes under a coat or an apron, its middle this far above the waist,
  # and its hook standing this far out before it.
  trapeze:
    boat: boats/skiff.glb
    at: [0.0, 24.0, 0.0]
    harness: { width: 0.075, thick: 0.005, columns: 32, up: -0.02, hook: 0.055 }
  # A keelboat whose crew sit on the rail, legs over the side (build/
  # stage.py's Rail): her model, set this far forward of the dinghy in the
  # stage's scene, clear of it, the wheel and the trapeze's boat; her
  # `rail` node is the starboard deck's edge they sit on. The clips placed
  # there are placed from the deck's edge on their side, as the game places
  # them from a station on the rail; sat there, the knees' joints this far
  # out from the edge, the backs of the knees just past it. The cloth they
  # sit on is laid on her deck this far fore and aft of the edge's station,
  # inboard of the edge.
  rail:
    boat: boats/keelboat.glb
    at: [0.0, 36.0, 0.0]
    knee: 0.12
    span: 1.2
  # The tall ship, whose company stands, sits, walks, climbs, hauls and
  # lies out about her decks and aloft (build/stage.py's Ship): her model,
  # set this far forward of the dinghy in the stage's scene, clear of every
  # other stage; her `company` node gives the places the clips made there
  # are placed from, on the starboard side (the port's the mirror).
  ship:
    boat: boats/tall-ship.glb
    at: [0.0, 80.0, 0.0]
  # The beach cat, whose sailors sit on her windward hull, sit out from it,
  # lie out on the wire, cross her net and right her standing on her lower
  # hull (build/stage.py's Cat): her model, set this far forward of the
  # dinghy in the stage's scene, clear of every other stage, and a copy of
  # her lying on her side this far to starboard of her (her mast reaches
  # 9 m to port of it); her `aboard` node gives the places the clips made
  # there are placed from, on the starboard side (the port's the mirror).
  # Sat on her hull facing inboard, the hips this far outboard of the
  # deck's inner edge; sitting out, this far inboard of its outer edge.
  cat:
    boat: boats/beach-cat.glb
    at: [0.0, 50.0, 0.0]
    capsized: [13.0, 0.0, 0.0]
    seat: { in: 0.22 }
    hike: { in: 0.05 }
  # The cruising yacht, whose helm stands or sits at her windward wheel,
  # whose crew sit on her cockpit's benches and on her rail under her
  # lifelines, and cross her cockpit and her coachroof at a crouch
  # (build/stage.py's Yacht): her model, set this far to starboard of the
  # dinghy in the stage's scene, clear of every other stage; her nodes give
  # the places the clips made there are placed from, on the starboard side
  # (the port's the mirror). At her wheel the hands hold its rim, each this
  # many degrees from its top (to starboard as the helm sees it), standing;
  # sat by it, the inboard hand. Sat on the side deck outboard of the
  # wheel facing forward, the helm's hips are this far aft of the wheel
  # and this far outboard of the deck's inner edge, the feet braced this
  # far forward of them, by her capstan. Sat on the bench, the hips this
  # far in from its front edge (the idles': its edge this far from the
  # knees).
  # On the rail, the knees' joints this far out from the deck's edge. Her
  # cockpit is crossed this far forward of her table, aft of the mainsheet's
  # bridle; her coachroof this far aft of its fore end, forward of the
  # mast, over its scuttle (aft of the mast her boom is 0.72 m over the
  # roof, lower than a crouching figure's hat).
  cruiser:
    boat: boats/yacht.glb
    at: [40.0, 0.0, 0.0]
    grips: { yacht-wheel-left: -45, yacht-wheel-right: 45, yacht-seat: 75 }
    helm-seat: { aft: 0.3, out: 0.17, brace: 0.58 }
    bench: { in: 0.24, knee: 0.18 }
    rail: { knee: 0.1 }
    cockpit: { table: 0.1 }
    roof: { fore: 0.5 }

# The portraits (build/portraits.py), every look's taken alike: head and
# shoulders, three-quarter, the camera on the figure's left at the height
# of its face, framing the same height of figure for every look (the
# tallest hat fits), the eyes this share of the frame down from its top.
# The colour portrait's lights, as watts, from directions in the camera's
# frame (right, up, toward the camera): the key from the upper left (a
# soft spot on the head, so the clothes below fall off), a fill from the
# right, light from below (the deck's, under a brim) and a rim from
# behind; the sky and the sea round it, which metal reflects. The inked
# portrait is lit by one light from the upper left.
portraits:
  colour: { size: [256, 320], samples: 128, mask-samples: 48 }
  # The inked portrait, drawn at scale times its size: its light; the
  # light below which each level of ink begins, the lines' share of their
  # period at each (the last crossed by a second set this wide), the
  # face's last; the period in pixels; the planes' two directions.
  ink:
    size: [512, 640]
    scale: 2
    light: { from: [-0.8, 0.45, 0.9], strength: 3.2, sky: 0.25 }
    levels: [0.55, 0.35, 0.2, 0.1]
    widths: [0.16, 0.3, 0.45, 0.5]
    cross: 0.3
    face-cap: 3
    # The least level hair is drawn at.
    hair: 1
    # What is painted on the face this much darker than round it is drawn.
    marks: 0.7
    period: 5
    first: [0.18, 1, 0.12]
    second: [1, -0.55, 0.2]
  camera: { lens: 85, height: 0.595, eyes: 0.42, azimuth: 30 }
  pose: { arms-down: 45, head-turn: 6, gaze: 14 }
  lights:
    key: { watts: 320, size: 0.5, cone: 24, from: [-0.8, 0.45, 0.9], colour: [1, 0.96, 0.9] }
    fill: { watts: 12, size: 1.5, from: [0.9, -0.1, 0.8], colour: [0.85, 0.9, 1] }
    below: { watts: 20, size: 2.0, from: [0, -1, 0.8], colour: [1, 0.92, 0.82] }
    rim: { watts: 80, size: 1.0, from: [0.5, 0.6, -1], colour: [0.9, 0.95, 1] }
    sky: [0.75, 0.78, 0.82]
    sea: [0.08, 0.1, 0.11]
    ambient: 0.15
    # A machine's lamps, lit as at dusk.
    lamp: { colour: "#FFB347", strength: 3 }
  # The files: the shaded base (AVIF, and WebP for browsers without AVIF)
  # at these qualities; the mask lossless, its shares in this many steps;
  # the inked portrait lossless (100), every pixel ink or paper.
  quality: { avif: 65, webp: 60, ink: 100 }
  mask-steps: 16

# The motion lab (build/motion.py) and its gate (review/motion.py).
motion:
  fps: 30
  # A ramp between two key poses lasts base seconds, per-degree more for
  # the largest turn in it and per-metre for the furthest a target moves.
  ramp: { base: 0.35, per-degree: 0.02, per-metre: 1.5 }
  # Each bone follows its ramps through a second-order filter: lightly
  # underdamped, the more so down the chain (delays over 2), so the ends
  # follow through. Its delay in frames, by the start of its name: the
  # hips first and the hands last, each joint of a chain after the one
  # before; the torso's reversed when the head leads.
  filter:
    hz: 2.2
    zeta: { proximal: 0.85, distal: 0.6 }
  delays:
    pelvis: 0
    spine_01: 1
    spine_02: 2
    spine_03: 3
    neck_01: 5
    head: 7
    clavicle: 1
    upperarm: 1
    lowerarm: 4
    hand: 7
    thumb: 9
    index: 9
    middle: 9
    ring: 9
    pinky: 9
    thigh: 1
    calf: 4
    foot: 7
    ball: 7
    # The IK targets of the hands and feet, which move the upper arm and
    # forearm together; and the wrist leading a falling hand.
    effector: 4
    hand-leads: 0
  # Holds drift, so a held pose is never still: degrees, and the slowest
  # period in seconds.
  drift: { degrees: 0.5, head: 3.5, period: 2.2 }
  # IK targets are kept within this share of the arm's reach (a straight
  # arm pops), and of the leg's (a leg stands straight).
  reach: { arm: 0.85, leg: 0.999 }
  # The gate, from the motion study's measurements.
  gate:
    head-jerk-idle: 30
    hand-jerk: 200
    elbow-speed: 1.2
    reach: 0.9
    contact: 0.001
    ankle-drift: 0.005
    # A foot bearing on a deck, set on one: how far it may slide over it
    # while it bears, beyond the walk's own speed.
    slide: 0.01
    hand-clearance: 0.03
    # A hand on the hat, settling it: outside it by at least this.
    hat-clearance: 0.01
    range-share: 0.8
    # What a clip strains (hiking, climbing in with a knee to the chest) may
    # go to the end of its range, never beyond.
    range-strain: 1.0
    loop-degrees: 0.5
    loop-speed: 2.0
    head-peak-to-median: [2.5, 6.0]
  # The range of each joint, in degrees of turn from the rest pose (MPFB's
  # A-pose, the forearms bent about 40°), from the usual ranges of motion:
  # the hip flexes 120–135° with the knee bent (at 120, a man sitting on the
  # dinghy's low side deck, an ordinary seat at about 100°, is past 80% of
  # it), the knee 135°, the shoulder 180°, the elbow 150°, the neck turns
  # 80°, the ankle 60° (on the toes under a deep crouch, 55°), the toes
  # bend back 70° (a crouch on the balls of the feet bends them 50°).
  ranges:
    pelvis: 60
    spine_01: 35
    spine_02: 35
    spine_03: 35
    neck_01: 55
    head: 70
    clavicle: 30
    upperarm: 150
    lowerarm: 120
    hand: 80
    thumb: 70
    index: 90
    middle: 90
    ring: 90
    pinky: 90
    thigh: 135
    calf: 135
    foot: 60
    ball: 70

