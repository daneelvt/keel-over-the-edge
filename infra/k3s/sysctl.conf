# Kernel settings for a machine that runs k3s, written to
# /etc/sysctl.d/90-k3s.conf. protect-kernel-defaults makes the kubelet
# check the first four rather than set them (k3s CIS hardening guide).
vm.panic_on_oom = 0
vm.overcommit_memory = 1
kernel.panic = 10
kernel.panic_on_oops = 1
# Controllers and log collectors watch many files; the defaults (128
# instances) run out on a busy node. Starting values.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
