# SPDX-License-Identifier: AGPL-3.0-only
# The API server's audit policy, written to
# /var/lib/rancher/k3s/server/audit.yaml (k3s CIS hardening guide): who
# did what to which object, and when, for every request, without the
# requests' and answers' bodies, which hold Secrets. Recorded once a
# request is answered, not also when it arrives.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  - level: Metadata
