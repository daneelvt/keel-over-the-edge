# The API server's admission plugins' settings, written to
# /var/lib/rancher/k3s/server/psa.yaml (k3s CIS hardening guide).
#
# Pod Security: every namespace's pods must keep the restricted profile
# unless the namespace says otherwise with a label of its own; kube-system,
# where k3s runs its own parts, is exempt. Each refusal is also audited and
# warned of.
#
# EventRateLimit: the API server takes at most this many events a second
# from all clients together, so a pod that floods events cannot crowd out
# the rest.
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: restricted
        enforce-version: latest
        audit: restricted
        audit-version: latest
        warn: restricted
        warn-version: latest
      exemptions:
        usernames: []
        runtimeClasses: []
        namespaces: [kube-system]
  - name: EventRateLimit
    configuration:
      apiVersion: eventratelimit.admission.k8s.io/v1alpha1
      kind: Configuration
      limits:
        - type: Server
          qps: 5000
          burst: 20000
