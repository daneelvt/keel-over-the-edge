# What others publish that the cluster's manifests hold exactly as
# published: release manifests with no signature of their own, which Flux
# cannot verify as a source. Each is fetched from its release by go run
# ./tools/vendored -pull, never as the cluster deploys, checked against the
# release's own checksums where it lists the file, and pinned here by its
# SHA-256, which a test holds the file in the repository to. The images
# they run are pinned by digest in the kustomization beside each.
#
# To move one to a new release: its url (and checksums) here, an empty
# sha256, then -pull, and the pull request shows what changed.
