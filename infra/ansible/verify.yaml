# SPDX-License-Identifier: AGPL-3.0-only
# Checks the machine is as the playbook leaves it, from outside the roles,
# changing nothing: the firewall, the way in, the hardening, what the
# machine reports of itself, k3s, Flux and the bootstrap secret, and what
# it serves to the tailnet. go run ./tools/machine -verify runs it.
- name: Verify production's machine
  hosts: all
  gather_facts: false
  # The access role's list of what the machine serves to the tailnet, and
  # how it is compared with what tailscale says (access_serve).
  vars_files:
    - roles/access/defaults/main.yaml
    - roles/access/vars/main.yaml
  vars:
    # A page served to the tailnet that answers without a login:
    # VictoriaMetrics' health.
    verify_served_port: 8428
    verify_served_path: /health
    verify_kubectl: /usr/local/bin/k3s kubectl
    # The observe role's: where the journal goes, and the facts' file.
    verify_logs_url: http://10.43.0.50:9428/insert/journald
    verify_facts: /var/lib/node-exporter/textfile/keel_machine.prom
    verify_modules: [cramfs, freevxfs, hfs, hfsplus, jffs2, usb-storage, dccp, rds, sctp, tipc]
    verify_sysctl:
      kernel.randomize_va_space: "2"
      fs.suid_dumpable: "0"
      kernel.kptr_restrict: "2"
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.tcp_syncookies: "1"
      net.ipv6.conf.all.accept_ra: "0"
      vm.overcommit_memory: "1"
      kernel.panic: "10"
  tasks:
    - name: Read the firewall
      ansible.builtin.command:
        cmd: nft list table inet hostfw
      register: verify_nft
      changed_when: false

    - name: Check the firewall drops what is not let in, and lets the tailnet in
      ansible.builtin.assert:
        that:
          - verify_nft.stdout is search('hook input priority filter; policy drop;')
          - verify_nft.stdout is search('iifname "tailscale0" accept')
          - verify_nft.stdout is search('hook forward priority filter; policy accept;')
          - verify_nft.stdout is search('ct state new drop')
        quiet: true

    - name: Read the services that must stay off  # noqa: command-instead-of-module (a check, which must not change them)
      ansible.builtin.command:
        cmd: systemctl is-enabled {{ item }}
      loop: "{{ ['nftables.service', 'swap.target'] + ([] if machine_runner | default(false) else ['ssh.socket', 'ssh.service']) }}"
      register: verify_off
      changed_when: false
      failed_when: verify_off.stdout not in ['disabled', 'masked']

    - name: Read the swap in use, the time zone and the mounts
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          echo "swap=$(swapon --show=NAME --noheadings | wc -l)"
          echo "timezone=$(timedatectl show --property=Timezone --value)"
          echo "tmp=$(findmnt --noheadings --output FSTYPE,OPTIONS /tmp)"
          echo "shm=$(findmnt --noheadings --output OPTIONS /dev/shm)"
        executable: /bin/bash
      register: verify_state
      changed_when: false

    - name: Read how names are resolved
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          resolvectl status | grep 'resolv.conf mode'
          getent ahostsv4 ghcr.io | head -1
        executable: /bin/bash
      register: verify_dns
      changed_when: false

    - name: Check names go through systemd-resolved, and resolve
      ansible.builtin.assert:
        that:
          - verify_dns.stdout is search('resolv.conf mode:\s+stub')
          - verify_dns.stdout_lines | length == 2
        fail_msg: "{{ verify_dns.stdout }}"
        quiet: true

    - name: Check there is no swap, the clock is UTC, and /tmp and /dev/shm hold nothing to run
      vars:
        verify: "{{ dict(verify_state.stdout_lines | map('split', '=', 1)) }}"
      ansible.builtin.assert:
        that:
          - verify.swap == '0'
          - verify.timezone == 'UTC'
          - verify.tmp is search('^tmpfs\s')
          - verify.tmp.split()[1].split(',') is superset(['nodev', 'nosuid', 'noexec'])
          - verify.shm.split(',') is superset(['nodev', 'nosuid', 'noexec'])
        quiet: true

    - name: Read how each unused module would load
      ansible.builtin.command:
        cmd: modprobe --dry-run --verbose {{ item }}
      loop: "{{ verify_modules }}"
      register: verify_modprobe
      changed_when: false
      failed_when: verify_modprobe.stdout is not search('install /bin/false')

    - name: Read the kernel settings in effect
      ansible.builtin.command:
        cmd: sysctl --values {{ verify_sysctl.keys() | join(' ') }}
      register: verify_live
      changed_when: false

    - name: Check them
      ansible.builtin.assert:
        that: verify_live.stdout_lines | map('trim') | list == verify_sysctl.values() | list
        fail_msg: "{{ dict(verify_sysctl.keys() | zip(verify_live.stdout_lines)) | to_json }}"
        quiet: true

    - name: Read auditd's state, AIDE's record, PAM and the login settings
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          auditctl -s | grep '^enabled'
          test -s /var/lib/aide/aide.db && echo aide=yes
          grep -h '^\s*deny\s*=\|^\s*unlock_time\s*=' /etc/security/faillock.conf
          grep -h 'minlen\|minclass' /etc/security/pwquality.conf.d/*.conf
          grep -c pam_faillock.so /etc/pam.d/common-auth
          grep -c pam_wheel.so /etc/pam.d/su
          cat /etc/cron.allow
          aa-enabled
        executable: /bin/bash
      register: verify_hardening
      changed_when: false

    - name: Check the audit rules are locked, AIDE has its record, and logins are guarded
      ansible.builtin.assert:
        that:
          - verify_hardening.stdout is search('^enabled 2$', multiline=True)
          - verify_hardening.stdout is search('^aide=yes$', multiline=True) or machine_runner | default(false)
          - verify_hardening.stdout is search('^deny = 5$', multiline=True)
          - verify_hardening.stdout is search('^unlock_time = 900$', multiline=True)
          - verify_hardening.stdout is search('^minlen = 14$', multiline=True)
          - verify_hardening.stdout is search('^minclass = 4$', multiline=True)
          - verify_hardening.stdout is search('^root$', multiline=True)
          - verify_hardening.stdout is search('^Yes$', multiline=True)
        fail_msg: "{{ verify_hardening.stdout }}"
        quiet: true

    - name: Read the journal's upload, the machine's facts, and whether sysstat is gone
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          facts={{ verify_facts }}
          echo "upload=$(systemctl is-enabled systemd-journal-upload.service)"
          echo "url=$(systemd-analyze cat-config systemd/journal-upload.conf | grep -c '^URL={{ verify_logs_url }}$')"
          echo "headers=$(systemd-analyze cat-config systemd/journal-upload.conf | grep -c '^Header=VL-\(Stream\|Ignore\)-Fields: ')"
          echo "receiver=$(systemctl is-enabled systemd-journal-remote.socket)"
          echo "timer=$(systemctl is-active keel-machine-facts.timer)"
          echo "mode=$(stat -c '%a %U' "$facts")"
          echo "reboot=$(grep -c '^keel_machine_reboot_required [01]$' "$facts")"
          echo "kernel=$(grep -c '^keel_machine_kernel_waiting\({.*}\)\? [01]$' "$facts")"
          echo "updates=$(grep -c '^keel_machine_security_updates [0-9]\+$' "$facts")"
          echo "audit=$(grep -c '^keel_machine_audit_log_bytes [0-9]\+$' "$facts")"
          echo "units=$(grep -c '^keel_machine_unit_active{unit="[a-z0-9-]\+\.service"} [01]$' "$facts")"
          echo "sysstat=$(dpkg-query --show --showformat='${db:Status-Status}' sysstat 2>/dev/null || echo not-installed)"
        executable: /bin/bash
      register: verify_observe
      changed_when: false

    - name: Check the journal is sent to VictoriaLogs, the facts are written, and sysstat is gone
      vars:
        verify: "{{ dict(verify_observe.stdout_lines | map('split', '=', 1)) }}"
      ansible.builtin.assert:
        that:
          - verify.upload == 'enabled'
          - verify.url == '1'
          - verify.headers == '2'
          - verify.receiver in ['disabled', 'masked', 'static']
          - verify.timer == 'active'
          - verify.mode == '644 root'
          - verify.reboot == '1'
          - verify.kernel == '1'
          - verify.updates == '1'
          - verify.audit == '1'
          - verify.units == '7'
          - verify.sysstat == 'not-installed'
        fail_msg: "{{ verify_observe.stdout }}"
        quiet: true

    # 7.0.0-42 gave containers the AppArmor label
    # cri-containerd.apparmor.d//&unconfined, which containerd's profile
    # lets no signal reach: CoreDNS's is read as any container's.
    - name: Read the kernel booted, the one GRUB boots, and a container's AppArmor label
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          echo "booted=$(uname -r)"
          echo "grub=$(sed -n 's/^GRUB_DEFAULT=".*, with Linux \(.*\)"$/\1/p' /etc/default/grub.d/98-keel-kernel.cfg)"
          echo "label=$(cat /proc/"$(pgrep -o -x coredns)"/attr/apparmor/current)"
        executable: /bin/bash
      register: verify_kernel
      changed_when: false

    - name: Check the machine runs the kernel GRUB boots, and containers keep the label signals reach
      vars:
        verify: "{{ dict(verify_kernel.stdout_lines | map('split', '=', 1)) }}"
      ansible.builtin.assert:
        that:
          - verify.booted == verify.grub
          - verify.label == 'cri-containerd.apparmor.d (enforce)'
        fail_msg: "{{ verify_kernel.stdout }}"
        quiet: true

    - name: Read k3s's node, its encryption, and its audit log
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          {{ verify_kubectl }} get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'; echo
          k3s secrets-encrypt status | grep 'Encryption Status'
          test -s /var/lib/rancher/k3s/server/logs/audit.log && echo audit-log=yes
          stat -c '%a' /var/lib/rancher/k3s/server/logs
        executable: /bin/bash
      register: verify_k3s
      changed_when: false

    - name: Check k3s is ready, encrypts secrets, and keeps its audit log
      ansible.builtin.assert:
        that:
          - verify_k3s.stdout_lines[0] == 'True'
          - verify_k3s.stdout is search('Encryption Status:\s+Enabled')
          - verify_k3s.stdout is search('^audit-log=yes$', multiline=True)
          - verify_k3s.stdout_lines[-1] == '700'
        fail_msg: "{{ verify_k3s.stdout }}"
        quiet: true

    - name: Wait for Flux's source, and its first three layers
      ansible.builtin.command:
        cmd: >-
          {{ verify_kubectl }} --namespace=flux-system wait --timeout=10m
          {{ 'ocirepository/keel --for=condition=SourceVerified' if item == 'source' else 'kustomization/' ~ item ~ ' --for=condition=Ready' }}
      loop: [source, flux-system, controllers, configs]
      changed_when: false

    - name: Read whether the game's database password is there yet
      ansible.builtin.command:
        cmd: "{{ verify_kubectl }} --namespace=keel get secret keel-db-app --ignore-not-found --output=name"
      register: verify_password
      changed_when: false

    # Until External Secrets brings it, the database is not made and the
    # game's pod waits for it: on purpose, so the database is only ever
    # made with the password kept in Infisical.
    - name: Wait for the game's pod to be waiting for it
      ansible.builtin.command:
        cmd: >-
          {{ verify_kubectl }} --namespace=keel get pods --selector=app.kubernetes.io/name=keel
          --output=jsonpath={.items[*].status.containerStatuses[*].state.waiting.reason}{.items[*].status.initContainerStatuses[*].state.waiting.reason}
      register: verify_waiting
      until: verify_waiting.stdout is search('CreateContainerConfigError')
      retries: 60
      delay: 10
      changed_when: false
      when: verify_password.stdout == ''

    # CloudNativePG makes the job that would make the database, whose pod
    # cannot start without the password either; no instance is made.
    - name: Read the database's instances
      ansible.builtin.command:
        cmd: "{{ verify_kubectl }} --namespace=keel get pods --selector=cnpg.io/cluster=keel-db,cnpg.io/podRole=instance --output=name"
      register: verify_database
      changed_when: false
      when: verify_password.stdout == ''

    - name: Check no database was made without it
      ansible.builtin.assert:
        that: verify_database.stdout == ''
        quiet: true
      when: verify_password.stdout == ''

    - name: Wait for the game, once the password is there
      ansible.builtin.command:
        cmd: "{{ verify_kubectl }} --namespace=flux-system wait kustomization/apps --for=condition=Ready --timeout=10m"
      changed_when: false
      when: verify_password.stdout != ''

    - name: Read the bootstrap secret's keys, and nothing of their values
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          {{ verify_kubectl }} --namespace=external-secrets get secret infisical-universal-auth --output=json
          | jq --raw-output '.data | keys | join(" ")'
        executable: /bin/bash
      register: verify_secret
      changed_when: false

    - name: Check it holds External Secrets' two keys
      ansible.builtin.assert:
        that: verify_secret.stdout.split() | sort == ['clientId', 'clientSecret']
        quiet: true

    - name: Read the pods Pod Security refused
      ansible.builtin.command:
        cmd: "{{ verify_kubectl }} get events --all-namespaces --field-selector=reason=FailedCreate --output=jsonpath={.items[*].message}"
      register: verify_refused
      changed_when: false

    - name: Check it refused none
      ansible.builtin.assert:
        that: verify_refused.stdout is not search('PodSecurity')
        fail_msg: "{{ verify_refused.stdout }}"
        quiet: true

    # The machine does not resolve its own name on the tailnet (it keeps
    # its own DNS), so curl is told the address; the certificate is
    # checked against the name all the same.
    - name: Read what the machine serves to the tailnet, and its address there
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop: [tailscale serve status --json, tailscale ip -4]
      register: verify_tailnet
      changed_when: false
      when: not (machine_runner | default(false))

    - name: Check it serves the owner's pages over HTTPS, and no more
      vars:
        access_serve: "{{ verify_tailnet.results[0] }}"
      ansible.builtin.assert:
        that: (access_serving | default('', true)).splitlines() | sort == (access_to_serve | default('', true)).splitlines() | sort
        fail_msg: "{{ access_serving | default('nothing', true) }}"
        quiet: true
      when: not (machine_runner | default(false))

    - name: Fetch a page through it, its certificate checked  # noqa: command-instead-of-module (uri cannot be told the address)
      vars:
        verify_served: >-
          {{ (verify_tailnet.results[0].stdout | from_json).Web | select('search', ':' ~ verify_served_port ~ '$') | first }}
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --fail
          - --max-time
          - "90"
          - --output
          - /dev/null
          - --resolve
          - "{{ verify_served }}:{{ verify_tailnet.results[1].stdout_lines[0] }}"
          - "https://{{ verify_served }}{{ verify_served_path }}"
      changed_when: false
      when: not (machine_runner | default(false))

    - name: Read what listens
      ansible.builtin.command:
        cmd: ss --listening --tcp --udp --numeric --processes --no-header
      register: verify_listening
      changed_when: false

    # The machine's public address is never in a log or a summary: a
    # public repository's are public. Its own global addresses outside
    # the tailnet and the cluster are replaced in the report.
    - name: Read the machine's own addresses
      ansible.builtin.command:
        cmd: ip -o -4 addr show scope global
      register: verify_addresses
      changed_when: false

    - name: Report it, without the public address
      vars:
        verify_public: >-
          {{ verify_addresses.stdout_lines
             | reject('search', '^\d+: (tailscale0|cni0|flannel\.1)\s')
             | map('regex_search', 'inet (\S+)/', '\1') | map('first') | list }}
      ansible.builtin.debug:
        msg: >-
          {{ verify_listening.stdout_lines
             | map('regex_replace', '(' ~ (verify_public | map('regex_escape') | join('|') if verify_public else '$^') ~ ')', '<public address>')
             | list }}
