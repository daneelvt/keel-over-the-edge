# AIDE's record of the system, made once the playbook has done its work;
# from then on the daily check compares against it. After a change the
# playbook makes on purpose, the next check reports it: aideinit -y -f on
# the machine makes the record again.
- name: Make AIDE's record of the system
  ansible.builtin.command:
    cmd: aideinit --yes --force
    creates: /var/lib/aide/aide.db
