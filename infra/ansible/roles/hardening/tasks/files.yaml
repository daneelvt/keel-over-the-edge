- name: Keep the account files at their modes
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/passwd, group: root, mode: "0644"}
    - {path: /etc/passwd-, group: root, mode: "0644"}
    - {path: /etc/group, group: root, mode: "0644"}
    - {path: /etc/group-, group: root, mode: "0644"}
    - {path: /etc/shadow, group: shadow, mode: "0640"}
    - {path: /etc/shadow-, group: shadow, mode: "0640"}
    - {path: /etc/gshadow, group: shadow, mode: "0640"}
    - {path: /etc/gshadow-, group: shadow, mode: "0640"}
  loop_control:
    label: "{{ item.path }}"

- name: Find world-writable files, and files without an owner
  ansible.builtin.command:
    cmd: >-
      find / -xdev ( -path /var/lib/rancher -o -path /var/lib/kubelet -o -path /var/lib/docker -o -path /var/lib/containerd ) -prune
      -o ( -type f -perm -0002 -o -nouser -o -nogroup ) -print
  register: hardening_loose
  changed_when: false
  check_mode: false

- name: Report them
  ansible.builtin.debug:
    msg: "{{ hardening_loose.stdout_lines }}"
  when: hardening_loose.stdout_lines | length > 0

- name: Check root's PATH holds no empty or relative folder
  ansible.builtin.assert:
    that: ansible_env.PATH.split(':') | reject('match', '^/') | list | length == 0
    fail_msg: "root's PATH is {{ ansible_env.PATH }}"
    quiet: true
