- name: Keep the account files at their modes
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/passwd, group: root, mode: "0644"}
    - {path: /etc/passwd-, group: root, mode: "0644"}
    - {path: /etc/group, group: root, mode: "0644"}
    - {path: /etc/group-, group: root, mode: "0644"}
    - {path: /etc/shadow, group: shadow, mode: "0640"}
    - {path: /etc/shadow-, group: shadow, mode: "0640"}
    - {path: /etc/gshadow, group: shadow, mode: "0640"}
    - {path: /etc/gshadow-, group: shadow, mode: "0640"}
  loop_control:
    label: "{{ item.path }}"

# The first 20, and how many in all: the containers' files are left out,
# and on a runner its toolchains, of which there are hundreds of thousands.
- name: Find world-writable files, and files without an owner
  vars:
    hardening_skip: >-
      {{ ['/var/lib/rancher', '/var/lib/kubelet', '/var/lib/docker', '/var/lib/containerd']
         + (hardening_scan_skip_runner if machine_runner | default(false) else []) }}
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      find / -xdev \( {{ hardening_skip | map('regex_replace', '^', '-path ') | join(' -o ') }} \) -prune
      -o \( -type f -perm -0002 -o -nouser -o -nogroup \) -print
      | awk 'NR <= 20; END { print NR " in all" }'
    executable: /bin/bash
  register: hardening_loose
  changed_when: false
  check_mode: false

- name: Report them
  ansible.builtin.debug:
    msg: "{{ hardening_loose.stdout_lines }}"
  when: hardening_loose.stdout_lines[-1] != '0 in all'

- name: Check root's PATH holds no empty or relative folder
  ansible.builtin.assert:
    that: ansible_facts.env.PATH.split(':') | reject('match', '^/') | list | length == 0
    fail_msg: "root's PATH is {{ ansible_facts.env.PATH }}"
    quiet: true
