# Written by the observe role. VictoriaLogs is in the cluster, which starts
# after the machine and stops for every upgrade: the upload waits for k3s,
# and when the logs cannot be reached it tries again for as long as it
# takes. It keeps its place in the journal (--save-state), so nothing is
# skipped meanwhile.
[Unit]
After=k3s.service
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=30
