# What the machine serves to the tailnet, as tailscale serve status --json
# says it (access_serve), and what the list says it should: each a sorted
# list with a line a page, its port, its path and where its requests go.
# Lists, so the two are equal whatever order tailscale names its pages in.
access_serve_web: "{{ (access_serve.stdout | default('{}', true) | from_json).Web | default({}, true) }}"
access_serving: >-
  {%- set pages = [] -%}
  {%- for host, web in access_serve_web.items() -%}
  {%- for path, handler in (web.Handlers | default({}, true)).items() -%}
  {%- set _ = pages.append((host.split(':') | last) ~ ' ' ~ path ~ ' ' ~ (handler.Proxy | default('-'))) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ pages | sort }}
access_to_serve: >-
  {%- set pages = [] -%}
  {%- for page in access_tailscale_serve -%}
  {%- set _ = pages.append(page.port ~ ' ' ~ (page.path | default('/')) ~ ' ' ~ page.target) -%}
  {%- endfor -%}
  {{ pages | sort }}
