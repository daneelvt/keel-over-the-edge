# SPDX-License-Identifier: AGPL-3.0-only
# Tailscale's apt repository and the key that signs it, pinned by its
# SHA-256: the same that infra/bootstrap/join.sh installs.
access_tailscale_keyring_url: https://pkgs.tailscale.com/stable/ubuntu/resolute.noarmor.gpg
access_tailscale_keyring_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
access_tailscale_keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
# The routes the machine advertises to the tailnet: the fixed addresses of
# Grafana, VictoriaMetrics' and VictoriaLogs' pages in the cluster, and of
# keel's internal listener, where the owner's world page is, so the
# owner's devices open them with no tunnel. The tailnet policy approves
# these and lets the tailnet's admins alone reach them, each on its port;
# tools/internal/manifests' Forwards say which, and a test there keeps
# this list the same.
access_tailscale_routes:
  - 10.43.0.50/32
  - 10.43.0.51/32
  - 10.43.0.52/32
  - 10.43.0.54/32
# What the machine serves to the tailnet over HTTPS, at its own name
# there, with a certificate Tailscale fetches and renews: the same pages,
# each on a port of its own, and of keel's internal listener the owner's
# world page alone. The tailnet policy lets the tailnet's admins alone
# reach each port; tools/internal/manifests' Forwards say which, and a
# test there keeps this list the same.
access_tailscale_serve:
  - port: 3000
    target: http://10.43.0.51:80
  - port: 8428
    target: http://10.43.0.52:8428
  - port: 9428
    target: http://10.43.0.50:9428
  - port: 9090
    path: /owner
    target: http://10.43.0.54:9090/owner
