# Ansible's settings for the playbook that configures production's machine.
# go run ./tools/machine -run runs it with this file, from this folder; see
# Ansible's documentation, "Ansible Configuration Settings".

[defaults]
inventory = inventory/production.yaml
roles_path = roles
# The machine has Ubuntu's Python; no guessing, no warning.
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# The machine's host key is checked against the one the tailnet holds for
# it, which tools/machine writes into a known_hosts of its own.
host_key_checking = True
# One machine: any failure stops the run.
any_errors_fatal = True
# Handlers run even when a later task fails, so a change is never left
# waiting on a handler that a failed run forgot.
force_handlers = True
# Each task's time, for the run's summary (tools/machine reads the files).
callbacks_enabled = ansible.builtin.junit
nocows = True

[ssh_connection]
# Modules are sent over the SSH session's standard input: nothing is
# written to the machine to be run.
pipelining = True
