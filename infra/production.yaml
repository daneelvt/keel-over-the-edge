# SPDX-License-Identifier: AGPL-3.0-only
# Production's identifiers, read by the machine, tailnet and accounts
# workflows' tools. None is a secret: a client ID or an identity ID only
# names who a workflow may sign in as, and Tailscale and Infisical let a
# workflow sign in only with a token GitHub issued to this repository's job
# in the production environment, running the one workflow each is bound
# to. Cloudflare's IDs and the bucket's name say which account, zone and
# bucket; only a credential kept in Infisical opens them.
#
# The machine's public address is not here, nor anywhere in the
# repository: nothing needs it once the machine is on the tailnet.
#
# Filled in by hand when the accounts are made (infra/MANUAL-STEPS.md); an
# empty value stops the tools that need it, saying which.

# The machine, by its name on the tailnet, and the tailnet's MagicDNS
# suffix (Tailscale's admin page, DNS).
machine: keel-prod-1
tailnet: "tail2bec2e.ts.net"

tailscale:
  # The federated identity the machine workflow joins the tailnet with
  # (scope auth_keys, tag tag:ci-prod).
  join:
    clientID: "TK5qqoFybF11CNTRL-krATC3use721CNTRL"
    audience: "api.tailscale.com/TK5qqoFybF11CNTRL-krATC3use721CNTRL"
  # The federated identity the tailnet workflow writes the policy with
  # (scope policy_file).
  policy:
    clientID: "TK5qqoFybF11CNTRL-k3dD7YeQN121CNTRL"
    audience: "api.tailscale.com/TK5qqoFybF11CNTRL-k3dD7YeQN121CNTRL"

infisical:
  # The region's host, as chosen when the account was made.
  host: "https://us.infisical.com"
  # gha-prod: the machine workflow's identity, signing in with GitHub's
  # OIDC token, and the audience it expects of that token.
  identityID: "5546676b-ce6a-436c-a971-f894c83b20ac"
  audience: https://github.com/daneelvt
  # keel-ops: the workflows' credentials, in its prod environment.
  project: "09d6ca0c-bc20-48e8-981e-e468b5aee626"
  environment: prod

  # gha-accounts: the accounts workflow's identity, signing in the same
  # way, with the same audience, and keel-accounts, its credentials'
  # project (prod environment, folder /accounts).
  accounts:
    identityID: "cea2124c-2c26-4383-8339-c57630908603"
    project: "87aed9be-8356-46dc-9cc8-f1fdf374b6be"
  # keel-cluster: what the cluster's External Secrets reads, by project ID
  # for OpenTofu, which writes the secrets it makes there, and by slug for
  # External Secrets' store (infra/cluster/clusters/prod/configs/
  # secret-store.yaml, which a test keeps the same).
  cluster:
    project: "563fce78-2a0d-4772-8f2c-97b2907cf82e"
    slug: "keel-cluster-x-j5y"

cloudflare:
  # The account (its Account ID) and the zone keelovertheedge.com (its
  # Zone ID), both on the zone's Overview page.
  account: ""
  zone: ""

# OpenTofu's state: the private B2 bucket made for it, and B2's S3
# endpoint and region for the account, as the bucket's page shows them
# (an endpoint as https://s3.us-west-004.backblazeb2.com).
state:
  bucket: keel-infra-state
  endpoint: https://s3.us-east-005.backblazeb2.com
  region: us-east-005
