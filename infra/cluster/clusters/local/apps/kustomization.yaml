# SPDX-License-Identifier: AGPL-3.0-only
# The game on the local cluster, in a VM on a developer's Mac: half
# production's sizes, HTTPS with a certificate from the developer's own
# root, and backups to a bucket of its own, with a key tools/cluster puts
# in the Secrets keel-b2 and keel-b2-read from .dev/backups.env. The
# weekly dump runs, but uploads to nowhere (rclone's memory backend). A release renders this with the game's image by digest, for a Mac
# named macbook. go run ./tools/cluster -deploy renders it with the image
# it built and imported, never pulled, and the Mac's own name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/keel
  - ../../../apps/keel-restore
  - https-redirect.yaml
  - tls-store.yaml
components:
  - ../../../apps/archive
configMapGenerator:
  - name: keel
    namespace: keel
    behavior: merge
    literals:
      - KEEL_PLAY_ORIGIN=https://macbook.local
      # The developer's commands, on the internal listener, which no route
      # leads to: the wind is set through the API server's proxy or a
      # port-forward, to sail in a calm, a breeze or a gale here.
      - KEEL_DEV_COMMANDS=1
      # The seed of a world made here: one the preview draws too
      # (go run ./tools/worldgen-preview -seed 1).
      - KEEL_WORLD_SEED=1
patches:
  - path: keel.yaml
  - path: database.yaml
  # The local cluster's bucket, never production's.
  - target:
      kind: ObjectStore
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://keel-db-backups-local/
  - target:
      kind: CronJob
      name: keel-db-dump
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/0/value
        value: ":memory:keel-db-dumps/local"
  # HTTPS on Traefik's websecure entry point, with the certificate
  # tools/cluster makes; the players' and AI apps' routes move to it. AI
  # apps reach the MCP address on the players' host, where keel expects
  # it by default (KEEL_AGENTS_URL unset: the play origin's /mcp).
  - target:
      kind: Gateway
      name: keel
    patch: |-
      - op: add
        path: /spec/listeners/-
        value:
          name: https
          port: 8443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              - name: keel-tls
          allowedRoutes:
            namespaces:
              from: Same
  - target:
      kind: HTTPRoute
      name: play
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https
  - target:
      kind: HTTPRoute
      name: agents
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https
  # No request here carries CF-Connecting-IP, so all share one count: the
  # limits are raised for the load bot's hundreds of boats from one Mac.
  - target:
      kind: Middleware
      name: per-address-rate
    patch: |-
      - op: replace
        path: /spec/rateLimit/average
        value: 2000
      - op: replace
        path: /spec/rateLimit/burst
        value: 4000
  - target:
      kind: Middleware
      name: per-address-connections
    patch: |-
      - op: replace
        path: /spec/inFlightReq/amount
        value: 4096
