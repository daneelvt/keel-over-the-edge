# Grafana's admin password, and the password of the database's read-only
# role grafana, which the accounts workflow made and wrote into Infisical
# (the second also into /keel, for the role itself).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        username: admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /monitoring/GRAFANA_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: /monitoring/DB_GRAFANA_PASSWORD
