# Traefik's values in production: those of infrastructure/configs/
# traefik.yaml, which this replaces whole (valuesContent is one string),
# and its Service as ClusterIP (the chart's service.spec.type; its default
# is LoadBalancer). The manifests' tests keep the two the same but for the
# Service.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
      # Nothing uses Ingress. The CRD provider stays for Traefik's own
      # middlewares.
      kubernetesIngress:
        enabled: false
    # The GatewayClass "traefik"; the game brings its own Gateway, so not
    # the chart's default one.
    gatewayClass:
      enabled: true
    gateway:
      enabled: false
    # Traefik's defaults, written down. readTimeout bounds how long a
    # request may take to arrive; a WebSocket is not cut by it, as Go's
    # server clears a connection's deadlines when the proxy hijacks it for
    # the upgrade. The game's stream is never idle.
    ports:
      web:
        transport:
          respondingTimeouts:
            readTimeout: 60s
            writeTimeout: 0s
            idleTimeout: 180s
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 60s
            writeTimeout: 0s
            idleTimeout: 180s
    # Reached only from inside the cluster: no NodePort, no external
    # address.
    service:
      spec:
        type: ClusterIP
