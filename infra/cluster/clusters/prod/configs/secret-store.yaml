# Where production's Secrets come from: Infisical's project keel-cluster,
# its prod environment, read as the identity eso-prod, whose credential the
# machine workflow put in external-secrets/infisical-universal-auth. Only
# the namespaces named here may use it, so a namespace added later cannot
# read the game's password. The host and the project's slug are
# infra/production.yaml's (infisical.host, infisical.cluster.slug); a test
# keeps them the same.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  conditions:
    - namespaces:
        - keel
        - cloudflared
  provider:
    infisical:
      hostAPI: https://us.infisical.com/api
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: ""
        environmentSlug: prod
        secretsPath: /
