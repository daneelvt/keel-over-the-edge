# SPDX-License-Identifier: AGPL-3.0-only
# The backups' keys: Infisical's project keel-backups, its prod
# environment, read as eso-prod, the same identity as the store infisical.
# A project of its own, because the accounts workflow's identity may read
# keel-cluster's values and must never read these (infra/MANUAL-STEPS.md).
# The game's namespace and the restore test's alone may use it. The slug is
# infra/production.yaml's (infisical.backups.slug; a test keeps them the
# same).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-backups
spec:
  conditions:
    - namespaces:
        - keel
        - keel-restore
  provider:
    infisical:
      hostAPI: https://us.infisical.com/api
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: "keel-backups"
        environmentSlug: prod
        secretsPath: /
