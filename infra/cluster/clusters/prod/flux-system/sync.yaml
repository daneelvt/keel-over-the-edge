# SPDX-License-Identifier: AGPL-3.0-only
# What production follows: the manifests the release workflow rendered,
# checked and signed, at the tag prod, which only the promote workflow
# moves. Flux looks every minute, and fetches an artifact only if this
# repository's release workflow, on main, signed it (cosign, keyless: the
# signer is the workflow's identity in the certificate Sigstore issued it,
# matched whole by these patterns). Not a pull request's run, another
# branch's, another workflow's, or a fork's.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: keel
  namespace: flux-system
spec:
  interval: 1m
  url: oci://ghcr.io/daneelvt/keel-manifests
  ref:
    tag: prod
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/daneelvt/keel-over-the-edge/\.github/workflows/release\.yaml@refs/heads/main$
---
# The artifact's layers, each applied once the one before it is ready:
# Flux itself, the controllers, their configuration, the game. What a
# release no longer holds is removed (prune), but deleting one of these
# objects deletes nothing it applied (Orphan).
#
# This first layer holds the three after it, which wait for it: so it
# waits for Flux's controllers alone, by name, and not for everything it
# applied, which would be waiting for them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: keel
  path: ./prod/flux-system
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: notification-controller
      namespace: flux-system
  deletionPolicy: Orphan
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: keel
  path: ./prod/controllers
  prune: true
  wait: true
  deletionPolicy: Orphan
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configs
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: keel
  path: ./prod/configs
  prune: true
  wait: true
  deletionPolicy: Orphan
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: keel
  path: ./prod/apps
  prune: true
  wait: true
  deletionPolicy: Orphan
