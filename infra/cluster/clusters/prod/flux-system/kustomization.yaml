# Production's Flux: its controllers, and what they follow. Given once to
# a new machine's Flux; from then on Flux applies it from the release it
# follows, as its first layer, and so upgrades itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../flux-system
  - sync.yaml
