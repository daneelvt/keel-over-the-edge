# SPDX-License-Identifier: AGPL-3.0-only
# The game in production: the base's sizes, which are production's, the
# players' address, the database's passwords and the backups' keys from
# Infisical, the weekly restore test, and cloudflared, which carries
# players' traffic in from Cloudflare.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/keel
  - ../../../apps/keel-restore
  - ../../../apps/cloudflared
  - keel-db-app.yaml
  - database-roles.yaml
  - backup-keys.yaml
components:
  - ../../../apps/archive
configMapGenerator:
  - name: keel
    namespace: keel
    behavior: merge
    literals:
      - KEEL_PLAY_ORIGIN=https://play.keelovertheedge.com
# The Gateway and the players' route answer the players' host alone.
patches:
  - target:
      kind: Gateway
      name: keel
    patch: |-
      - op: add
        path: /spec/listeners/0/hostname
        value: play.keelovertheedge.com
  - target:
      kind: HTTPRoute
      name: play
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - play.keelovertheedge.com
