# SPDX-License-Identifier: AGPL-3.0-only
# The game in production: the base's sizes, which are production's, the
# players' address and their passkeys' domain, the MCP address, the
# database's passwords and the backups' keys from Infisical, the
# contributor agreement keeper's GitHub App, the weekly restore test, and
# cloudflared, which carries players' and AI apps' traffic in from
# Cloudflare.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/keel
  - ../../../apps/keel-restore
  - ../../../apps/cloudflared
  - keel-db-app.yaml
  - database-roles.yaml
  - agreement-secrets.yaml
  - backup-keys.yaml
components:
  - ../../../apps/archive
configMapGenerator:
  - name: keel
    namespace: keel
    behavior: merge
    literals:
      - KEEL_PLAY_ORIGIN=https://play.keelovertheedge.com
      # Players' passkeys are the domain's, not the play host's alone.
      - KEEL_PASSKEY_RP_ID=keelovertheedge.com
      # The MCP address has a host of its own.
      - KEEL_AGENTS_URL=https://agents.keelovertheedge.com/mcp
  # The contributor agreement keeper's GitHub App, by its ID and client
  # ID, neither secret. Empty until the owner registers the App, then
  # filled in here by a pull request (infra/MANUAL-STEPS.md, section 15);
  # empty, the keeper runs "not set up".
  - name: keel-agreement
    namespace: keel
    behavior: merge
    literals:
      - KEEL_AGREEMENT_APP_ID=
      - KEEL_AGREEMENT_CLIENT_ID=
# The Gateway and the players' route answer the players' host alone; a
# second listener and AI apps' route answer the MCP address's host alone.
patches:
  - target:
      kind: Gateway
      name: keel
    patch: |-
      - op: add
        path: /spec/listeners/0/hostname
        value: play.keelovertheedge.com
      - op: add
        path: /spec/listeners/-
        value:
          name: agents
          port: 8000
          protocol: HTTP
          hostname: agents.keelovertheedge.com
          allowedRoutes:
            namespaces:
              from: Same
  - target:
      kind: HTTPRoute
      name: play
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - play.keelovertheedge.com
  - target:
      kind: HTTPRoute
      name: agents
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: agents
      - op: add
        path: /spec/hostnames
        value:
          - agents.keelovertheedge.com
  # The contributor agreement keeper's players' origin is keel's, from its
  # configuration: one place for it (a change to keel's configuration
  # restarts the keeper too).
  - target:
      kind: Deployment
      name: keel-agreement
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KEEL_PLAY_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: keel
              key: KEEL_PLAY_ORIGIN
