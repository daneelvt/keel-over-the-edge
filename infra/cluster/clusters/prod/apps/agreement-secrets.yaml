# SPDX-License-Identifier: AGPL-3.0-only
# The contributor agreement keeper's GitHub App: its private key, its
# webhook's secret and its client secret, which GitHub made when the owner
# registered the App, and the address its page shows for a guardian and
# for privacy requests, which the owner chose and keeps out of the
# repository. The owner puts all four in keel-cluster's folder
# /keel-agreement/ by hand (infra/MANUAL-STEPS.md), which the accounts
# workflow made empty; each key is the Infisical value's own name.
#
# Until they are there, a missing value leaves its key out rather than
# failing (deletionPolicy Merge: External Secrets skips a value Infisical
# does not have, and makes the Secret with what there is, even nothing).
# The keeper names each key as optional, so it starts without them, "not
# set up". It reads them when it starts: after a change, restart it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keel-agreement
  namespace: keel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: keel-agreement
    creationPolicy: Owner
    deletionPolicy: Merge
  data:
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: /keel-agreement/GITHUB_APP_PRIVATE_KEY
    - secretKey: GITHUB_APP_WEBHOOK_SECRET
      remoteRef:
        key: /keel-agreement/GITHUB_APP_WEBHOOK_SECRET
    - secretKey: GITHUB_APP_CLIENT_SECRET
      remoteRef:
        key: /keel-agreement/GITHUB_APP_CLIENT_SECRET
    - secretKey: CONTACT_EMAIL
      remoteRef:
        key: /keel-agreement/CONTACT_EMAIL
