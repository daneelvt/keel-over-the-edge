# SPDX-License-Identifier: AGPL-3.0-only
# Nothing reaches the operator but the scraper, on its metrics port: its
# webhooks are called by the API server, from the node, which kube-router
# always lets through, as it does the kubelet's probes. It reaches the
# databases' pods, which let it in, and the Barman Cloud plugin.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Its metrics, from the scraper.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 8080
          protocol: TCP
