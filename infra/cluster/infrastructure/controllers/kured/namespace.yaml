# SPDX-License-Identifier: AGPL-3.0-only
# Privileged: Kured enters the host's namespaces (host PID) to reboot it.
# It holds nothing else.
apiVersion: v1
kind: Namespace
metadata:
  name: kured
  annotations:
    keel/privileged-because: Kured enters the host's process namespace to reboot the machine.
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
