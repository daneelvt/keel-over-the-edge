# cert-manager v1.21.2: its controller, webhook and CA injector, each image
# pinned by the digest the release workflow checks against cert-manager's
# key. Its definitions come with the chart. No start-up check: a Helm hook's
# Job with an image of its own, which Flux's own readiness check of the
# Deployments makes needless. Its security contexts are the chart's, which
# keep Pod Security's restricted profile.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true
    image:
      digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
    webhook:
      image:
        digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    cainjector:
      image:
        digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
    # Never run: it answers ACME's HTTP challenges, and nothing here asks
    # an ACME issuer. Pinned all the same.
    acmesolver:
      image:
        digest: sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503
    startupapicheck:
      enabled: false
    # Starting values: a handful of certificates, renewed every few months.
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
