# Production's machine workflow puts the controller's credential for
# Infisical here (the Secret infisical-universal-auth): Flux never deletes
# the namespace, and so never the credential with it.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
