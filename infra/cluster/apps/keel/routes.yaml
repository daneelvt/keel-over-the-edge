# SPDX-License-Identifier: AGPL-3.0-only
# The players' routes: the page, the API and the game connection, all
# served by keel's game listener. Never the internal listener. The game
# connection counts against the connections one address may hold open;
# everything else against the requests it may make a second (the
# middlewares, through Gateway API filters naming them).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: play
spec:
  parentRefs:
    - name: keel
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /ws
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: per-address-connections
      backendRefs:
        - name: keel
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: per-address-rate
      backendRefs:
        - name: keel
          port: 8080
