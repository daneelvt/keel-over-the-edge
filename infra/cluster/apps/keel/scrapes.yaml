# SPDX-License-Identifier: AGPL-3.0-only
# What the scraper reads in the game's namespace: keel's metrics, every
# 15 s, on the listener that serves them alone; and the database's, on
# CloudNativePG's exporter in each instance (its own pod monitor is
# deprecated: written here instead). Each port is let in to the scraper by
# network-policies.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: keel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keel
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: keel-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: keel-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
