# SPDX-License-Identifier: AGPL-3.0-only
# The game's and its database's alerts, which vmalert evaluates against the
# metrics store and keeps in Alertmanager, shown on Grafana's Overview.
# Nothing is sent anywhere. Each says what to look at in its description;
# docs/development.md, "Monitoring", says what to do for each. Starting
# values: an alert that fires with nothing to do is changed, not silenced
# for good. Each rule has a test (rules/tests/, run by go test).
#
# component: game and database tie the alerts to the inhibitions: while
# GameDown or DatabaseDown fires, the rest of its component's are held
# back.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: keel
spec:
  groups:
    - name: game
      rules:
        - alert: GameDown
          expr: (sum(kube_deployment_status_replicas_ready{namespace="keel", deployment="keel"}) or vector(0)) < 1
          for: 2m
          labels:
            severity: critical
            component: game
          annotations:
            summary: No keel is ready.
            description: Nobody can play. Look at keel's pod and its logs, and at the database.
        - alert: TickOverrun
          expr: histogram_quantile(0.99, sum(rate(keel_sim_tick_duration_seconds_bucket[1m])) by (le)) > 0.025
          for: 5m
          labels:
            severity: critical
            component: game
          annotations:
            summary: "The tick's 99th percentile is {{ $value | humanizeDuration }}, near the 33 ms budget."
            description: The world is close to falling behind. The Game dashboard shows which phase grew, and the Machine dashboard whether the CPU is stolen or throttled.
        - alert: PersistenceLag
          expr: keel_persist_oldest_seconds > 10
          for: 1m
          labels:
            severity: critical
            component: game
          annotations:
            summary: "keel's oldest unwritten change is {{ $value | humanizeDuration }} old."
            description: The database is not keeping up with the world, or not answering. A crash now would lose what is waiting.
        - alert: QueueWaiting
          expr: max(keel_sim_queue_length) > 0
          for: 10m
          labels:
            severity: warning
            component: game
          annotations:
            summary: "{{ $value }} players have waited for a boat for 10 minutes."
            description: The sea is at its boat limit. Look at the tick's time before raising KEEL_BOAT_LIMIT.
        - alert: MemoryNearLimit
          expr: |
            max by (pod, container) (container_memory_working_set_bytes{namespace="keel", container=~"keel|postgres"})
              / max by (pod, container) (kube_pod_container_resource_limits{namespace="keel", resource="memory", container=~"keel|postgres"})
              > 0.9
          for: 10m
          labels:
            severity: warning
            component: game
          annotations:
            summary: "{{ $labels.container }} uses {{ $value | humanizePercentage }} of its memory limit."
            description: Near its limit, it is killed and restarted. Look at its memory over the last days on the Game or Database dashboard.
        - alert: CPUThrottled
          expr: |
            sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="keel", container="keel"}[5m]))
              / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="keel", container="keel"}[5m]))
              > 0.1
          for: 10m
          labels:
            severity: warning
            component: game
          annotations:
            summary: "keel is throttled in {{ $value | humanizePercentage }} of its CPU periods."
            description: Its CPU limit holds the tick back. The Game dashboard shows whether the tick suffers.
    - name: database
      rules:
        - alert: DatabaseDown
          expr: (max(cnpg_collector_up{namespace="keel"}) or vector(0)) < 1
          for: 2m
          labels:
            severity: critical
            component: database
          annotations:
            summary: The game's database does not answer.
            description: keel cannot write the world. Look at keel-db-1's pod, its logs and CloudNativePG's.
        - alert: WALArchivingFailing
          expr: |
            max(cnpg_pg_stat_archiver_last_failed_time{namespace="keel"}) > max(cnpg_pg_stat_archiver_last_archived_time{namespace="keel"})
              or max(cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="keel"}) > 900
          for: 10m
          labels:
            severity: critical
            component: database
          annotations:
            summary: WAL is not reaching the backups.
            description: The world's changes since the last archived segment are on this machine alone, and pg_wal grows. Look at the plugin's sidecar's logs in keel-db-1 (container plugin-barman-cloud).
        - alert: BackupStale
          expr: |
            time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="keel"}) > 26 * 3600
              or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="keel"})
          for: 30m
          labels:
            severity: warning
            component: database
          annotations:
            summary: No base backup for more than 26 hours.
            description: A restore would replay more WAL than it should. Look at the Backup objects in keel, and the sidecar's logs.
        - alert: DatabaseConnections
          expr: sum(cnpg_backends_total{namespace="keel"}) / max(cnpg_pg_settings_setting{namespace="keel", name="max_connections"}) > 0.8
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "The database holds {{ $value | humanizePercentage }} of its connections."
            description: Look at who holds them on the Database dashboard.
        - alert: LongTransaction
          expr: max(cnpg_backends_max_tx_duration_seconds{namespace="keel"}) > 300
          for: 1m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "A transaction has been open for {{ $value | humanizeDuration }}."
            description: It holds back vacuum and may hold locks. pg_stat_activity names it.
        - alert: TransactionIDAge
          expr: max(cnpg_pg_database_xid_age{namespace="keel"}) > 1e9
          labels:
            severity: warning
            component: database
          annotations:
            summary: "The oldest transaction ID is {{ $value }} old."
            description: At two billion PostgreSQL stops accepting writes. Something keeps vacuum from freezing old rows.
    # A CronJob's last success, or when it was made if it has none yet; and
    # whether its newest Job failed (two failed and two passed are kept).
    - name: jobs
      rules:
        - alert: DumpStale
          expr: |
            time() - (
              max(kube_cronjob_status_last_successful_time{namespace="keel", cronjob="keel-db-dump"})
                or max(kube_cronjob_created{namespace="keel", cronjob="keel-db-dump"})
            ) > 8 * 86400
          for: 1h
          labels:
            severity: warning
            component: database
          annotations:
            summary: The weekly dump has not succeeded for 8 days.
            description: Look at keel-db-dump's Jobs in keel, and their logs in VictoriaLogs.
        - alert: DumpFailed
          expr: |
            sum by (job_name) (kube_job_status_failed{namespace="keel", job_name=~"keel-db-dump-.+"}) > 0
              and on (job_name)
            (
              kube_job_status_start_time{namespace="keel", job_name=~"keel-db-dump-.+"}
                == on () group_left max(kube_job_status_start_time{namespace="keel", job_name=~"keel-db-dump-.+"})
            )
          labels:
            severity: warning
            component: database
          annotations:
            summary: "The weekly dump's last run, {{ $labels.job_name }}, failed."
            description: Its log says which step failed. Run it again once fixed, kubectl -n keel create job --from=cronjob/keel-db-dump keel-db-dump-by-hand.
        - alert: RestoreTestStale
          expr: |
            time() - (
              max(kube_cronjob_status_last_successful_time{namespace="keel-restore", cronjob="keel-restore-test"})
                or max(kube_cronjob_created{namespace="keel-restore", cronjob="keel-restore-test"})
            ) > 8 * 86400
          for: 1h
          labels:
            severity: warning
            component: database
          annotations:
            summary: The weekly restore test has not passed for 8 days.
            description: Look at keel-restore-test's Jobs in keel-restore, and their logs in VictoriaLogs.
        - alert: RestoreTestFailed
          expr: |
            sum by (job_name) (kube_job_status_failed{namespace="keel-restore", job_name=~"keel-restore-test-.+"}) > 0
              and on (job_name)
            (
              kube_job_status_start_time{namespace="keel-restore", job_name=~"keel-restore-test-.+"}
                == on () group_left max(kube_job_status_start_time{namespace="keel-restore", job_name=~"keel-restore-test-.+"})
            )
          labels:
            severity: warning
            component: database
          annotations:
            summary: "The weekly restore test's last run, {{ $labels.job_name }}, failed."
            description: Its line "restore test" in VictoriaLogs says which check failed. Run it again once fixed, kubectl -n keel-restore create job --from=cronjob/keel-restore-test keel-restore-test-by-hand.
