# SPDX-License-Identifier: AGPL-3.0-only
# The game's and its database's alerts, which vmalert evaluates against the
# metrics store and keeps in Alertmanager, shown on Grafana's Overview.
# Nothing is sent anywhere. Starting values: an alert that fires with
# nothing to do is changed, not silenced for good. Each rule is tested
# (infra/cluster/monitoring/rules/tests, run by go test).
#
# Each alert's summary is a label, one plain sentence with no value in it,
# so the Overview's table can show it beside the alert (the alerts' own
# series carry labels, not annotations); its description holds the value
# and where to look. component ties an alert to the inhibitions: while
# GameDown or DatabaseDown fires, the rest of its component's are held
# back.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: keel
spec:
  groups:
    - name: game
      rules:
        - alert: GameDown
          expr: (sum(kube_deployment_status_replicas_ready{namespace="keel", deployment="keel"}) or vector(0)) < 1
          for: 2m
          labels:
            severity: critical
            component: game
            summary: "No keel is ready: nobody can play."
          annotations:
            description: "Look at keel's pod and its logs, and at the database."
        - alert: TickOverrun
          expr: histogram_quantile(0.99, sum(rate(keel_sim_tick_duration_seconds_bucket[1m])) by (le)) > 0.025
          for: 5m
          labels:
            severity: critical
            component: game
            summary: "The tick is close to its 33 ms budget."
          annotations:
            description: "Its 99th percentile is {{ $value | humanizeDuration }}. The Game dashboard shows which phase grew, and the Machine dashboard whether the CPU is stolen or throttled."
        - alert: PersistenceLag
          expr: keel_persist_oldest_seconds > 10
          for: 1m
          labels:
            severity: critical
            component: game
            summary: "keel's changes are not reaching the database."
          annotations:
            description: "The oldest unwritten change is {{ $value | humanizeDuration }} old: the database is not keeping up, or not answering. A crash now would lose what is waiting."
        - alert: QueueWaiting
          expr: max(keel_sim_queue_length) > 0
          for: 10m
          labels:
            severity: warning
            component: game
            summary: "Players have waited for a boat for 10 minutes."
          annotations:
            description: "{{ $value }} wait: the sea is at its boat limit. Look at the tick's time before raising KEEL_BOAT_LIMIT."
        - alert: MachineSailorsShutOut
          # While the sea is under its limit and machine sailors sail fewer
          # boats than their reserve, the head of their queue is the next
          # admitted: one waiting ten minutes is admission broken.
          expr: |
            max(keel_sim_queue_oldest_seconds{kind="machine"}) > 600
              and on () max(keel_sim_boats_by_kind{kind="machine"}) < max(keel_sim_ai_reserve)
              and on () max(keel_sim_boats) < max(keel_sim_boat_limit)
          for: 5m
          labels:
            severity: warning
            component: game
            summary: "Machine sailors wait while places kept for them are free."
          annotations:
            description: "The head of the machine sailors' queue has waited {{ $value | humanizeDuration }} while they sail fewer boats than their reserve and the sea has room: admission is not keeping their places. Look at the queues on the world page and at keel's logs."
        - alert: MemoryNearLimit
          expr: |
            max by (pod, container) (container_memory_working_set_bytes{namespace="keel", container=~"keel|postgres"})
              / max by (pod, container) (kube_pod_container_resource_limits{namespace="keel", resource="memory", container=~"keel|postgres"})
              > 0.9
          for: 10m
          labels:
            severity: warning
            component: game
            summary: "keel or its database is near its memory limit."
          annotations:
            description: "{{ $labels.container }} uses {{ $value | humanizePercentage }} of its limit; at the limit it is killed and restarted. Look at its memory over the last days on the Game or Database dashboard."
        - alert: CPUThrottled
          expr: |
            sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="keel", container="keel"}[5m]))
              / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="keel", container="keel"}[5m]))
              > 0.1
          for: 10m
          labels:
            severity: warning
            component: game
            summary: "keel's CPU limit is holding it back."
          annotations:
            description: "It is throttled in {{ $value | humanizePercentage }} of its CPU periods. The Game dashboard shows whether the tick suffers."
    - name: world
      rules:
        - alert: WorldNextNotReady
          expr: (max(keel_world_ends_timestamp_seconds) - time()) < 6 * 3600 unless on () max(keel_world_next_ready) >= 1
          for: 5m
          labels:
            severity: critical
            component: game
            summary: "The next world is not made six hours before the world's end."
          annotations:
            description: "The world ends in {{ $value | humanizeDuration }} and its successor is not stored: the switch would make it then, late. Look at the next-world job's runs on the world page and at keel's logs."
        - alert: JobFailing
          expr: |
            sum by (name) (increase(keel_job_runs_total{outcome="failed"}[30m])) > 0
              unless on (name) sum by (name) (increase(keel_job_runs_total{outcome!="failed"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            component: game
            summary: "One of keel's jobs keeps failing."
          annotations:
            description: "The job {{ $labels.name }} has failed for half an hour without a run that succeeded. Its runs, and why each failed, are on the world page."
    - name: database
      rules:
        - alert: DatabaseDown
          expr: (max(cnpg_collector_up{namespace="keel"}) or vector(0)) < 1
          for: 2m
          labels:
            severity: critical
            component: database
            summary: "The game's database does not answer."
          annotations:
            description: "keel cannot write the world. Look at keel-db-1's pod, its logs and CloudNativePG's."
        - alert: WALArchivingFailing
          expr: |
            max(cnpg_pg_stat_archiver_last_failed_time{namespace="keel"}) > max(cnpg_pg_stat_archiver_last_archived_time{namespace="keel"})
              or max(cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="keel"}) > 900
          for: 10m
          labels:
            severity: critical
            component: database
            summary: "WAL is not reaching the backups."
          annotations:
            description: "The world's changes since the last archived segment are on this machine alone, and pg_wal grows. Look at the plugin's sidecar's logs in keel-db-1 (container plugin-barman-cloud)."
        - alert: BackupStale
          expr: |
            time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="keel"}) > 26 * 3600
              or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="keel"})
          for: 30m
          labels:
            severity: warning
            component: database
            summary: "No base backup for more than 26 hours."
          annotations:
            description: "A restore would replay more WAL than it should. Look at the Backup objects in keel, and the sidecar's logs."
        - alert: DatabaseConnections
          expr: sum(cnpg_backends_total{namespace="keel"}) / max(cnpg_pg_settings_setting{namespace="keel", name="max_connections"}) > 0.8
          for: 5m
          labels:
            severity: warning
            component: database
            summary: "The database is near its connection limit."
          annotations:
            description: "It holds {{ $value | humanizePercentage }} of max_connections. The Database dashboard shows who holds them."
        - alert: LongTransaction
          expr: max(cnpg_backends_max_tx_duration_seconds{namespace="keel"}) > 300
          for: 1m
          labels:
            severity: warning
            component: database
            summary: "A transaction has been open for more than 5 minutes."
          annotations:
            description: "Open for {{ $value | humanizeDuration }}: it holds back vacuum and may hold locks. pg_stat_activity names it."
        - alert: TransactionIDAge
          expr: max(cnpg_pg_database_xid_age{namespace="keel"}) > 1e9
          labels:
            severity: warning
            component: database
            summary: "Transaction IDs are a billion old."
          annotations:
            description: "The oldest is {{ $value }} old; at two billion PostgreSQL stops accepting writes. Something keeps vacuum from freezing old rows."
    # A CronJob's last success, or when it was made if it has none yet; and
    # whether its newest Job failed (two failed and two passed are kept).
    - name: jobs
      rules:
        - alert: DumpStale
          expr: |
            time() - (
              max(kube_cronjob_status_last_successful_time{namespace="keel", cronjob="keel-db-dump"})
                or max(kube_cronjob_created{namespace="keel", cronjob="keel-db-dump"})
            ) > 8 * 86400
          for: 1h
          labels:
            severity: warning
            component: database
            summary: "The weekly dump has not succeeded for 8 days."
          annotations:
            description: "Look at keel-db-dump's Jobs in keel, and their logs in VictoriaLogs."
        - alert: DumpFailed
          expr: |
            sum by (job_name) (kube_job_status_failed{namespace="keel", job_name=~"keel-db-dump-.+"}) > 0
              and on (job_name)
            (
              kube_job_status_start_time{namespace="keel", job_name=~"keel-db-dump-.+"}
                == on () group_left max(kube_job_status_start_time{namespace="keel", job_name=~"keel-db-dump-.+"})
            )
          labels:
            severity: warning
            component: database
            summary: "The weekly dump's last run failed."
          annotations:
            description: "{{ $labels.job_name }} failed; its log says which step. Run it again once fixed, kubectl -n keel create job --from=cronjob/keel-db-dump keel-db-dump-by-hand."
        - alert: RestoreTestStale
          expr: |
            time() - (
              max(kube_cronjob_status_last_successful_time{namespace="keel-restore", cronjob="keel-restore-test"})
                or max(kube_cronjob_created{namespace="keel-restore", cronjob="keel-restore-test"})
            ) > 8 * 86400
          for: 1h
          labels:
            severity: warning
            component: database
            summary: "The weekly restore test has not passed for 8 days."
          annotations:
            description: "Look at keel-restore-test's Jobs in keel-restore, and their logs in VictoriaLogs."
        - alert: RestoreTestFailed
          expr: |
            sum by (job_name) (kube_job_status_failed{namespace="keel-restore", job_name=~"keel-restore-test-.+"}) > 0
              and on (job_name)
            (
              kube_job_status_start_time{namespace="keel-restore", job_name=~"keel-restore-test-.+"}
                == on () group_left max(kube_job_status_start_time{namespace="keel-restore", job_name=~"keel-restore-test-.+"})
            )
          labels:
            severity: warning
            component: database
            summary: "The weekly restore test's last run failed."
          annotations:
            description: "{{ $labels.job_name }} failed; its line \"restore test\" in VictoriaLogs says which check. Run it again once fixed, kubectl -n keel-restore create job --from=cronjob/keel-restore-test keel-restore-test-by-hand."
