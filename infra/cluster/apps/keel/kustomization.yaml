# SPDX-License-Identifier: AGPL-3.0-only
# The game: keel, its database and its backups, the contributor agreement
# keeper beside it, the Gateway and routes that reach them, and what
# watches them.
# Sizes are production's (a machine of 4 cores and 16 GB); each cluster's
# entry point under clusters/ patches what differs, and names the players'
# host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keel
labels:
  - pairs:
      app.kubernetes.io/part-of: keel
resources:
  - namespace.yaml
  - database.yaml
  - database-monitoring.yaml
  - generation.yaml
  - object-store.yaml
  - backup.yaml
  - dump.yaml
  - deployment.yaml
  - service.yaml
  - agreement.yaml
  - forward.yaml
  - gateway.yaml
  - routes.yaml
  - middlewares.yaml
  - network-policies.yaml
  - scrapes.yaml
  - rules.yaml
# keel's configuration (keel serve's usage lists every variable). A change
# makes a new name, and so a new pod.
configMapGenerator:
  - name: keel
    literals:
      - KEEL_PLAY_ADDR=0.0.0.0:8080
      - KEEL_AGENTS_ADDR=0.0.0.0:8081
      # Reached by the kubelet's probes, through the Service by nothing
      # outside the cluster: no route leads to it.
      - KEEL_INTERNAL_ADDR=0.0.0.0:9090
      # The metrics alone, for the scraper, which may reach nothing else.
      - KEEL_METRICS_ADDR=0.0.0.0:9091
      - KEEL_LOG_LEVEL=info
      - KEEL_TRACE_DIR=/var/lib/keel/traces
      # Every world ends on Sunday at 6 pm in New York, where most players
      # are, all year: closing three days before, the next world made a
      # day before. An ended world's data is kept four weeks.
      - KEEL_WORLD_SCHEDULE=Sun 18:00 America/New_York notice=72h ahead=24h
      - KEEL_WORLD_KEEP=672h
      # The password comes from PGPASSWORD, which pgx reads under any URL;
      # the server's certificate is checked against the operator's CA.
      - KEEL_DATABASE_URL=postgres://keel@keel-db-rw.keel.svc:5432/keel?sslmode=verify-full&sslrootcert=/etc/keel/db-ca/ca.crt
  # The contributor agreement keeper's (keel agreement's usage lists every
  # variable); its database role is its own. Its players' origin is
  # keel's, which each cluster's entry point hands it.
  - name: keel-agreement
    literals:
      # Its page and GitHub's webhook, reached from Traefik alone.
      - KEEL_AGREEMENT_ADDR=0.0.0.0:8082
      # The probes, and the owner's keel admin agreements, run in its pod.
      - KEEL_INTERNAL_ADDR=0.0.0.0:9090
      - KEEL_METRICS_ADDR=0.0.0.0:9091
      - KEEL_LOG_LEVEL=info
      - KEEL_DATABASE_URL=postgres://agreement@keel-db-rw.keel.svc:5432/keel?sslmode=verify-full&sslrootcert=/etc/keel/db-ca/ca.crt
      # The GitHub App's ID and client ID, neither secret: empty until the
      # owner registers it, and set by production's entry point alone.
      - KEEL_AGREEMENT_APP_ID=
      - KEEL_AGREEMENT_CLIENT_ID=
