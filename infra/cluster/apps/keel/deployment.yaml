# SPDX-License-Identifier: AGPL-3.0-only
# keel: one process holds the world, so one replica, and a new version
# replaces the old one rather than running beside it. The schema is brought
# up to the new version first, by keel migrate in an init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel
  labels:
    app.kubernetes.io/name: keel
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # keel stops within about 11 s: the bell (KEEL_BELL, 3 s), the world's
      # final checkpoint (at most 5 s), and the game connections' closes (at
      # most 3 s); requests in flight are waited for beside them (at most
      # 10 s). Only one process ever runs the world (the simulation's lease
      # in the database): a pod deleted by hand, whose replacement starts at
      # once, waits for it, not ready.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/daneelvt/keel
          args: [migrate]
          envFrom:
            - configMapRef:
                name: keel
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keel-db-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: db-ca
              mountPath: /etc/keel/db-ca
              readOnly: true
      containers:
        - name: keel
          image: ghcr.io/daneelvt/keel
          args: [serve]
          ports:
            - name: play
              containerPort: 8080
            - name: agents
              containerPort: 8081
            - name: internal
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: keel
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keel-db-app
                  key: password
            # Go's collector works to stay under this, about 90% of the
            # memory limit; GOMAXPROCS follows the CPU limit by itself.
            - name: GOMEMLIMIT
              value: 3600MiB
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "3"
              memory: 4Gi
          # /livez answers from the first moment, while the database is
          # waited for; /readyz once the world ticks and the listeners are
          # open, and no longer from the moment the process starts to stop.
          livenessProbe:
            httpGet:
              path: /livez
              port: internal
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: internal
            periodSeconds: 2
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: traces
              mountPath: /var/lib/keel/traces
            - name: db-ca
              mountPath: /etc/keel/db-ca
              readOnly: true
      volumes:
        # Traces of ticks that overran, for as long as the pod lives.
        - name: traces
          emptyDir:
            sizeLimit: 256Mi
        # The database's CA certificate alone, never its key.
        - name: db-ca
          secret:
            secretName: keel-db-ca
            items:
              - key: ca.crt
                path: ca.crt
