# SPDX-License-Identifier: AGPL-3.0-only
# The machine's alerts, from node-exporter and from the facts the playbook
# writes for it (keel_machine_*: AIDE's last check, a reboot required,
# security updates waiting). Starting values.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: machine
spec:
  groups:
    - name: machine
      rules:
        # Always firing: that it shows on the Overview says the alerts'
        # whole path works. Its absence is the alert.
        - alert: Watchdog
          expr: vector(1)
          labels:
            severity: none
            summary: "The alerts' path works."
          annotations:
            description: "Always firing. If it is missing from the Overview, vmalert or Alertmanager is not running."
        - alert: DiskFull
          expr: |
            1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} > 0.9
              or predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 24 * 3600) < 0
          for: 15m
          labels:
            severity: critical
            component: machine
            summary: "The root filesystem is over 90% full, or will be full within a day."
          annotations:
            description: "Every volume shares it (local-path enforces no size). The Machine dashboard shows how full it is and which volume grows; the database stops when it is full."
        - alert: DiskHigh
          expr: 1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} > 0.8
          for: 30m
          labels:
            severity: warning
            component: machine
            summary: "The root filesystem is over 80% full."
          annotations:
            description: "It is {{ $value | humanizePercentage }} full. Look at what grows on the Machine dashboard before it is full."
        - alert: CPUSteal
          expr: avg(rate(node_cpu_seconds_total{mode="steal"}[5m])) > 0.1
          for: 15m
          labels:
            severity: warning
            component: machine
            summary: "The host is taking the machine's CPU time."
          annotations:
            description: "{{ $value | humanizePercentage }} of it: a neighbour on the host is busy, and the tick may suffer. If it lasts, ask the provider."
        - alert: MemoryPressure
          expr: rate(node_pressure_memory_waiting_seconds_total[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
            component: machine
            summary: "Processes are waiting for memory."
          annotations:
            description: "Some wait {{ $value | humanizePercentage }} of the time: the machine is short of memory. The Machine dashboard shows who uses it."
        - alert: TransferOnCourse
          expr: |
            sum(rate(node_network_transmit_bytes_total{device!~"lo|veth.+|cni.+|flannel.+|tailscale.+|kube-.+|docker.+"}[1d])) * 86400 * days_in_month()
              > 0.8 * 16e12
          for: 1h
          labels:
            severity: warning
            component: machine
            summary: "This month's transfer is on course to pass 80% of 16 TB."
          annotations:
            description: "At today's rate the machine sends {{ $value | humanize1024 }}B this month; past 16 TB the provider bills or limits it. Look at bytes per player on the Game dashboard."
        - alert: ClockOffset
          expr: abs(node_timex_offset_seconds) > 0.05
          for: 10m
          labels:
            severity: warning
            component: machine
            summary: "The machine's clock is more than 50 ms off."
          annotations:
            description: "It is {{ $value | humanizeDuration }} off: chrony is not keeping it, and the world's time follows it. Look at chronyc tracking on the machine."
        - alert: RebootPending
          expr: time() - keel_machine_reboot_required_since_timestamp_seconds > 7 * 86400
          labels:
            severity: warning
            component: machine
            summary: "An update has waited a week for a reboot."
          annotations:
            description: "Kured has not rebooted the machine in its window: something else fired, or a drain did not finish. Reboot it with the machine workflow, reboot ticked."
        - alert: UpdatesPending
          expr: keel_machine_security_updates > 0
          for: 3d
          labels:
            severity: warning
            component: machine
            summary: "Security updates have waited three days."
          annotations:
            description: "{{ $value }} wait: unattended-upgrades did not install them. Its log is in the journal, in VictoriaLogs."
        - alert: IntegrityChanged
          expr: keel_machine_aide_changed_files + keel_machine_aide_added_files + keel_machine_aide_removed_files > 0
          labels:
            severity: warning
            component: machine
            summary: "AIDE found files changed since the playbook's record."
          annotations:
            description: "{{ $value }} files. Its report is in the journal (aide's unit), in VictoriaLogs. An update explains most; the next apply of the playbook records the system again."
