# The machine's alerts that wait for days (monitoring/rules/machine.yaml),
# evaluated every five minutes here so a week passes quickly.
# vmalert-tool's clock starts at 2000-01-01 UTC, 946684800: a time a
# series holds, where a rule compares it with now, counts from there.
evaluation_interval: 5m
tests:
  - name: a reboot has been required for a week, and updates wait
    interval: 5m
    input_series:
      - series: keel_machine_reboot_required_since_timestamp_seconds
        values: 946684800x2100
      - series: keel_machine_security_updates
        values: 4x2100
    alert_rule_test:
      - eval_time: 6d
        groupname: machine
        alertname: RebootPending
        exp_alerts: []
      - eval_time: 7d1h
        groupname: machine
        alertname: RebootPending
        exp_alerts:
          - exp_labels:
              severity: warning
              component: machine
              summary: "An update has waited a week for a reboot."
            exp_annotations:
              description: "Kured has not rebooted the machine in its window: something else fired, or a drain did not finish. Reboot it with the machine workflow, reboot ticked."
      - eval_time: 2d
        groupname: machine
        alertname: UpdatesPending
        exp_alerts: []
      - eval_time: 3d1h
        groupname: machine
        alertname: UpdatesPending
        exp_alerts:
          - exp_labels:
              severity: warning
              component: machine
              summary: "Security updates have waited three days."
            exp_annotations:
              description: "4 wait: unattended-upgrades did not install them. Its log is in the journal, in VictoriaLogs."
  - name: a newer kernel has waited two weeks
    interval: 5m
    input_series:
      - series: 'keel_machine_kernel_waiting_since_timestamp_seconds{kernel="7.0.0-42-generic",booted="7.0.0-38-generic"}'
        values: 946684800x4300
    alert_rule_test:
      - eval_time: 13d
        groupname: machine
        alertname: KernelWaiting
        exp_alerts: []
      - eval_time: 14d1h
        groupname: machine
        alertname: KernelWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              component: machine
              summary: "A newer kernel has waited two weeks to be tried."
              kernel: 7.0.0-42-generic
              booted: 7.0.0-38-generic
            exp_annotations:
              description: "7.0.0-42-generic is installed; the machine boots 7.0.0-38-generic, the updates role's updates_kernel. Try it on the local cluster's VM as the role says, then name it and apply with reboot ticked."
