# What may reach what the monitoring layer runs. The monitoring namespace
# denies everything by default (the controllers layer's deny-ingress);
# these let in exactly what each needs. The owner's forwards come from the
# node, which kube-router always lets through, as do the kubelet's probes.
# node-exporter uses the host's network, where no policy applies; it
# listens on 9100, which the machine's firewall keeps from the internet.
#
# The metrics store: written by the scraper and vmalert, read by vmalert
# and Grafana.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 8428
          protocol: TCP
---
# The logs store: written by vlagent, read by Grafana, scraped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vlsingle
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vlsingle
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-node
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vlagent
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 9428
          protocol: TCP
---
# vmalert: its rules and alerts through the metrics store's proxy, Kured
# asking whether anything fires before a reboot, and the scraper, which
# also reads the configuration reloader beside it (8435).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmalert
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmsingle
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kured
          podSelector:
            matchLabels:
              name: kured
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 8435
          protocol: TCP
---
# Alertmanager: alerts from vmalert, alerts and silences read and written
# by Grafana, and the scraper, which also reads the configuration reloader
# beside it (8435).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmalertmanager
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmalertmanager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 9093
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 8435
          protocol: TCP
---
# The scraper's own metrics, which it scrapes itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmagent
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 8429
          protocol: TCP
---
# Grafana and kube-state-metrics: their metrics, from the scraper. The
# owner reaches Grafana through the forward, from the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 8080
          protocol: TCP
---
# monitoring-node: nothing but the scraper, on vlagent's metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
  namespace: monitoring-node
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vlagent
  namespace: monitoring-node
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vlagent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 9429
          protocol: TCP
