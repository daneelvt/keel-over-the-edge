# SPDX-License-Identifier: AGPL-3.0-only
# Flux's controllers: source, kustomize, helm and notification. Applied
# first, by tools/cluster; they install the charts of
# infrastructure/controllers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Flux's own manifests (Apache-2.0), written whole by the pinned Flux CLI
  # (Renovate's flux manager rewrites them with it):
  #   flux install --export --version=<its version> > infra/cluster/flux-system/gotk-components.yaml
  - gotk-components.yaml
# The images flux install names by tag, pinned by the digest of each
# multi-platform index.
images:
  - name: ghcr.io/fluxcd/source-controller
    newTag: v1.10.1@sha256:611b6bca3eae95bcff471414d1fb14a4ab83d7f14e609cccef2bd389c121f37e
  - name: ghcr.io/fluxcd/kustomize-controller
    newTag: v1.10.1@sha256:37db29b25dae35b881a5e064acedb0cc954442da453a39eaa0eab7a90dbecc4e
  - name: ghcr.io/fluxcd/helm-controller
    newTag: v1.7.1@sha256:54526cc6ed1202d71d44c310676448065664f3255ad671d9a69ac26f904e617a
  - name: ghcr.io/fluxcd/notification-controller
    newTag: v1.10.0@sha256:9f58b9532ec9d3ccf539cd3ccdf283477a5dcb7777b922db5477d8bbd4d3767c
# Pod Security's restricted profile enforced on Flux's namespace too, as on
# every namespace the manifests hold; flux install only warns.
patches:
  - target:
      kind: Namespace
      name: flux-system
    patch: |-
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: restricted
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce-version
        value: latest
